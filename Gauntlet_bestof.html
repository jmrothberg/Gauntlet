// ----- palette ---------------------------------------------------------------
// 0 = transparent; 1-F = 15 colors (Lynx-inspired)
const PAL = [
  null,       // 0 transparent
  '#000000',  // 1 outline / black
  '#2d5016',  // 2 dark grass
  '#4a7c1e',  // 3 mid grass
  '#6db33a',  // 4 light grass
  '#3d2817',  // 5 dark dirt / wall shadow
  '#8b5a2b',  // 6 mid dirt / wood

];

// ----- sprite baker ----------------------------------------------------------
// Input: array of equal-length strings. '.' transparent, '0'-'F' palette idx.
// Output: canvas at native pixel resolution (not scaled). Renderer scales on draw.
function bakeSprite(rows) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    if (row.length !== w) console.warn('sprite row length mismatch', y, row);
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      const idx = parseInt(ch, 16);
      const col = PAL[idx];
      if (!col) continue;
      cx.fillStyle = col;
      cx.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

// Mirror a sprite canvas horizontally.
function mirrorSprite(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.translate(src.width, 0); cx.scale(-1, 1);
  cx.drawImage(src, 0, 0);
  return c;
}

// Procedural noise tile: entries = [[weight, palIdx], ...].
function bakeNoiseTile(w, h, entries, seed) {
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
  const total = entries.reduce((a, [w]) => a + w, 0);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let r = rnd() * total, pick = entries[0][1];
    for (const [wt, idx] of entries) { r -= wt; if (r <= 0) { pick = idx; break; } }
    cx.fillStyle = PAL[pick]; cx.fillRect(x, y, 1, 1);
  }
  return c;
}

// Overlay a hand-authored detail on top of a baked tile.
function overlayDetail(base, rows) {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const cx = c.getContext('2d');
  cx.drawImage(base, 0, 0);
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    if (ch === '.') continue;
    const col = PAL[parseInt(ch, 16)];
    if (!col) continue;
    cx.fillStyle = col; cx.fillRect(x, y, 1, 1);
  }
  return c;
}

function bakeCobbleTile(seed) {
  // Chunkier gray stones closer to the Lynx cobblestone screenshots than noise.
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const cx = c.getContext('2d');
  cx.fillStyle = PAL[7];
  cx.fillRect(0, 0, 16, 16);
  for (let y = -2; y < 16; y += 4) {
    for (let x = -2; x < 16; x += 5) {
      const ox = x + Math.floor(rnd() * 3);
      const oy = y + Math.floor(rnd() * 3);
      const w = 4 + Math.floor(rnd() * 3);
      const h = 3 + Math.floor(rnd() * 3);
      cx.fillStyle = PAL[5];
      cx.fillRect(ox - 1, oy - 1, w + 2, h + 2);
      cx.fillStyle = rnd() < 0.35 ? PAL[9] : PAL[8];
      cx.fillRect(ox, oy, w, h);
      cx.fillStyle = PAL[9];
      cx.fillRect(ox + 1, oy, Math.max(1, w - 2), 1);
    }
  }
  return c;
}

const BESTOF_IMG = {};
// Sliced sprites already have proper alpha; no edge post-processing needed.
const BESTOF_TRANSPARENT_EDGE_KEYS = new Set();

function makeBestOfTransparentEdgeSprite(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  const image = cx.getImageData(0, 0, c.width, c.height);
  const data = image.data;
  const seen = new Uint8Array(c.width * c.height);
  const stack = [];
  const nearEdgeGray = (idx) => {
    const p = idx * 4;
    const a = data[p + 3];
    if (a < 10) return true;
    const r = data[p], g = data[p + 1], b = data[p + 2];
    const spread = Math.max(r, g, b) - Math.min(r, g, b);
    const avg = (r + g + b) / 3;
    return spread < 28 && avg >= 70 && avg <= 255;
  };
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= c.width || y >= c.height) return;
    const idx = y * c.width + x;
    if (seen[idx] || !nearEdgeGray(idx)) return;
    seen[idx] = 1;
    stack.push(idx);
  };
  for (let x = 0; x < c.width; x++) { push(x, 0); push(x, c.height - 1); }
  for (let y = 0; y < c.height; y++) { push(0, y); push(c.width - 1, y); }
  while (stack.length) {
    const idx = stack.pop();
    data[idx * 4 + 3] = 0;
    const x = idx % c.width, y = (idx / c.width) | 0;
    push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1);
  }
  cx.putImageData(image, 0, 0);
  c._bestOfBitmap = true;
  c._bestOfWorldSize = 16;
  return c;
}

function loadBestOfSprites() {
  for (const [key, src] of Object.entries(BESTOF_EMBEDDED_SPRITES)) {
    const img = new Image();
    img._bestOfBitmap = true;
    img._bestOfWorldSize = 16;
    img.onload = () => {
      // Only apple/scorpion have gray source-image mats; flood-fill from the
      // bitmap edge so internal gray sprite details are preserved.
      if (BESTOF_TRANSPARENT_EDGE_KEYS.has(key)) {
        BESTOF_IMG[key] = makeBestOfTransparentEdgeSprite(img);
      }
      installBestOfSpriteMappings();
    };
    img.onerror = () => console.warn('best-of sprite failed', key);
    img.src = src;
    BESTOF_IMG[key] = img;
  }
}

function useBestOfSprite(name, key, worldSize=16) {
  const img = BESTOF_IMG[key];
  if (!img || !(img.getContext || (img.complete && img.naturalWidth))) return;
  img._bestOfBitmap = true;
  img._bestOfWorldSize = worldSize;
  SPR[name] = img;
}

function useBestOfAnim(name0, name1, key, worldSize=16) {
  useBestOfSprite(name0, key, worldSize);
  useBestOfSprite(name1, key, worldSize);
}

function installBestOfSpriteMappings() {
  // Classes: idle in all directions, plus a per-class attack frame.
  // (Bestof has no per-direction art for these enemies, so all 4 dirs share.)
  const classes = [
    ['warrior', 'nerd'],
    ['valkyrie', 'valkyrie'],
    ['wizard', 'Wizard'],
    ['archer', 'gunfighter'],
    ['android', 'android'],
    ['samurai', 'samurai'],
    ['pirate', 'pirate'],
    ['punk', 'punkrocker'],
  ];
  for (const [name, key] of classes) {
    useBestOfSprite(name + '_s_0', key);
    useBestOfSprite(name + '_s_1', key);
    useBestOfSprite(name + '_n_0', key);
    useBestOfSprite(name + '_n_1', key);
    useBestOfSprite(name + '_e_0', key);
    useBestOfSprite(name + '_e_1', key);
    useBestOfSprite(name + '_w_0', key);
    useBestOfSprite(name + '_w_1', key);
    useBestOfSprite(name + '_attack', key + '_attack');
  }

  // Enemies: map Oct 29 monster art to the active enemy IDs in this build.
  useBestOfAnim('scorpion_0', 'scorpion_1', 'enemy_scorpion');
  useBestOfAnim('slime_0', 'slime_1', 'slime');
  useBestOfAnim('skeleton_0', 'skeleton_1', 'enemy_skeleton');
  useBestOfAnim('ghost_0', 'ghost_1', 'enemy_ghost');
  useBestOfAnim('grunt_0', 'grunt_1', 'enemy_orc');
  useBestOfAnim('demon_0', 'demon_1', 'enemy_demon');
  useBestOfAnim('sorcerer_0', 'sorcerer_1', 'enemy_sorcerer_red');
  useBestOfAnim('lobber_0', 'lobber_1', 'enemy_beholder');
  useBestOfAnim('death_0', 'death_1', 'enemy_death');

  // Items and wall tile.
  useBestOfSprite('wall', 'tile_wall');
  useBestOfSprite('apple', 'item_apple');
  useBestOfSprite('key', 'item_key');
  useBestOfSprite('potion', 'item_potion');
  useBestOfSprite('gold', 'item_gold');
  useBestOfSprite('scroll', 'item_scroll');
  useBestOfSprite('treasure', 'item_gold');
}

loadBestOfSprites();

function bake() {
  // grass variants
  const grassBase = bakeNoiseTile(16, 16, GRASS_BASE_ENTRIES, 1);
  SPR.grass0 = grassBase;
  SPR.grass1 = overlayDetail(bakeNoiseTile(16,16,GRASS_BASE_ENTRIES,2), GRASS_PEBBLE);
  SPR.grass2 = overlayDetail(bakeNoiseTile(16,16,GRASS_BASE_ENTRIES,3), GRASS_FLOWER);
  SPR.grass3 = overlayDetail(bakeNoiseTile(16,16,GRASS_BASE_ENTRIES,4), GRASS_TUFT);

  // dirt / stone-floor variants (for dungeon screenshot-3 feel)
  SPR.dirt0 = bakeCobbleTile(5);
  SPR.dirt1 = overlayDetail(bakeCobbleTile(6), DIRT_CRACK);
  SPR.dirt2 = bakeCobbleTile(7);
  SPR.dirt3 = bakeCobbleTile(8);

  // walls

// Generic framed portrait built by scaling up a 16x16 sprite and stamping it
// into a 32x32 frame with colored background. Good-enough v1 portraits for 7
// of the 8 classes (Warrior keeps the bespoke portrait).
function makePortraitFromSprite(spriteCanvas, bgIdx) {
  const size = 32;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  // outer frame
  cx.fillStyle = PAL[1]; cx.fillRect(0, 0, size, size);
  cx.fillStyle = PAL[9]; cx.fillRect(1, 1, size-2, size-2);
  cx.fillStyle = PAL[1]; cx.fillRect(2, 2, size-4, size-4);
  // background color
  cx.fillStyle = PAL[bgIdx]; cx.fillRect(3, 3, size-6, size-6);
  // stamp sprite scaled 1.5x, offset to roughly show head+torso
  const s = 1.5;
  const w = 16 * s, h = 16 * s;
  cx.drawImage(spriteCanvas, (size - w) / 2, size - h - 3, w, h);
  return c;
}

// Tile helpers — given tile id, return sprite variant
function tileSprite(id, x, y, t) {
  // id codes: 0 = floor (grass/dirt depending on biome), 1 = wall,
  // 2 = door closed, 3 = door open, 4 = exit, 5 = torch, 6 = generator
  switch (id) {
    case 0: { // floor — pick a grass variant based on (x,y)
      const v = (x * 13 + y * 7) & 3;
      return level.biome === 'grass' ? [SPR.grass0, SPR.grass1, SPR.grass2, SPR.grass3][v]
                                     : [SPR.dirt0, SPR.dirt1, SPR.dirt2, SPR.dirt3][v];
    }
    case 1: return level.biome === 'grass' ? SPR.wallOut : SPR.wall;
    case 2: return SPR.doorClosed;
    case 3: return SPR.doorOpen;
    case 4: return (t >> 3) & 1 ? SPR.exit1 : SPR.exit0;
    case 5: return (t >> 3) & 1 ? SPR.torch1 : SPR.torch0;
    case 6: return (t >> 3) & 1 ? SPR.gen1  : SPR.gen0;
    case 7: return (t >> 4) & 1 ? SPR.terminal1 : SPR.terminal0;
  }
  return SPR.grass0;
}

// Parse a map string grid into a level structure
function parseMap(mapRows, biome) {
  const h = mapRows.length, w = mapRows[0].length;
  const tiles = new Array(w * h).fill(0);
  const spawns = { player: {x:1,y:1}, enemies: [], items: [], torches: [], generators: [], doors: [], exit: {x:1,y:1} };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = mapRows[y][x];
      let tile = 0;
      switch (ch) {
        case '#': tile = 1; break;
        case 'D': tile = 2; spawns.doors.push({x,y,open:false}); break;
        case 'X': tile = 4; spawns.exit = {x,y}; break;
        case 'T': tile = 5; spawns.torches.push({x,y}); break;
        case 'G': tile = 6; spawns.generators.push({x,y,type:'scorpion',hp:12}); break;
        case 'C': tile = 7; spawns.terminals = spawns.terminals || []; spawns.terminals.push({x,y}); break;
        case 'S': spawns.player = {x,y}; break;
        case 'E': spawns.enemies.push({x,y,type:'scorpion'}); break;
        case 's': spawns.enemies.push({x,y,type:'slime'}); break;
        case 'k': spawns.enemies.push({x,y,type:'skeleton'}); break;
        case 'g': spawns.enemies.push({x,y,type:'ghost'}); break;
        case 'u': spawns.enemies.push({x,y,type:'grunt'}); break;
        case 'd': spawns.enemies.push({x,y,type:'demon'}); break;
        case 'z': spawns.enemies.push({x,y,type:'sorcerer'}); break;
        case 'l': spawns.enemies.push({x,y,type:'lobber'}); break;
        case 'r': spawns.enemies.push({x,y,type:'death'}); break;
        case '@': spawns.items.push({x,y,type:'food'}); break;
        case 'K': spawns.items.push({x,y,type:'key'}); break;
        case 'P': spawns.items.push({x,y,type:'potion'}); break;
        case '$': spawns.items.push({x,y,type:'treasure'}); break;
        case 'W': spawns.items.push({x,y,type:'gold'}); break;
        case 'm': spawns.items.push({x,y,type:'missile'}); break;
        case 'H': spawns.items.push({x,y,type:'scroll_heal'}); break;
        case 'B': spawns.items.push({x,y,type:'scroll_blast'}); break;
        case 'V': spawns.items.push({x,y,type:'scroll_speed'}); break;
        case 'R': spawns.items.push({x,y,type:'scroll_strong'}); break;
        case 'N': spawns.items.push({x,y,type:'scroll_invis'}); break;
        case '0': case '1': case '2': case '3': case '4': case '5': case '6': case '7': {
          spawns.items.push({x,y,type:'gem_' + ch});
          break;
        }
        case 'I': spawns.itBoss = {x,y}; break;
      }
      tiles[y * w + x] = tile;
    }
  }
  return { w, h, tiles, spawns, biome };
}

// ---- Canvas touch: swipe to steer, tap to melee, 2-finger tap to shoot ----
const canvasDir = { u:false, d:false, l:false, r:false };
let _ctPrimary = null;       // { id, sx, sy, time }
let _ctWasTwoFinger = false;

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  audio();  // ensure AudioContext on first user gesture
  const t0 = e.changedTouches[0];
  if (e.touches.length === 1) {
    _ctPrimary = { id: t0.identifier, sx: t0.clientX, sy: t0.clientY, time: performance.now() };
    _ctWasTwoFinger = false;
  }
  if (e.touches.length >= 2) { _ctWasTwoFinger = true; }
}, {passive:false});

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!_ctPrimary) return;
  let pt = null;
  for (let i = 0; i < e.touches.length; i++) {
    if (e.touches[i].identifier === _ctPrimary.id) { pt = e.touches[i]; break; }
  }
  if (!pt) return;
  const dx = pt.clientX - _ctPrimary.sx;
  const dy = pt.clientY - _ctPrimary.sy;
  const dist = Math.hypot(dx, dy);
  const threshold = 18;
  canvasDir.u = canvasDir.d = canvasDir.l = canvasDir.r = false;
  if (dist > threshold) {
    if (dx >  threshold * 0.4) canvasDir.r = true;
    if (dx < -threshold * 0.4) canvasDir.l = true;
    if (dy >  threshold * 0.4) canvasDir.d = true;
    if (dy < -threshold * 0.4) canvasDir.u = true;
  }
}, {passive:false});

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  let primaryEnded = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (_ctPrimary && e.changedTouches[i].identifier === _ctPrimary.id) { primaryEnded = true; break; }
  }
  if (primaryEnded && _ctPrimary) {
    const elapsed = performance.now() - _ctPrimary.time;
    let endX = _ctPrimary.sx, endY = _ctPrimary.sy;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === _ctPrimary.id) {
        endX = e.changedTouches[i].clientX; endY = e.changedTouches[i].clientY; break;
      }
    }
    const dist = Math.hypot(endX - _ctPrimary.sx, endY - _ctPrimary.sy);
    // Tap detection: quick touch with little movement
    if (elapsed < 300 && dist < 20) {
      if (_ctWasTwoFinger) {
        // Two-finger tap → shoot
        touchState.b = true; setTimeout(()=>{ touchState.b = false; }, 120);
      } else {
        // Single tap
        if (gameState === STATE.SELECT) {
          handleSelectTouch(_ctPrimary.sx, _ctPrimary.sy);
        } else if (gameState === STATE.PLAY) {
          // Tap → melee
          touchState.a = true; setTimeout(()=>{ touchState.a = false; }, 120);
        } else {
          // TITLE / DEAD / VICTORY → start
          touchState.s = true; setTimeout(()=>{ touchState.s = false; }, 120);
        }
      }
    }
    canvasDir.u = canvasDir.d = canvasDir.l = canvasDir.r = false;
    _ctPrimary = null;
  }
  if (e.touches.length === 0) {
    _ctPrimary = null; _ctWasTwoFinger = false;
    canvasDir.u = canvasDir.d = canvasDir.l = canvasDir.r = false;
  }
}, {passive:false});

canvas.addEventListener('touchcancel', function() {
  _ctPrimary = null; _ctWasTwoFinger = false;
  canvasDir.u = canvasDir.d = canvasDir.l = canvasDir.r = false;
}, {passive:false});

// Handle canvas tap on select screen: tap left half = prev, right half = next, tap center = start
function handleSelectTouch(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const cx = (clientX - rect.left) * (CW / rect.width);
  const cy = (clientY - rect.top)  * (CH / rect.height);
  // Tap on bottom half = start game
  if (cy > CH * 0.6) {
    applyClass(CLASSES[selectIdx]);
    startLevel(1);
    gameState = STATE.PLAY;
    selectCooldown = 0.3;
    return;
  }
  // Tap left or right to cycle characters
  if (cx < CW * 0.35) {
    selectIdx = (selectIdx - 1 + CLASSES.length) % CLASSES.length;
    selectCooldown = 0.18;
  } else if (cx > CW * 0.65) {
    selectIdx = (selectIdx + 1) % CLASSES.length;
    selectCooldown = 0.18;
  } else {
    // Tap center = start
    applyClass(CLASSES[selectIdx]);
    startLevel(1);
    gameState = STATE.PLAY;
    selectCooldown = 0.3;
  }
}

function inputDir() {
  let dx = 0, dy = 0;
  if (keys.ArrowUp    || keys.KeyW || touchState.u || canvasDir.u) dy -= 1;
  if (keys.ArrowDown  || keys.KeyS || touchState.d || canvasDir.d) dy += 1;
  if (keys.ArrowLeft  || keys.KeyA || touchState.l || canvasDir.l) dx -= 1;
  if (keys.ArrowRight || keys.KeyD || touchState.r || canvasDir.r) dx += 1;
  return { dx, dy };
}
function inputMelee() { return keys.KeyJ || touchState.a; }
function inputShoot() { return keys.KeyK || touchState.b; }
function inputInv()   { return keys.KeyI || touchState.i; }
function inputStart() { return keys.Space || touchState.s; }

// ============================================================================
// Audio — procedural Web Audio
// ============================================================================
let audioCtx = null;
function audio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playTone(freq, dur, type='square', vol=0.1, slide=0) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, freq + slide), ac.currentTime + dur);
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function playNoise(dur, vol=0.08, bandpass=null) {
  const ac = audio(); if (!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.value = vol;
  if (bandpass) { const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = bandpass; src.connect(bp); bp.connect(g); }
  else src.connect(g);
  g.connect(ac.destination);
  src.start();
}
function sfx(name) {
  switch (name) {
    case 'step':    playTone(180, 0.05, 'square', 0.04); break;
    case 'melee':   playNoise(0.08, 0.1, 1200); break;
    case 'shoot':   playTone(800, 0.12, 'sawtooth', 0.08, -500); break;
    case 'hit':     playTone(120, 0.15, 'square', 0.12, -60); break;
    case 'enemyHit':playNoise(0.12, 0.12, 400); break;
    case 'pickup':  playTone(660, 0.08, 'square', 0.1); setTimeout(()=>playTone(880,0.1,'square',0.1),70); break;
    case 'door':    playTone(220, 0.2, 'sawtooth', 0.12, -100); break;
    case 'potion':  playTone(400, 0.3, 'sawtooth', 0.1, 600); break;
    case 'death':   playTone(220, 0.4, 'sawtooth', 0.2, -180); break;
    case 'levelup': playTone(523, 0.1, 'square', 0.12); setTimeout(()=>playTone(659,0.1,'square',0.12),100); setTimeout(()=>playTone(784,0.2,'square',0.12),200); break;
    case 'alert':   playTone(440, 0.15, 'sawtooth', 0.15); break;
  }
}

// ============================================================================
// Game setup / reset
// ============================================================================

// ----- procedural level generation ------------------------------------------

function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function generateLevel(n) {
  const rng = mulberry32(0x5EED ^ (n * 1337));
  const W = 32, H = 32;
  const grid = [];
  for (let y = 0; y < H; y++) { grid.push(new Array(W).fill('#')); }

  // Carve random rectangular rooms
  const rooms = [];
  const wantRooms = 6 + Math.min(6, Math.floor(n / 2));
  for (let i = 0; i < wantRooms * 4 && rooms.length < wantRooms; i++) {
    const rw = 4 + Math.floor(rng() * 5);
    const rh = 4 + Math.floor(rng() * 5);
    const rx = 1 + Math.floor(rng() * (W - rw - 2));
    const ry = 1 + Math.floor(rng() * (H - rh - 2));
    let overlap = false;
    for (const r of rooms) {
      if (rx < r.x + r.w + 1 && rx + rw + 1 > r.x &&
          ry < r.y + r.h + 1 && ry + rh + 1 > r.y) { overlap = true; break; }
    }
    if (overlap) continue;
    rooms.push({ x: rx, y: ry, w: rw, h: rh });
  }
  // Carve rooms
  for (const r of rooms) {
    for (let yy = r.y; yy < r.y + r.h; yy++) {
      for (let xx = r.x; xx < r.x + r.w; xx++) grid[yy][xx] = '.';
    }
  }
  // Connect rooms with L-corridors
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    const ax = a.x + (a.w >> 1), ay = a.y + (a.h >> 1);
    const bx = b.x + (b.w >> 1), by = b.y + (b.h >> 1);
    const midX = rng() < 0.5 ? ax : bx;
    const midY = midX === ax ? by : ay;
    for (let x = Math.min(ax, midX); x <= Math.max(ax, midX); x++) if (grid[ay][x] === '#') grid[ay][x] = '.';
    for (let y = Math.min(ay, midY); y <= Math.max(ay, midY); y++) if (grid[y][midX] === '#') grid[y][midX] = '.';
    for (let x = Math.min(midX, bx); x <= Math.max(midX, bx); x++) if (grid[midY][x] === '#') grid[midY][x] = '.';
    for (let y = Math.min(midY, by); y <= Math.max(midY, by); y++) if (grid[y][bx] === '#') grid[y][bx] = '.';
  }

  // Helper: pick a random floor tile within a room
  const roomFloor = (r) => ({ x: r.x + 1 + Math.floor(rng() * (r.w - 2)), y: r.y + 1 + Math.floor(rng() * (r.h - 2)) });

  // Start position: center of first room
  const start = roomFloor(rooms[0]);
  grid[start.y][start.x] = 'S';

  // Exit: in the last room, far from start
  const exit = roomFloor(rooms[rooms.length - 1]);
  grid[exit.y][exit.x] = 'X';

  // Enemy pool scales with level
  const enemyPool = ['slime', 'scorpion', 'skeleton', 'ghost', 'grunt'];
  if (n >= 2) enemyPool.push('demon');
  if (n >= 3) enemyPool.push('sorcerer', 'lobber');
  if (n >= 4) enemyPool.push('death');
  const enemyChar = { slime:'s', scorpion:'E', skeleton:'k', ghost:'g', grunt:'u', demon:'d', sorcerer:'z', lobber:'l', death:'r' };
  const enemyCount = 6 + n * 2;
  let placed = 0;
  for (let t = 0; t < enemyCount * 3 && placed < enemyCount; t++) {
    const r = rooms[1 + Math.floor(rng() * (rooms.length - 1))]; // not in start room
    const p = roomFloor(r);
    if (grid[p.y][p.x] === '.') { grid[p.y][p.x] = enemyChar[enemyPool[Math.floor(rng() * enemyPool.length)]]; placed++; }
  }

  // Generators: 1 + level/3
  const genCount = 1 + Math.floor(n / 3);
  for (let i = 0; i < genCount; i++) {
    const r = rooms[1 + Math.floor(rng() * (rooms.length - 1))];
    const p = roomFloor(r);
    if (grid[p.y][p.x] === '.') grid[p.y][p.x] = 'G';
  }

  // Items
  const food = 3 + Math.floor(rng() * 3);
  for (let i = 0; i < food; i++) {
    const r = rooms[Math.floor(rng() * rooms.length)];
    const p = roomFloor(r);
    if (grid[p.y][p.x] === '.') grid[p.y][p.x] = '@';
  }
  // Treasure / potion / missile (keys handled in the reachability pass below)
  const drop = (ch) => { for (let t = 0; t < 20; t++) { const r = rooms[Math.floor(rng() * rooms.length)]; const p = roomFloor(r); if (grid[p.y][p.x] === '.') { grid[p.y][p.x] = ch; return; } } };
  drop('P'); drop('$'); drop('m');
  // Gold and computer terminal
  drop('W'); drop('W'); drop('W');
  // Computer terminal
  if (rng() < 0.7) drop('C');
  // Scrolls — 1-2 per level
  const scrollChars = ['H','B','V','R','N'];
  drop(scrollChars[Math.floor(rng() * scrollChars.length)]);
  if (rng() < 0.4) drop(scrollChars[Math.floor(rng() * scrollChars.length)]);

  // A couple torches on walls inside rooms
  for (let i = 0; i < 3; i++) {
    const r = rooms[Math.floor(rng() * rooms.length)];
    const p = roomFloor(r);
    if (grid[p.y][p.x] === '.') grid[p.y][p.x] = 'T';
  }

  // Star Gem fragment: one per level 2..9 (8 gems). Placed in a random non-start room.
  if (n >= 2 && n <= 9) {
    const gemIdx = n - 2;
    for (let t = 0; t < 30; t++) {
      const r = rooms[1 + Math.floor(rng() * (rooms.length - 1))];
      const p = roomFloor(r);
      if (grid[p.y][p.x] === '.') { grid[p.y][p.x] = String(gemIdx); break; }
    }
  }

  // Doors between corridors and rooms: scatter a few on corridor edges of rooms
  for (const r of rooms) {
    const edges = [
      { x: r.x - 1, y: r.y + (r.h >> 1) },
      { x: r.x + r.w, y: r.y + (r.h >> 1) },
      { x: r.x + (r.w >> 1), y: r.y - 1 },
      { x: r.x + (r.w >> 1), y: r.y + r.h },
    ];
    for (const e of edges) {
      if (e.x <= 0 || e.y <= 0 || e.x >= W-1 || e.y >= H-1) continue;
      if (grid[e.y][e.x] === '.' && rng() < 0.2) grid[e.y][e.x] = 'D';
    }
  }

  // Guarantee the exit is reachable: simulate the player exploring with keys.
  // Whenever they hit a door with no key, place a key in an already-reachable
  // floor tile. Bail out by dissolving a blocking door if no floor is available.
  ensureReachable(grid, W, H, start.x, start.y, exit.x, exit.y, rng);

  const biomes = ['grass', 'dirt', 'grass', 'dirt'];
  const biome = biomes[(n - 1) % biomes.length];
  return parseMap(grid.map(row => row.join('')), biome);
}

// Iterative exploration simulation. Plants Ks in reachable open floor until
// the player would naturally collect enough to unlock every door on the path.
function ensureReachable(grid, W, H, sx, sy, ex, ey, rng) {
  const opened = new Set();                // keys: y*W+x for doors treated as open
  const collected = new Set();             // keys: y*W+x for keys already picked up in sim
  const k = (x, y) => y * W + x;
  const passable = (x, y) => {
    const ch = grid[y][x];
    if (ch === '#') return false;
    if (ch === 'D' && !opened.has(k(x, y))) return false;
    return true;
  };
  const bfs = () => {
    const vis = new Uint8Array(W * H);
    const q = [[sx, sy]];
    vis[k(sx, sy)] = 1;
    const out = [];
    while (q.length) {
      const [x, y] = q.shift();
      out.push([x, y]);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        if (vis[k(nx, ny)]) continue;
        if (!passable(nx, ny)) continue;
        vis[k(nx, ny)] = 1;
        q.push([nx, ny]);
      }
    }
    return out;
  };

  let keyBank = 0;
  for (let iter = 0; iter < 40; iter++) {
    const reach = bfs();
    const reachSet = new Set(reach.map(([x,y]) => k(x,y)));

    // Collect keys we just reached
    for (const [x, y] of reach) {
      const id = k(x, y);
      if (grid[y][x] === 'K' && !collected.has(id)) { collected.add(id); keyBank++; }
    }
    if (reachSet.has(k(ex, ey))) break;  // exit reachable — done

    // Doors on the border of reachable area
    const border = [];
    const seen = new Set();
    for (const [x, y] of reach) {
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const id = k(nx, ny);
        if (grid[ny][nx] === 'D' && !opened.has(id) && !seen.has(id)) {
          seen.add(id); border.push([nx, ny]);
        }
      }
    }
    if (border.length === 0) break;  // stranded — exit not reachable via doors

    if (keyBank > 0) {
      const [dx, dy] = border[Math.floor(rng() * border.length)];
      opened.add(k(dx, dy));
      keyBank--;
    } else {
      // Plant a key in a reachable floor tile; fall back to dissolving a door.
      const floorTiles = reach.filter(([x,y]) => grid[y][x] === '.');
      if (floorTiles.length > 0) {
        const [x, y] = floorTiles[Math.floor(rng() * floorTiles.length)];
        grid[y][x] = 'K';
        collected.add(k(x, y));
        keyBank++;
      } else {
        const [dx, dy] = border[0];
        grid[dy][dx] = '.';
      }
    }
  }

  // A couple of spare keys so the player isn't key-starved exploring loot rooms.
  const reach = bfs();
  const spots = reach.filter(([x,y]) => grid[y][x] === '.');
  for (let i = 0; i < 2 && spots.length > 0; i++) {
    const idx = Math.floor(rng() * spots.length);
    const [x, y] = spots.splice(idx, 1)[0];
    grid[y][x] = 'K';
  }
}

// Final level 10: dedicated IT boss arena.
function generateBossLevel() {
  const rows = [];
  const W = 20, H = 20;
  for (let y = 0; y < H; y++) {
    let row = '';
    for (let x = 0; x < W; x++) {
      if (x === 0 || y === 0 || x === W-1 || y === H-1) row += '#';
      else row += '.';
    }
    rows.push(row);
  }
  // Pillars in four corners
  const set = (x, y, ch) => { rows[y] = rows[y].substring(0, x) + ch + rows[y].substring(x + 1); };
  for (const [x, y] of [[4,4],[15,4],[4,15],[15,15]]) {
    set(x, y, '#'); set(x+1, y, '#'); set(x, y+1, '#'); set(x+1, y+1, '#');
  }
  // Torches
  set(2, 2, 'T'); set(17, 2, 'T'); set(2, 17, 'T'); set(17, 17, 'T');
  // Start at bottom
  set(10, 17, 'S');
  // Boss in center
  set(10, 8, 'I');
  // Some supporting enemies
  set(6, 10, 'd'); set(14, 10, 'd'); set(8, 6, 'z'); set(12, 6, 'z');
  // Items
  set(3, 10, '@'); set(16, 10, '@'); set(10, 15, 'P');
  return parseMap(rows, 'dirt');
}

function startLevel(n) {
  level = (n === 1) ? parseMap(LEVEL1_MAP, 'grass')
        : (n >= 10) ? generateBossLevel()
        : generateLevel(n);
  level.num = n;
  player.levelNum = n;
  player.x = (level.spawns.player.x + 0.5) * TILE;
  player.y = (level.spawns.player.y + 0.5) * TILE;
  enemies = level.spawns.enemies.map(e => makeEnemy(e.type, (e.x+0.5)*TILE, (e.y+0.5)*TILE));
  if (level.spawns.itBoss) {
    const b = level.spawns.itBoss;
    enemies.push(makeEnemy('it', (b.x + 1) * TILE, (b.y + 1) * TILE));
  }
  items = level.spawns.items.map(i => ({ type:i.type, x:(i.x+0.5)*TILE, y:(i.y+0.5)*TILE, bob:Math.random()*Math.PI*2 }));
  generators = level.spawns.generators.map(g => ({ x:(g.x+0.5)*TILE, y:(g.y+0.5)*TILE, type:g.type, hp:g.hp, cd:2, tx:g.x, ty:g.y }));
  doors = level.spawns.doors.map(d => ({ x:d.x, y:d.y, open:false }));
  torches = level.spawns.torches.map(t => ({ x:t.x, y:t.y }));
  terminals = (level.spawns.terminals || []).map(t => ({ x:t.x, y:t.y }));
  projectiles = []; particles = [];
  cameraX = cameraY = 0;
  player.alertMsg = `Level ${n}`; player.alertTime = 2;
}

function makeEnemy(type, px, py) {
  // All normal enemies chase the player. Only IT boss shoots.
  const stats = {
    slime:    { hp: 5,  speed: 32, dmg: 4,  score: 0,   ai:'chase', splitDepth:0 },
    scorpion: { hp: 6,  speed: 55, dmg: 6,  score: 100, ai:'chase' },
    skeleton: { hp: 10, speed: 40, dmg: 10, score: 150, ai:'chase' },
    ghost:    { hp: 4,  speed: 50, dmg: 8,  score: 80,  ai:'chase', ethereal:true },
    grunt:    { hp: 8,  speed: 50, dmg: 8,  score: 120, ai:'chase' },
    demon:    { hp: 14, speed: 35, dmg: 12, score: 300, ai:'chase' },
    sorcerer: { hp: 8,  speed: 30, dmg: 10, score: 250, ai:'chase' },
    lobber:   { hp: 12, speed: 25, dmg: 10, score: 220, ai:'chase' },
    death:    { hp: 30, speed: 30, dmg: 40, score: 500, ai:'chase' },
    it:       { hp: 200, speed: 35, dmg: 25, score: 10000, ai:'boss', cd: 1.2, size: 32 },
  }[type] || { hp:5, speed:40, dmg:5, score:50, ai:'chase' };
  return {
    type, x:px, y:py, vx:0, vy:0,
    hp: stats.hp, maxHp: stats.hp,
    speed: stats.speed, dmg: stats.dmg, score: stats.score,
    ethereal: !!stats.ethereal,
    ai: stats.ai, cd: (stats.cd || 0) * (1.0 + Math.random()), proj: stats.proj,
    size: stats.size || 16,
    splitDepth: stats.splitDepth || 0,
    facing:'s', frame:0, animTime:0,
    hitFlash: 0,
    alive: true,
  };
}

// ============================================================================
// Collision / tile queries
// ============================================================================

function tileAt(tx, ty) {
  if (!level || tx < 0 || ty < 0 || tx >= level.w || ty >= level.h) return 1;
  return level.tiles[ty * level.w + tx];
}

function isBlocked(px, py, ethereal) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  const t = tileAt(tx, ty);
  if (t === 1 || t === 7) return true;  // walls and terminals are solid
  if (t === 2) {
    // door — check if any door at this tile is open
    const d = doors.find(d => d.x === tx && d.y === ty);
    if (d && d.open) return false;
    return !ethereal;
  }
  return false;
}

// Move entity with AABB tile collision. Separate axes so walls slide.
function moveEntity(e, dx, dy) {
  const half = 6; // collision radius ~ 6px
  if (dx !== 0) {
    const nx = e.x + dx;
    const check = dx > 0 ? nx + half : nx - half;
    if (!isBlocked(check, e.y - half, e.ethereal) && !isBlocked(check, e.y + half, e.ethereal)) e.x = nx;
  }
  if (dy !== 0) {
    const ny = e.y + dy;
    const check = dy > 0 ? ny + half : ny - half;
    if (!isBlocked(e.x - half, check, e.ethereal) && !isBlocked(e.x + half, check, e.ethereal)) e.y = ny;
  }
}

// ============================================================================
// Player update
// ============================================================================

function updatePlayer(dt) {
  // Don't move while inventory or shop is open — arrows control those UIs
  if (player.hudMode === 'stats') {
    const { dx, dy } = inputDir();
    const mag = Math.hypot(dx, dy);
    if (mag > 0) {
      const nx = dx / mag, ny = dy / mag;
      moveEntity(player, nx * player.speed * dt, ny * player.speed * dt);
      if (Math.abs(dx) >= Math.abs(dy)) player.facing = dx > 0 ? 'e' : 'w';
      else                              player.facing = dy > 0 ? 's' : 'n';
      player.animTime += dt;
      if (player.animTime > 0.12) { player.animTime = 0; player.frame ^= 1; }
    } else {
      player.frame = 0;
    }
  }

  // Attack
  if (inputMelee() && player.meleeCd <= 0) {
    player.meleeCd = 0.3;
    player.attacking = 0.15;
    player.attackAnim = 0.18;
    sfx('melee');
    meleeAttack();
  }
  player.meleeCd = Math.max(0, player.meleeCd - dt);
  player.attacking = Math.max(0, player.attacking - dt);

  if (inputShoot() && player.shootCd <= 0 && player.missiles > 0) {
    player.shootCd = 0.4;
    player.attackAnim = 0.18;
    if (!player.cheat) player.missiles--;
    shootMissile();
    sfx('shoot');
  }
  player.shootCd = Math.max(0, player.shootCd - dt);
  player.attackAnim = Math.max(0, player.attackAnim - dt);

  // Door open with key (auto-open on adjacent — consumes key from inventory)
  const ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
  for (const d of doors) {
    if (!d.open && Math.abs(d.x - ptx) + Math.abs(d.y - pty) <= 1) {
      const ki = player.inventory.indexOf('key');
      if (ki !== -1) {
        player.inventory.splice(ki, 1);
        if (player.invSel >= player.inventory.length) player.invSel = Math.max(0, player.inventory.length - 1);
        d.open = true;
        level.tiles[d.y * level.w + d.x] = 3;
        sfx('door');
        alertMsg('Door opened');
      }
    }
  }

  // Terminal proximity — open/close shop (with cooldown to prevent re-entry)
  player.shopExitCd = Math.max(0, (player.shopExitCd || 0) - dt);
  let nearTerminal = false;
  for (const term of terminals) {
    if (Math.abs(term.x - ptx) + Math.abs(term.y - pty) <= 1) { nearTerminal = true; break; }
  }
  if (nearTerminal && player.hudMode !== 'shop' && player.shopExitCd <= 0) {
    player.hudMode = 'shop'; player.shopSel = 0; player.invCd = 0.3;
  } else if (!nearTerminal && player.hudMode === 'shop') {
    player.hudMode = 'stats';
  }

  // Item pickup
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (Math.hypot(it.x - player.x, it.y - player.y) < 10) {
      pickupItem(it.type);
      items.splice(i, 1);
    }
  }

  // Exit
  const ex = level.spawns.exit;
  if (Math.floor(player.x / TILE) === ex.x && Math.floor(player.y / TILE) === ex.y) {
    nextLevel();
  }

  // Cheat refill: keep the bars pinned at max while cheat is active.
  if (player.cheat) {
    player.life = Math.max(player.life, 9999);
    player.missiles = Math.max(player.missiles, 99);
  }

  // HP decay (series hallmark) — disabled under cheat.
  player.hpTickAcc += dt;
  if (!player.cheat && player.hpTickAcc > 1) {
    player.hpTickAcc = 0;
    player.life -= 1;
    if (player.life < 200 && Math.random() < 0.3) {
      alertMsg((player.className || 'Warrior') + ' needs food, badly!');
      sfx('alert');
    }
  }

  // Damage / death
  if (player.life <= 0) {
    gameState = STATE.DEAD;
    sfx('death');
  }

  player.hitFlash = Math.max(0, player.hitFlash - dt);
}

function pickupItem(type) {
  sfx('pickup');
  player.lastEncounter = { type:'item', id: type };
  switch (type) {
    case 'food':    player.inventory.push('food'); player.score += 10; alertMsg('Got food'); break;
    case 'key':     player.inventory.push('key'); player.score += 50; alertMsg('Got key'); break;
    case 'potion':  player.inventory.push('potion'); alertMsg('Potion acquired'); break;
    case 'treasure':player.gold += 200; player.score += 200; alertMsg('+200 gold'); break;
    case 'gold':    player.gold += 100; player.score += 100; alertMsg('+100 gold'); break;
    case 'missile': player.missiles += 5; alertMsg('+5 missiles'); break;
    case 'scroll_heal': case 'scroll_blast': case 'scroll_speed': case 'scroll_strong':
    case 'scroll_invis': case 'scroll_shots': case 'scroll_repel': case 'scroll_power':
      player.inventory.push(type); alertMsg('Got ' + type.slice(7).toUpperCase() + ' scroll'); break;
    default:
      if (type && type.startsWith('gem_')) {
        const idx = parseInt(type.slice(4), 10);
        if (!(player.gems & (1 << idx))) {
          player.gems |= (1 << idx);
          player.score += 500;
          sfx('levelup');
          const count = bitCount(player.gems);
          alertMsg('STAR GEM ' + count + '/8');
        }
      }
      break;
  }
}

function bitCount(x) { let c = 0; while (x) { c += x & 1; x >>= 1; } return c; }

const HS_KEY = 'gauntlet3_hs';
function getHighScore() { try { return parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; } catch (e) { return 0; } }
function saveHighScore(s) { try { if (s > getHighScore()) localStorage.setItem(HS_KEY, String(s)); } catch (e) {} }

function meleeAttack() {
  // rect in front of player
  const reach = 18;
  let ax = player.x, ay = player.y;
  if (player.facing === 'n') ay -= reach;
  if (player.facing === 's') ay += reach;
  if (player.facing === 'e') ax += reach;
  if (player.facing === 'w') ax -= reach;
  for (const en of enemies) {
    if (!en.alive) continue;
    if (Math.hypot(en.x - ax, en.y - ay) < 14) damageEnemy(en, player.strength, 'melee');
  }
  // also hit generators
  for (let i = generators.length - 1; i >= 0; i--) {
    const g = generators[i];
    if (Math.hypot(g.x - ax, g.y - ay) < 16) {
      g.hp -= player.strength;
      if (g.hp <= 0) { generators.splice(i, 1); level.tiles[g.ty * level.w + g.tx] = 0; particleBurst(g.x, g.y, 14); sfx('enemyHit'); player.score += 200; }
      else sfx('enemyHit');
    }
  }
}

function shootMissile() {
  const sp = 260;
  let vx = 0, vy = 0;
  if (player.facing === 'n') vy = -sp;
  if (player.facing === 's') vy = sp;
  if (player.facing === 'e') vx = sp;
  if (player.facing === 'w') vx = -sp;
  projectiles.push({ x: player.x, y: player.y, vx, vy, from:'player', life: 1.5, dmg: player.strength * 2 });
}

function canSlimeSplit(en) {
  const offsets = [[-10,0], [10,0], [0,-10], [0,10]];
  return offsets.every(([dx, dy]) => !isBlocked(en.x + dx, en.y + dy, en.ethereal));
}

function splitSlime(en) {
  if ((en.splitDepth || 0) >= 2 || !canSlimeSplit(en)) return false;
  const childDepth = (en.splitDepth || 0) + 1;
  for (const dx of [-7, 7]) {
    const child = makeEnemy('slime', en.x + dx, en.y);
    child.splitDepth = childDepth;
    child.maxHp = Math.max(2, Math.ceil(en.maxHp * 0.6));
    child.hp = child.maxHp;
    child.speed = en.speed + 8;
    child.size = Math.max(10, (en.size || 16) - 3);
    child.score = Math.max(0, Math.floor(en.score / 2));
    enemies.push(child);
  }
  particleBurst(en.x, en.y, 8);
  alertMsg('SLIME SPLIT');
  return true;
}

function damageEnemy(en, dmg, source='melee') {
  en.hp -= dmg;
  en.hitFlash = 0.15;
  sfx('enemyHit');
  if (en.hp <= 0) {
    // Lynx behavior: missiles divide slimes in open space; melee kills them.
    if (en.type === 'slime' && source === 'projectile' && splitSlime(en)) {
      en.alive = false;
      player.lastEncounter = { type:'enemy', id: en.type };
      return;
    }
    en.alive = false;
    player.score += en.score;
    player.lastEncounter = { type:'enemy', id: en.type };
    particleBurst(en.x, en.y, en.type === 'it' ? 40 : 8);
    if (en.type === 'it') {
      gameState = STATE.VICTORY;
      sfx('levelup');
      saveHighScore(player.score);
    }
  }
}

// ============================================================================
// Enemy AI
// ============================================================================

function updateEnemies(dt) {
  for (const en of enemies) {
    if (!en.alive) continue;
    const dx = player.x - en.x, dy = player.y - en.y;
    const d = Math.hypot(dx, dy) || 1;

    if (en.ai === 'boss') {
      // IT boss: slow pursuit + periodic fireball spreads
      moveEntity(en, (dx/d) * en.speed * dt, (dy/d) * en.speed * dt);
      en.cd -= dt;
      if (en.cd <= 0 && d < 240) {
        en.cd = 1.4;
        for (let k = -2; k <= 2; k++) {
          const a = Math.atan2(dy, dx) + k * 0.2;
          spawnEnemyProj(en.x, en.y, Math.cos(a), Math.sin(a), 'fire', 15);
        }
      }
    } else {
      // All normal enemies: chase the player
      const mvx = (dx / d) * en.speed * dt, mvy = (dy / d) * en.speed * dt;
      moveEntity(en, mvx, mvy);
    }

    if (Math.abs(dx) >= Math.abs(dy)) en.facing = dx > 0 ? 'e' : 'w';
    else                              en.facing = dy > 0 ? 's' : 'n';
    en.animTime += dt;
    const animRate = 0.2;
    if (en.animTime > animRate) { en.animTime = 0; en.frame ^= 1; }
    en.hitFlash = Math.max(0, en.hitFlash - dt);

    // contact damage
    if (en.dmg > 0 && Math.hypot(dx, dy) < 12 && player.hitFlash <= 0) {
      if (!player.cheat) player.life -= en.dmg;
      player.hitFlash = 0.3;
      sfx('hit');
      player.x += (dx < 0 ? 1 : -1) * 8;
      player.y += (dy < 0 ? 1 : -1) * 8;
    }
  }
  enemies = enemies.filter(e => e.alive);

  for (const g of generators) {
    g.cd -= dt;
    if (g.cd <= 0 && enemies.filter(e => e.type === g.type).length < 6) {
      g.cd = 3 + Math.random() * 2;
      enemies.push(makeEnemy(g.type, g.x, g.y + TILE));
    }
  }
}

function spawnEnemyProj(x, y, nx, ny, kind, dmg) {
  const sp = kind === 'rock' ? 180 : 200;
  projectiles.push({ x, y, vx: nx * sp, vy: ny * sp, from:'enemy', life: 1.4, dmg, kind });
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }
    if (isBlocked(p.x, p.y, false)) { projectiles.splice(i, 1); continue; }
    if (p.from === 'player') {
      for (const en of enemies) {
        if (!en.alive) continue;
        if (Math.hypot(en.x - p.x, en.y - p.y) < 10) {
          damageEnemy(en, p.dmg, 'projectile');
          projectiles.splice(i, 1);
          break;
        }
      }
    } else {
      if (Math.hypot(player.x - p.x, player.y - p.y) < 10 && player.hitFlash <= 0) {
        if (!player.cheat) player.life -= p.dmg;
        player.hitFlash = 0.3; sfx('hit');
        projectiles.splice(i, 1);
      }
    }
  }
}

// ============================================================================
// Particles
// ============================================================================
function particleBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 20 + Math.random() * 60;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.4, c: PAL[Math.random()<0.5 ? 0xC : 0xD] });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function alertMsg(msg) { player.alertMsg = msg; player.alertTime = 2.5; }

function useInventorySlot(i) {
  const item = player.inventory[i];
  if (!item) return;
  if (item === 'key') {
    alertMsg('Walk to a door to use key');
    return; // keys auto-consume at doors, can't manually use
  }
  if (item === 'potion') {
    // potion: nuke visible enemies, restore some life
    for (const en of enemies) {
      if (!en.alive) continue;
      const dx = en.x - player.x, dy = en.y - player.y;
      if (Math.hypot(dx, dy) < 120) damageEnemy(en, 999, 'magic');
    }
    player.life = Math.min(player.life + 200, 9999);
    sfx('potion');
    alertMsg('POTION');
  } else if (item === 'food') {
    player.life = Math.min(player.life + 400, 9999);
    sfx('pickup');
    alertMsg('+400 LIFE');
  } else if (item === 'scroll_heal') {
    player.life = Math.min(player.life + 2500, 9999);
    sfx('potion'); alertMsg('HEAL +2500');
  } else if (item === 'scroll_blast') {
    for (const en of enemies) { if (en.alive) damageEnemy(en, 999, 'magic'); }
    sfx('potion'); alertMsg('BLAST!');
  } else if (item === 'scroll_speed') {
    player.speed += 4; sfx('pickup'); alertMsg('SPEED +4');
  } else if (item === 'scroll_strong') {
    player.strength += 2; sfx('pickup'); alertMsg('STRENGTH +2');
  } else if (item === 'scroll_shots') {
    player.missiles += 10; sfx('pickup'); alertMsg('MISSILES +10');
  } else if (item === 'scroll_invis') {
    player.invincibleTime = 25; sfx('potion'); alertMsg('INVISIBLE 25s');
  } else if (item === 'scroll_repel') {
    player.repelTime = 25; sfx('potion'); alertMsg('REPEL 25s');
  } else if (item === 'scroll_power') {
    player.speed += 4; player.strength += 2; player.missiles += 5;
    sfx('potion'); alertMsg('POWER UP!');
  }
  player.inventory.splice(i, 1);
  if (player.invSel >= player.inventory.length) player.invSel = Math.max(0, player.inventory.length - 1);
}

function dropInventorySlot(i) {
  if (!player.inventory[i]) return;
  player.inventory.splice(i, 1);
  if (player.invSel >= player.inventory.length) player.invSel = Math.max(0, player.inventory.length - 1);
  alertMsg('DROPPED');
}

function applyClass(cls) {
  player.cls = cls.id;
  player.className = cls.name;
  player.life = cls.life;
  player.speed = cls.speed;
  player.strength = cls.str;
  player.missiles = cls.shot;
  player.levelNum = 1;
  player.score = 0;
  player.gold = 0;
  player.inventory = [];
  player.hitFlash = 0;
  player.alertTime = 0;
  player.gems = 0;
  player.hudMode = 'stats';
  player.cheat = false;
  player.cheatCd = 0;
  player.lastEncounter = null;
}

function nextLevel() {
  player.score += 500;
  player.life += 200;
  sfx('levelup');
  startLevel(player.levelNum + 1);
}

// ============================================================================
// Rendering
// ============================================================================

function updateCamera() {
  const targetX = player.x - CW / (2 * SCALE);
  const targetY = player.y - VIEW_H / (2 * SCALE);
  cameraX = Math.max(0, Math.min(level.w * TILE - CW / SCALE, targetX));
  cameraY = Math.max(0, Math.min(level.h * TILE - VIEW_H / SCALE, targetY));
}

function worldToScreen(wx, wy) {
  return { x: (wx - cameraX) * SCALE, y: (wy - cameraY) * SCALE };
}

// Imported high-res bitmaps look jagged when downscaled with the global
// nearest-neighbor setting (which exists for the procedural pixel-art).
// Wrap drawImage with a smoothing toggle so each path gets its right look.
function _drawBitmap(spr, dx, dy, dw, dh) {
  if (spr._bestOfBitmap) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(spr, dx, dy, dw, dh);
    ctx.imageSmoothingEnabled = false;
  } else {
    ctx.drawImage(spr, dx, dy, dw, dh);
  }
}

function drawSpriteAt(spr, wx, wy, flip=false) {
  if (!spr) return;
  if (spr._bestOfBitmap) {
    // Imported bitmaps vary widely in source size; draw them into the same
    // 16x16 world footprint as the baked sprites so gameplay math is untouched.
    const drawSize = (spr._bestOfWorldSize || 16) * SCALE;
    const s = worldToScreen(wx, wy);
    const x = s.x - drawSize / 2, y = s.y - drawSize / 2;
    if (x + drawSize < 0 || x > CW || y + drawSize < 0 || y > VIEW_H) return;
    _drawBitmap(spr, x, y, drawSize, drawSize);
    return;
  }
  const s = worldToScreen(wx - 8, wy - 8);
  if (s.x + TS < 0 || s.x > CW || s.y + TS < 0 || s.y > VIEW_H) return;
  ctx.drawImage(spr, s.x, s.y, spr.width * SCALE, spr.height * SCALE);
}

function drawSpriteAtSize(spr, wx, wy, worldSize) {
  if (!spr) return;
  const drawSize = worldSize * SCALE;
  const s = worldToScreen(wx, wy);
  const x = s.x - drawSize / 2, y = s.y - drawSize / 2;
  if (x + drawSize < 0 || x > CW || y + drawSize < 0 || y > VIEW_H) return;
  _drawBitmap(spr, x, y, drawSize, drawSize);
}

function drawBestFitSprite(spr, cx, y, maxW, maxH, alpha=1) {
  if (!spr) return;
  const sw = spr.naturalWidth || spr.width || 16;
  const sh = spr.naturalHeight || spr.height || 16;
  if (!sw || !sh) return;
  const scale = Math.min(maxW / sw, maxH / sh);
  const w = sw * scale, h = sh * scale;
  const oldAlpha = ctx.globalAlpha;
  ctx.globalAlpha = oldAlpha * alpha;
  _drawBitmap(spr, cx - w / 2, y + (maxH - h) / 2, w, h);
  ctx.globalAlpha = oldAlpha;
}

function drawSpriteInBox(spr, x, y, maxW, maxH) {
  if (!spr) return;
  const sw = spr.naturalWidth || spr.width || 16;
  const sh = spr.naturalHeight || spr.height || 16;
  if (!sw || !sh) return;
  const scale = Math.min(maxW / sw, maxH / sh);
  const w = sw * scale, h = sh * scale;
  _drawBitmap(spr, x + (maxW - w) / 2, y + (maxH - h) / 2, w, h);
}

function drawTiles() {
  const tx0 = Math.floor(cameraX / TILE), ty0 = Math.floor(cameraY / TILE);
  const tx1 = tx0 + VIEW_COLS + 1, ty1 = ty0 + VIEW_ROWS + 1;
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const id = tileAt(tx, ty);
      // draw a floor underneath walls/doors/exit/torch/gen for ambient look
      if (id !== 0) {
        const floor = tileSprite(0, tx, ty, gameTime * 60);
        const sx = (tx * TILE - cameraX) * SCALE;
        const sy = (ty * TILE - cameraY) * SCALE;
        ctx.drawImage(floor, sx, sy, TS, TS);
      }
      const spr = tileSprite(id, tx, ty, gameTime * 60 | 0);
      const sx = (tx * TILE - cameraX) * SCALE;
      const sy = (ty * TILE - cameraY) * SCALE;
      ctx.drawImage(spr, sx, sy, TS, TS);
    }
  }
  // torches overlay (animated)
  for (const t of torches) {
    const spr = ((gameTime * 8) | 0) & 1 ? SPR.torch1 : SPR.torch0;
    drawSpriteAt(spr, t.x * TILE + 8, t.y * TILE + 8);
  }
}

function drawPlayer() {
  const f = player.frame;
  const cls = player.cls;
  let spr;
  // Show class-specific attack frame briefly after firing/melee.
  if (player.attackAnim > 0 && SPR[cls + '_attack']) {
    spr = SPR[cls + '_attack'];
  } else if (cls === 'warrior') {
    if (player.facing === 's') spr = f ? SPR.warrior_s_1 : SPR.warrior_s_0;
    else if (player.facing === 'n') spr = f ? SPR.warrior_n_1 : SPR.warrior_n_0;
    else if (player.facing === 'e') spr = f ? SPR.warrior_e_1 : SPR.warrior_e_0;
    else spr = f ? SPR.warrior_w_1 : SPR.warrior_w_0;
  } else {
    spr = SPR[cls + '_s_' + f] || SPR.warrior_s_0;
  }
  drawSpriteAt(spr, player.x, player.y);

  // damage flash
  if (player.hitFlash > 0 && ((gameTime * 30) | 0) & 1) {
    const s = worldToScreen(player.x - 8, player.y - 8);
    ctx.fillStyle = 'rgba(255,80,80,0.5)';
    ctx.fillRect(s.x, s.y, TS, TS);
  }
  // melee slash indicator
  if (player.attacking > 0) {
    let ax = player.x, ay = player.y;
    if (player.facing === 'n') ay -= 14;
    if (player.facing === 's') ay += 14;
    if (player.facing === 'e') ax += 14;
    if (player.facing === 'w') ax -= 14;
    const s = worldToScreen(ax - 6, ay - 6);
    ctx.fillStyle = 'rgba(255,240,100,0.7)';
    ctx.fillRect(s.x, s.y, 12 * SCALE, 12 * SCALE);
  }
}

function drawEnemies() {
  for (const en of enemies) {
    const f = en.frame;
    const spr = SPR[en.type + '_' + f] || SPR.scorpion_0;
    if (en.type === 'slime') {
      drawSpriteAtSize(spr, en.x, en.y, en.size || 16);
      if (en.hitFlash > 0) {
        const s = worldToScreen(en.x - 8, en.y - 8);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(s.x, s.y, TS, TS);
      }
      continue;
    }
    if ((en.size || 16) >= 32) {
      const s = worldToScreen(en.x - 16, en.y - 16);
      ctx.drawImage(spr, s.x, s.y, 32, 32);
      if (en.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(s.x, s.y, 32, 32);
      }
      // HP bar above IT
      if (en.type === 'it') {
        const bw = 40, bh = 4;
        ctx.fillStyle = '#222'; ctx.fillRect(s.x - 4, s.y - 8, bw, bh);
        ctx.fillStyle = '#c33';
        ctx.fillRect(s.x - 4, s.y - 8, bw * (en.hp / en.maxHp), bh);
      }
    } else {
      drawSpriteAt(spr, en.x, en.y);
      if (en.hitFlash > 0) {
        const s = worldToScreen(en.x - 8, en.y - 8);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(s.x, s.y, TS, TS);
      }
    }
  }
}

function drawItems() {
  for (const it of items) {
    const bob = Math.sin(gameTime * 3 + it.bob) * 2;
    let spr;
    if (it.type === 'food') spr = SPR.apple;
    else if (it.type === 'key') spr = SPR.key;
    else if (it.type === 'potion') spr = SPR.potion;
    else if (it.type === 'treasure') spr = SPR.treasure;
    else if (it.type === 'missile') spr = SPR.missilePickup;
    else if (it.type === 'gold') spr = SPR.gold;
    else if (it.type && it.type.startsWith('scroll_')) spr = SPR.scroll;
    else if (it.type && it.type.startsWith('gem_')) spr = SPR['gem_' + it.type.slice(4)];
    if (spr) drawSpriteAt(spr, it.x, it.y + bob);
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    const spr = p.from === 'player' ? SPR.projPlayer : SPR.projFire;
    drawSpriteAt(spr, p.x, p.y);
  }
}

function drawParticles() {
  for (const p of particles) {
    const s = worldToScreen(p.x, p.y);
    ctx.fillStyle = p.c;
    ctx.fillRect(s.x, s.y, 3, 3);
  }
}

// ----- HUD -------------------------------------------------------------------

function drawHUD() {
  if (player.hudMode === 'inv') { drawHUDInv(); return; }
  if (player.hudMode === 'shop') { drawHUDShop(); return; }
  // Lynx-style HUD: black portrait well on the left, white stat card on the right.
  ctx.fillStyle = '#000';
  ctx.fillRect(0, HUD_Y, CW, HUD_H);
  ctx.fillStyle = '#f4f4e8';
  ctx.fillRect(96, HUD_Y + 4, CW - 100, HUD_H - 8);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.strokeRect(96, HUD_Y + 4, CW - 100, HUD_H - 8);
  ctx.fillStyle = '#2d5016';
  ctx.fillRect(0, HUD_Y, CW, 2);

  // radar/encounter frame on left — shows last item picked up or enemy killed
  const px = 8, py = HUD_Y + 8;
  const pw = 80, ph = 80;
  ctx.fillStyle = '#f4f4e8'; ctx.fillRect(px-2, py-2, pw+4, ph+4);
  ctx.fillStyle = '#000'; ctx.fillRect(px, py, pw, ph);
  // show last encountered thing (item picked up / enemy killed)
  const encSpr = encounterSprite(player.lastEncounter);
  if (encSpr) {
    drawSpriteInBox(encSpr, px + 2, py + 2, pw - 4, ph - 20);
    // label below
    const label = encounterLabel(player.lastEncounter);
    ctx.fillStyle = player.lastEncounter.type === 'enemy' ? '#c33' : '#e8c547';
    ctx.font = 'bold 9px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, px + pw/2, py + ph - 12);
    ctx.textAlign = 'left';
  } else {
    ctx.fillStyle = '#333';
    ctx.font = 'bold 9px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RADAR', px + pw/2, py + ph/2 + 4);
    ctx.textAlign = 'left';
  }

  // stat column on right
  const sx = 100, sy0 = HUD_Y + 10;
  ctx.textBaseline = 'top';
  ctx.font = 'bold 14px Courier New, monospace';
  // count keys in inventory
  const keyCount = player.inventory.filter(x => x === 'key').length;
  const rows = [
    ['LIFE',     player.life.toString()],
    ['SPEED',    (player.speed|0).toString()],
    ['STRENGTH', player.strength.toString()],
    ['MISSILES', player.missiles.toString()],
    ['KEYS',     keyCount.toString()],
    ['GOLD',     player.gold.toString()],
    ['LEVEL',    player.levelNum.toString()],
    ['SCORE',    player.score.toString()],
  ];
  for (let i = 0; i < rows.length; i++) {
    const y = sy0 + i * 13;
    ctx.fillStyle = '#0b7f20';
    ctx.font = 'bold 12px Courier New, monospace';
    ctx.fillText(rows[i][0], sx, y);
    ctx.fillStyle = '#111';
    ctx.textAlign = 'right';
    ctx.fillText(rows[i][1], CW - 10, y);
    ctx.textAlign = 'left';
  }
  // cheat indicator
  if (player.cheat) {
    ctx.fillStyle = '#e8c547';
    ctx.font = 'bold 10px Courier New, monospace';
    ctx.fillText('CHEAT', sx, sy0 + rows.length * 13 + 2);
  }
  // gem progress row — bigger, lower
  const gemSize = 12;
  const gx0 = 100, gy = HUD_Y + HUD_H - 14;
  ctx.font = '8px Courier New, monospace';
  ctx.fillStyle = '#0b7f20'; ctx.fillText('GEMS', gx0, gy - 1);
  for (let i = 0; i < 8; i++) {
    const x = gx0 + 30 + i * (gemSize + 2), y = gy - 2;
    ctx.fillStyle = '#222'; ctx.fillRect(x, y, gemSize, gemSize);
    if (player.gems & (1 << i) && SPR['gem_' + i]) {
      ctx.drawImage(SPR['gem_' + i], x - 1, y - 1, gemSize + 2, gemSize + 2);
    }
  }
}

// inventory HUD — original Lynx layout:
// Left panel: large image of selected item.
// Right panel: LIFE, 3 visible item icons (selected highlighted), USE, DROP.
function drawHUDInv() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, HUD_Y, CW, HUD_H);
  ctx.fillStyle = '#f4f4e8';
  ctx.fillRect(96, HUD_Y + 4, CW - 100, HUD_H - 8);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.strokeRect(96, HUD_Y + 4, CW - 100, HUD_H - 8);
  ctx.fillStyle = '#2d5016';
  ctx.fillRect(0, HUD_Y, CW, 2);

  // ---- left panel: big item picture ----
  const px = 8, py = HUD_Y + 6, pw = 86, ph = 86;
  ctx.fillStyle = '#f4f4e8'; ctx.fillRect(px - 2, py - 2, pw + 4, ph + 4);
  ctx.fillStyle = '#000'; ctx.fillRect(px, py, pw, ph);

  const selItem = player.inventory[player.invSel];
  if (selItem) {
    const icon = itemIcon(selItem);
    if (icon) {
      drawSpriteInBox(icon, px + 2, py + 2, pw - 4, ph - 20);
    }
    // item name below image
    let label = selItem.replace('scroll_','').toUpperCase();
    if (selItem.startsWith('scroll_')) label = label + ' SCROLL';
    ctx.fillStyle = '#e8c547';
    ctx.font = 'bold 8px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, px + pw / 2, py + ph - 8);
    ctx.textAlign = 'left';
  } else {
    ctx.fillStyle = '#444';
    ctx.font = 'bold 10px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('EMPTY', px + pw / 2, py + ph / 2 + 4);
    ctx.textAlign = 'left';
  }

  // ---- right panel ----
  const sx = 104, sy0 = HUD_Y + 8;
  const rw = CW - sx - 6;  // right panel width
  ctx.textBaseline = 'top';

  // LIFE
  ctx.font = 'bold 14px Courier New, monospace';
  ctx.fillStyle = '#6db33a';
  ctx.fillText('LIFE', sx, sy0);
  ctx.fillStyle = '#e8c547';
  ctx.textAlign = 'right';
  ctx.fillText(player.life.toString(), CW - 8, sy0);
  ctx.textAlign = 'left';

  // 3 visible item icons — show items around the selection
  const invLen = player.inventory.length;
  const iconSz = 28;
  const iconY = sy0 + 22;

  if (invLen > 0) {
    // Show 3 items centered on invSel
    const vis = 3;
    let start = Math.max(0, player.invSel - 1);
    if (start + vis > invLen) start = Math.max(0, invLen - vis);
    const end = Math.min(invLen, start + vis);
    const totalW = (end - start) * (iconSz + 6) - 6;
    const ox = sx + (rw - totalW) / 2;

    for (let vi = start; vi < end; vi++) {
      const ix = ox + (vi - start) * (iconSz + 6);
      const iy = iconY;
      // selected highlight
      if (vi === player.invSel) {
        ctx.strokeStyle = '#e8c547'; ctx.lineWidth = 2;
        ctx.strokeRect(ix - 2, iy - 2, iconSz + 4, iconSz + 4);
      }
      ctx.fillStyle = '#111'; ctx.fillRect(ix, iy, iconSz, iconSz);
      const ic = itemIcon(player.inventory[vi]);
      if (ic) ctx.drawImage(ic, ix + 2, iy + 2, iconSz - 4, iconSz - 4);
    }
    // scroll arrows
    if (start > 0) {
      ctx.fillStyle = '#888'; ctx.font = '10px Courier New, monospace';
      ctx.fillText('\u25C0', ox - 12, iconY + 8);
    }
    if (end < invLen) {
      ctx.fillStyle = '#888'; ctx.font = '10px Courier New, monospace';
      ctx.fillText('\u25B6', ox + totalW + 4, iconY + 8);
    }
  } else {
    ctx.fillStyle = '#555'; ctx.font = '10px Courier New, monospace';
    ctx.fillText('(no items)', sx + 20, iconY + 6);
  }

  // USE / DROP
  const labelY = iconY + iconSz + 8;
  ctx.font = 'bold 14px Courier New, monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6db33a';
  ctx.fillText('USE', sx + rw / 2, labelY);
  ctx.fillStyle = '#c33';
  ctx.fillText('DROP', sx + rw / 2, labelY + 18);
  ctx.textAlign = 'left';

  if (player.alertTime > 0) {
    ctx.fillStyle = '#c33';
    ctx.textAlign = 'center';
    ctx.font = 'bold 10px Courier New, monospace';
    ctx.fillText(player.alertMsg, CW / 2, HUD_Y + HUD_H - 8);
    ctx.textAlign = 'left';
  }
}

function itemIcon(type) {
  if (type === 'potion')   return SPR.potion;
  if (type === 'food')     return SPR.apple;
  if (type === 'key')      return SPR.key;
  if (type === 'treasure') return SPR.treasure;
  if (type === 'missile')  return SPR.missilePickup;
  if (type === 'gold')     return SPR.gold;
  if (type === 'terminal') return SPR.terminal0;
  if (type && type.startsWith('scroll_')) return SPR.scroll;
  return null;
}

// Get a sprite for a last-encounter display (enemies or items)
function encounterSprite(enc) {
  if (!enc) return null;
  if (enc.type === 'item') return itemIcon(enc.id);
  if (enc.type === 'enemy') {
    return SPR[enc.id + '_0'] || null;
  }
  return null;
}
function encounterLabel(enc) {
  if (!enc) return '';
  const names = {
    food:'FOOD', key:'KEY', potion:'POTION', treasure:'TREASURE', gold:'GOLD',
    missile:'MISSILES', terminal:'TERMINAL',
    scroll_heal:'HEAL SCROLL', scroll_blast:'BLAST SCROLL', scroll_speed:'SPEED SCROLL',
    scroll_strong:'STRONG SCROLL', scroll_invis:'INVIS SCROLL', scroll_shots:'SHOTS SCROLL',
    scroll_repel:'REPEL SCROLL', scroll_power:'POWER SCROLL',
    slime:'SLIME', scorpion:'SCORPION', skeleton:'SKELETON', ghost:'GHOST', grunt:'GRUNT',
    demon:'DEMON', sorcerer:'SORCERER', lobber:'LOBBER', death:'DEATH', it:'IT',
  };
  if (enc.id && enc.id.startsWith('gem_')) return 'STAR GEM';
  return names[enc.id] || enc.id.toUpperCase();
}

function drawSelect() {

    const oSpr = SPR[other.id + '_s_0'] || SPR.warrior_s_0;
    // Arrange in a row behind the main character
    const offset = i < selectIdx ? i : i - 1;
    const total = CLASSES.length - 1;

// Bobbing "EXIT" label above the warp so the user never mistakes a
// generator or a locked door for the level exit.
function drawExitMarker() {
  const ex = level && level.spawns && level.spawns.exit;
  if (!ex) return;
  // Boss arena uses (1,1) as a placeholder exit — don't label it there.
  if (level.tiles[ex.y * level.w + ex.x] !== 4) return;
  const world = worldToScreen(ex.x * TILE + TILE / 2, ex.y * TILE - 2 + Math.sin(gameTime * 4) * 2);
  if (world.y < 0 || world.y > VIEW_H) return;
  ctx.font = 'bold 10px Courier New, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#000';
  ctx.fillText('EXIT', world.x + 1, world.y + 1);
  ctx.fillStyle = ((gameTime * 3) | 0) & 1 ? '#e8c547' : '#3399cc';
  ctx.fillText('EXIT', world.x, world.y);
  ctx.textAlign = 'left';
}

    { spr: () => SPR.slime_0,                                    name: 'SLIME',     desc: 'Missiles split it; melee kills' },
    { spr: () => SPR.terminal0,                                  name: 'TERMINAL',  desc: 'Items nearby cost gold' },
    { spr: () => SPR.doorClosed,                                 name: 'DOOR',      desc: 'Walk up with key to open' },
    { spr: () => SPR.key,                                        name: 'KEY',       desc: 'Opens one door (auto)' },
    { spr: () => SPR.gold,                                       name: 'GOLD',      desc: 'Currency for terminals' },
    { spr: () => SPR.apple,                                      name: 'FOOD',      desc: 'USE from inv: +400 life' },
    { spr: () => SPR.potion,                                     name: 'POTION',    desc: 'USE: bomb nearby + heal' },
    { spr: () => SPR.scroll,                                     name: 'SCROLL',    desc: 'USE: heal/blast/speed/etc' },
    { spr: () => SPR.treasure,                                   name: 'TREASURE',  desc: '+200 gold' },
    { spr: () => SPR.missilePickup,                              name: 'MISSILES',  desc: '+5 ammo' },
    { spr: () => SPR.gem_0,                                      name: 'STAR GEM',  desc: '1 per level (2-9), get all 8' },
  ];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const s = r.spr();
    if (s) ctx.drawImage(s, 16, cy, 13, 13);
    ctx.fillStyle = '#e8c547';
    ctx.font = 'bold 8px Courier New, monospace';
    ctx.fillText(r.name, 34, cy + 2);
    ctx.fillStyle = '#9a9';
    ctx.font = '8px Courier New, monospace';
    ctx.fillText(r.desc, 104, cy + 2);
    cy += 15;
  }
}

// ============================================================================
// Main loop
// ============================================================================

let lastT = 0;
function loop(t) {
  const now = t / 1000;
  let dt = Math.min(1/30, now - lastT);
  lastT = now;
  gameTime += dt;

  if (gameState === STATE.TITLE) {
    drawTitle();
    if (inputStart()) { gameState = STATE.SELECT; selectCooldown = 0.3; }
  } else if (gameState === STATE.SELECT) {
    drawSelect();
    selectCooldown = Math.max(0, selectCooldown - dt);
    if (selectCooldown <= 0) {
      const { dx } = inputDir();
      if (dx) {
        if (dx > 0) selectIdx = (selectIdx + 1) % CLASSES.length;
        if (dx < 0) selectIdx = (selectIdx - 1 + CLASSES.length) % CLASSES.length;
        selectCooldown = 0.18;
      }
      if (inputStart()) {
        applyClass(CLASSES[selectIdx]);
        startLevel(1);
        gameState = STATE.PLAY;
        selectCooldown = 0.3;
      }
    }
  } else if (gameState === STATE.PLAY) {
    helpCd = Math.max(0, helpCd - dt);
    if (keys.KeyH && helpCd <= 0) {
      helpOpen = !helpOpen;
      helpCd = 0.3;
    }
    // Freeze gameplay while help is open.
    if (!helpOpen) {
      updatePlayer(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateParticles(dt);
      updateCamera();
      player.alertTime = Math.max(0, player.alertTime - dt);
      player.invCd = Math.max(0, player.invCd - dt);
      player.useCd = Math.max(0, player.useCd - dt);
      player.cheatCd = Math.max(0, player.cheatCd - dt);
    }
    if (!helpOpen) {
      if (inputInv() && player.invCd <= 0 && player.hudMode !== 'shop') {
        player.hudMode = (player.hudMode === 'stats') ? 'inv' : 'stats';
        player.invCd = 0.25;
      }
      if ((keys.KeyC || (touchState.i && touchState.s)) && player.cheatCd <= 0) {
        player.cheat = !player.cheat;
        player.cheatCd = 0.5;
        if (player.cheat) {
          player.life = 9999;
          player.missiles = 99;
          player.strength = Math.max(player.strength, 10);
          alertMsg('CHEAT: ON');
        } else {
          alertMsg('CHEAT: OFF');
        }
        sfx('pickup');
      }
      if (player.hudMode === 'inv' && player.useCd <= 0) {
        const { dx: idX, dy: idY } = inputDir();
        if (idX > 0) { player.invSel = Math.min(player.invSel + 1, Math.max(0, player.inventory.length - 1)); player.useCd = 0.18; }
        if (idX < 0) { player.invSel = Math.max(0, player.invSel - 1); player.useCd = 0.18; }
        if (idY < 0) { useInventorySlot(player.invSel); player.useCd = 0.3; }   // Up = USE
        if (idY > 0) { dropInventorySlot(player.invSel); player.useCd = 0.3; }  // Down = DROP
        if (keys.KeyU) { useInventorySlot(player.invSel); player.useCd = 0.3; }
        if (keys.KeyX) { dropInventorySlot(player.invSel); player.useCd = 0.3; }
      }
      // Shop controls: left/right browse, up = buy, down/INV = close
      if (player.hudMode === 'shop' && player.useCd <= 0) {
        const { dx: sdx, dy: sdy } = inputDir();
        if (sdx > 0) { player.shopSel = Math.min(player.shopSel + 1, SHOP_STOCK.length - 1); player.useCd = 0.18; }
        if (sdx < 0) { player.shopSel = Math.max(0, player.shopSel - 1); player.useCd = 0.18; }
        if (sdy < 0) { // Up = BUY
          const item = SHOP_STOCK[player.shopSel];
          if (player.gold >= item.price) {
            player.gold -= item.price;
            pickupItem(item.type);
            sfx('pickup');
            alertMsg('Bought ' + item.name);
          } else {
            alertMsg('Need ' + item.price + ' gold');
            sfx('alert');
          }
          player.useCd = 0.3;
        }
        if (sdy > 0 || inputInv()) { // Down or INV = close shop
          player.hudMode = 'stats';
          player.shopExitCd = 1.0;  // 1 second before terminal can reopen
          player.useCd = 0.25;
        }
      }
    }
    drawPlayField();
    if (!helpOpen && player.life <= 0) { gameState = STATE.DEAD; saveHighScore(player.score); }
  } else if (gameState === STATE.DEAD) {
    drawDead();
    if (inputStart()) {
      gameState = STATE.SELECT;
      selectCooldown = 0.3;
    }
  } else if (gameState === STATE.VICTORY) {
    drawVictory();
    if (inputStart()) {
      gameState = STATE.TITLE;
    }
  }

  requestAnimationFrame(loop);
}

// ----- init ------------------------------------------------------------------
bake();
requestAnimationFrame(loop);
</script>

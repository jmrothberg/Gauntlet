<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>JMR's Original — Gauntlet: The Third Encounter</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{min-height:100dvh}#shell{height:100dvh;display:flex;flex-direction:column}header{height:44px;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top);background:#0a0a0a;border-bottom:1px solid #222;font-weight:700;font-size:14px;letter-spacing:.3px}#game{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center}#picker{position:fixed;inset:44px 0 0 0;display:flex;align-items:center;justify-content:center;background:#050505;z-index:20;padding:24px;text-align:center}.card{max-width:560px}.card h1{font-size:26px;margin:0 0 10px}.card p{color:#bbb;line-height:1.45}.button{display:inline-block;margin-top:12px;padding:14px 22px;border-radius:12px;background:#d82323;color:#fff;font-weight:800;font-size:17px}.hint{font-size:13px;color:#888;margin-top:14px}input{display:none}@media(orientation:landscape) and (max-height:600px){header{height:32px;font-size:12px}#picker{inset:32px 0 0 0}}
</style>
</head>
<body>
<main id="shell"><header>JMR'S ORIGINAL — GAUNTLET: THE THIRD ENCOUNTER</header><div id="game"></div></main>
<div id="picker"><div class="card"><h1>JMR's Original</h1><p>Play the original Atari Lynx version on your iPad. Select your <b>Gauntlet: The Third Encounter</b> Lynx ROM from the Files app.</p><label class="button" for="rom">Choose Game</label><input id="rom" type="file" accept=".lnx,application/octet-stream"><div class="hint">The ROM stays on your device and is not uploaded.</div></div></div>
<script>
const input=document.getElementById('rom');
input.addEventListener('change',async()=>{
  const file=input.files&&input.files[0]; if(!file)return;
  document.getElementById('picker').style.display='none';
  const url=URL.createObjectURL(file);
  window.EJS_player='#game';
  window.EJS_core='lynx';
  window.EJS_gameName="JMR's Original — Gauntlet: The Third Encounter";
  window.EJS_gameUrl=url;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded=false;
  window.EJS_color='#d82323';
  const s=document.createElement('script');
  s.src=window.EJS_pathtodata+'loader.js';
  document.body.appendChild(s);
});
</script>
</body>
</html>

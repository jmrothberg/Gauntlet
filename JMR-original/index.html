<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050505" />
  <title>JMR's Original — Gauntlet: The Third Encounter</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{min-height:100dvh;display:flex;align-items:stretch;justify-content:center}
    #shell{width:100%;height:100dvh;display:flex;flex-direction:column;background:#050505}
    #top{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:#0a0a0a;border-bottom:1px solid #222}
    #title{font-size:14px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
    #game{flex:1;min-height:0;width:100%;background:#000;display:flex;align-items:center;justify-content:center}
    #status{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#050505;z-index:50;padding:24px;text-align:center}
    #status .box{max-width:560px;line-height:1.45}
    #status h1{font-size:22px;margin:0 0 12px}
    #status p{font-size:15px;color:#ccc;margin:8px 0}
    @media (orientation:landscape) and (max-height:600px){#top{height:32px;flex-basis:32px}#title{font-size:12px}}
  </style>
</head>
<body>
  <main id="shell">
    <header id="top"><div id="title">JMR'S ORIGINAL — GAUNTLET: THE THIRD ENCOUNTER</div></header>
    <div id="game"></div>
  </main>
  <div id="status"><div class="box"><h1>Could not load the browser emulator</h1><p>Check your internet connection and reload the page.</p></div></div>

  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'lynx';
    window.EJS_gameName = "JMR's Original — Gauntlet: The Third Encounter";
    window.EJS_gameUrl = './roms/Gauntlet-The-Third-Encounter.lnx';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = false;
    window.EJS_color = '#d82323';

    async function boot() {
      try {
        const r = await fetch('./lynxboot.img', {cache:'no-store'});
        if (r.ok) window.EJS_biosUrl = './lynxboot.img';
      } catch (_) {}
      const s = document.createElement('script');
      s.src = window.EJS_pathtodata + 'loader.js';
      s.async = true;
      s.onerror = () => { document.getElementById('status').style.display='flex'; };
      document.body.appendChild(s);
    }
    boot();
  </script>
</body>
</html>

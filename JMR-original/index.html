<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>JMR's Original — Gauntlet: The Third Encounter</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
body{min-height:100dvh}
#game{width:100%;height:100dvh;background:#000}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#000;text-align:center;padding:24px;box-sizing:border-box}
#loading.hidden{display:none}
#loading .box{max-width:520px}
#loading strong{display:block;font-size:22px;margin-bottom:10px}
#loading span{color:#aaa;font-size:15px;line-height:1.45}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="box"><strong>JMR's Original</strong><span id="status">Loading Gauntlet: The Third Encounter…</span></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const loading=document.getElementById('loading');
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser is too old. Update Safari/iPadOS and reload.');

    const [romText,bootText]=await Promise.all([
      fetch('./rom-data.b64',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('Game data failed to load');return r.text()}),
      fetch('./free-lynxboot.b64',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('Lynx boot ROM failed to load');return r.text()})
    ]);

    status.textContent='Preparing original Lynx game…';
    const fromB64=s=>{
      const bin=atob(s.trim());
      const out=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
      return out;
    };

    const gzBytes=fromB64(romText);
    const stream=new Blob([gzBytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const romBytes=new Uint8Array(await new Response(stream).arrayBuffer());
    if(romBytes.length!==131136) throw new Error('Game data integrity check failed');

    const bootBytes=fromB64(bootText);
    if(bootBytes.length!==512) throw new Error('Boot ROM integrity check failed');

    const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
    const biosUrl=URL.createObjectURL(new Blob([bootBytes],{type:'application/octet-stream'}));

    window.EJS_player='#game';
    window.EJS_core='lynx';
    window.EJS_gameName="JMR's Original — Gauntlet: The Third Encounter";
    window.EJS_gameUrl=romUrl;
    window.EJS_biosUrl=biosUrl;
    window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded=true;
    window.EJS_color='#d82323';
    window.EJS_backgroundColor='#000000';

    const loader=document.createElement('script');
    loader.src=window.EJS_pathtodata+'loader.js';
    loader.async=true;
    loader.onload=()=>{loading.classList.add('hidden')};
    loader.onerror=()=>{status.textContent='The emulator failed to load. Check the connection and reload.'};
    document.body.appendChild(loader);
  }catch(err){
    console.error(err);
    status.textContent=err && err.message ? err.message : 'Could not start the game.';
  }
})();
</script>
</body>
</html>

                            this.direction = Object.values(Direction)[Math.floor(Math.random() * 4)];
                        }
                    }

                    this.last_direction_change = 0;
                }

                // Move based on direction
                let dx = 0, dy = 0;
                if (this.direction == Direction.LEFT) dx = -this.speed * dt * 60;
                else if (this.direction == Direction.RIGHT) dx = this.speed * dt * 60;
                else if (this.direction == Direction.UP) dy = -this.speed * dt * 60;
                else if (this.direction == Direction.DOWN) dy = this.speed * dt * 60;

                // Check wall collisions
                let new_x = this.x + dx;
                let new_y = this.y + dy;

                if (this.game && !this.game.check_wall_collision(new_x, new_y)) {
                    this.x = new_x;
                    this.y = new_y;
                } else {
                    // Hit a wall, change direction
                    this.direction = Object.values(Direction)[Math.floor(Math.random() * 4)];
                    this.last_direction_change = 0;
                }
            }

            take_damage(damage) {
                this.life -= damage;
                this.hit_timer = 0.5; // Flash red for 0.5 seconds
                if (this.life <= 0) {
                    if (this.type == EnemyType.SLIME) {
                        return true; // Signal to create new slimes
                    }
                }
                return false;
            }

        }

        // Item class
        class Item {
            constructor(x, y, item_type) {
                this.x = x;
                this.y = y;
                this.type = item_type;
                this.collected = false;
            }

            update(dt) {
                // Items don't move
            }
        }

        // Projectile class
        class Projectile {
            constructor(x, y, direction, speed, damage) {
                this.x = x;
                this.y = y;
                this.direction = direction;
                this.speed = speed;
                this.damage = damage;
                this.alive = true;
            }

            update(dt) {
                // Move based on direction
                let dx = 0, dy = 0;
                if (this.direction == Direction.LEFT) dx = -this.speed * dt * 60;
                else if (this.direction == Direction.RIGHT) dx = this.speed * dt * 60;
                else if (this.direction == Direction.UP) dy = -this.speed * dt * 60;
                else if (this.direction == Direction.DOWN) dy = this.speed * dt * 60;

                this.x += dx;
                this.y += dy;

                // Remove if out of bounds
                if (this.x < 0 || this.x > WORLD_WIDTH || this.y < 0 || this.y > WORLD_HEIGHT) {
                    this.alive = false;
                }
            }



            // Character switching
            switch_character() {
                if (!this.player) return;

                let character_keys = Object.keys(CHARACTER_CLASSES);
                let current_index = character_keys.indexOf(this.current_character_key);
                if (current_index === -1) current_index = 0;

                let next_index = (current_index + 1) % character_keys.length;
                let next_character_key = character_keys[next_index];

                // Preserve current player stats
                let current_life = this.player.life;
                let current_max_life = this.player.max_life;
                let current_gold = this.player.gold;
                let current_keys = this.player.keys_collected;
                let current_inventory = this.player.inventory.slice();
                let current_x = this.player.x;
                let current_y = this.player.y;

                // Create new player
                this.player = new Player(next_character_key, this.current_level);
                this.player.game = this;

                // Restore preserved stats
                this.player.life = current_life;
                this.player.max_life = current_max_life;
                this.player.gold = current_gold;
                this.player.keys_collected = current_keys;
                this.player.inventory = current_inventory;
                this.player.x = current_x;
                this.player.y = current_y;

                this.current_character_key = next_character_key;
                let char_class = CHARACTER_CLASSES[next_character_key];
                this.add_ui_message(`Switched to ${char_class.name}!`);
            }

            complete_level() {
                // Advance to next level (max level 6)
                this.current_level += 1;
                if (this.current_level > 6) {
                    this.current_level = 6; // Cap at level 6
                }

                // HUD message for level completion
                this.add_ui_message(`Level ${this.current_level - 1} complete → L${this.current_level}`);

                // Recreate player with new level stats, preserving character class
                let character_key = this.current_character_key;
                if (!character_key && this.player) {
                    // Fallback: derive key from current class name
                    for (let k of Object.keys(CHARACTER_CLASSES)) {
                        if (CHARACTER_CLASSES[k].name === this.player.character_class.name) {
                            character_key = k;
                            break;
                        }
                    }
                }
                if (!character_key) {
                    character_key = 'android';
                }

                this.player = new Player(character_key, this.current_level);
                this.load_level(this.current_level);
            }


            start_game_at_level(character_class, level) {
                this.current_character_key = character_class;
                this.player = new Player(character_class, level);
                this.player.game = this;
                this.current_level = level;
                this.state = GameState.PLAYING;
                this.load_level(level);
                console.log(`Starting game with ${character_class} at level ${level}`);
            }

        }

        // Initialize and start game
        function init() {
            initCanvas();
            loadSprites();
            createTiles();
            window.game = game = new GauntletGame();

            // Resume audio context on first user interaction
            const resumeAudio = () => {
                if (game.sound_manager) {
                    game.sound_manager.audioContext.resume().catch(() => {});
                }
                document.removeEventListener('keydown', resumeAudio);
                document.removeEventListener('click', resumeAudio);
                document.removeEventListener('touchstart', resumeAudio);
                document.removeEventListener('touchend', resumeAudio);
            };
            document.addEventListener('keydown', resumeAudio);
            document.addEventListener('click', resumeAudio);
            document.addEventListener('touchstart', resumeAudio, {passive: false});
            document.addEventListener('touchend', resumeAudio, {passive: false});

            // Start game immediately - sprites will load in background
            game.run();
        }

        // Start the game when page loads (only in game mode)
        if (isGameMode) {
            window.onload = init;
        }
    </script>

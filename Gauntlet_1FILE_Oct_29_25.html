        // Show/hide appropriate UI based on mode

            document.getElementById('launcher').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';

            // Step 1: Open blank window first (this triggers window mode)
            const gameWindow = window.open(

                '_blank',
                'fullscreen=yes,scrollbars=no,resizable=yes,menubar=no,toolbar=no,location=no,status=no'
            );

            if (gameWindow) {
                // Step 2: Resize immediately while window is still blank
                setTimeout(() => {
                    try {
                        gameWindow.resizeTo(480, 850); // Exact game dimensions
                        gameWindow.moveTo(1500, 200);
                        console.log('Resized window to 480x800');

                        // Step 3: Navigate to game URL after resize
                        setTimeout(() => {
                            gameWindow.location.href = window.location.href + '?gamemode=true';
                            gameWindow.focus();
                            console.log('Navigated to game URL');
                        }, 200);

                    } catch(e) {
                        console.log('Could not resize game window:', e);
                        // Fallback: still navigate to game
                        gameWindow.location.href = window.location.href + '?gamemode=true';
                    }

        // Web Audio API sound manager (procedural sound generation)
        class WebSoundManager {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.audioResumed = false;
            }

            generateTone(frequency, duration, volume = 0.3) {
                // Resume audio context if suspended
                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume().catch(() => {});
                }

                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);

                    oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
                    oscillator.type = 'sine';

                    gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(volume, this.audioContext.currentTime + 0.01);
                    gainNode.gain.linearRampToValueAtTime(0, this.audioContext.currentTime + duration);

                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                } catch (e) {
                    // Ignore audio errors
                }
            }

            play_item_collect() {
                this.generateTone(800, 0.1);
            }

            play_gold_collect() {
                this.generateTone(1000, 0.15);
            }

            play_food_eat() {
                this.generateTone(600, 0.2);
            }

            play_damage() {
                this.generateTone(300, 0.3, 0.5);
            }

            play_death() {
                // Simple death sound - multiple tones
                setTimeout(() => this.generateTone(300, 0.2, 0.6), 0);
                setTimeout(() => this.generateTone(250, 0.2, 0.6), 100);
                setTimeout(() => this.generateTone(200, 0.2, 0.6), 200);
            }

            play_melee() {
                // Brief whoosh tone
                this.generateTone(200, 0.08, 0.25);
            }

            play_shoot() {
                // Shooting sound - similar to item collect but distinct
                this.generateTone(700, 0.08, 0.4);
            }

            play_attack() {
                // General attack sound - whoosh
                this.generateTone(150, 0.06, 0.2);
            }
        }

        // Sliced sprites already have proper alpha; no edge post-processing needed.
        const TRANSPARENT_EDGE_SPRITES = new Set();

        function makeTransparentEdgeSprite(img) {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth || img.width;
            c.height = img.naturalHeight || img.height;
            const cx = c.getContext('2d');
            cx.drawImage(img, 0, 0);
            const image = cx.getImageData(0, 0, c.width, c.height);
            const data = image.data;
            const seen = new Uint8Array(c.width * c.height);
            const stack = [];
            const nearEdgeMat = (idx) => {
                const p = idx * 4;
                const a = data[p + 3];
                if (a < 10) return true;
                const r = data[p], g = data[p + 1], b = data[p + 2];
                const spread = Math.max(r, g, b) - Math.min(r, g, b);
                const avg = (r + g + b) / 3;
                return spread < 28 && avg >= 70 && avg <= 255;
            };
            const push = (x, y) => {
                if (x < 0 || y < 0 || x >= c.width || y >= c.height) return;
                const idx = y * c.width + x;
                if (seen[idx] || !nearEdgeMat(idx)) return;
                seen[idx] = 1;
                stack.push(idx);
            };
            for (let x = 0; x < c.width; x++) { push(x, 0); push(x, c.height - 1); }
            for (let y = 0; y < c.height; y++) { push(0, y); push(c.width - 1, y); }
            while (stack.length) {
                const idx = stack.pop();
                data[idx * 4 + 3] = 0;
                const x = idx % c.width, y = (idx / c.width) | 0;
                push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1);
            }
            cx.putImageData(image, 0, 0);
            return c;
        }

        // Initialize canvas
        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            canvas.width = SCREEN_WIDTH;
            canvas.height = SCREEN_HEIGHT;
            ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ui = document.getElementById('ui');

            // Set up input handlers
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // Mobile: scale canvas to fit screen and set up touch controls
            if (isMobile) {
                scaleCanvas();
                window.addEventListener('resize', scaleCanvas);
                window.addEventListener('orientationchange', () => {
                    setTimeout(scaleCanvas, 100);
                });
                setupTouchControls();
            }
        }

        // Scale canvas container to fit mobile viewport, with button bar below
        var BUTTON_BAR_HEIGHT = 52;
        function scaleCanvas() {
            if (!isMobile) return;
            var container = document.getElementById('gameContainer');
            var controls = document.getElementById('touchControls');
            var availH = window.innerHeight - BUTTON_BAR_HEIGHT;
            var scaleX = window.innerWidth / SCREEN_WIDTH;
            var scaleY = availH / SCREEN_HEIGHT;
            var scale = Math.min(scaleX, scaleY);
            var scaledW = SCREEN_WIDTH * scale;
            var scaledH = SCREEN_HEIGHT * scale;
            var leftOffset = Math.max(0, (window.innerWidth - scaledW) / 2);
            container.style.transform = 'scale(' + scale + ')';
            container.style.transformOrigin = 'top left';
            container.style.position = 'absolute';
            container.style.top = '0px';
            container.style.left = leftOffset + 'px';
            // Position button bar right below scaled canvas
            if (controls) {
                controls.style.position = 'absolute';
                controls.style.top = scaledH + 'px';
                controls.style.left = '0px';
                controls.style.width = '100%';
            }
        }

        // Load sprites from embedded data
        function loadSprites() {
            totalSprites = Object.keys(embeddedSprites).length;

            for (const [key, dataURI] of Object.entries(embeddedSprites)) {
                const img = new Image();
                img.onload = function() {
                    // Clean only connected white/gray edge mats so internal
                    // sprite detail stays intact.
                    sprites[key] = TRANSPARENT_EDGE_SPRITES.has(key) ? makeTransparentEdgeSprite(img) : img;
                    loadedSprites++;
                    if (loadedSprites >= totalSprites) {
                        spritesLoaded = true;
                    }
                };
                img.onerror = function() {
                    console.error('Failed to load embedded sprite:', key);
                    loadedSprites++;
                    if (loadedSprites >= totalSprites) {
                        spritesLoaded = true;
                    }
                };
                img.src = dataURI;
            }
        }

        // Create procedural tiles like Python version
        let tile_grass, tile_cobble, tile_wall;

        function createTiles() {
            const tile = 32;

            // Create grass tile
            tile_grass = document.createElement('canvas');
            tile_grass.width = tile;
            tile_grass.height = tile;
            const grassCtx = tile_grass.getContext('2d');
            grassCtx.fillStyle = '#167816'; // Dark green base
            grassCtx.fillRect(0, 0, tile, tile);

            // Add grass texture
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * tile;
                const y = Math.random() * tile;
                const brightness = 22 + Math.random() * 40; // 22-62 range
                grassCtx.fillStyle = `rgb(${brightness}, ${120 + Math.random() * 40}, ${brightness})`;
                grassCtx.fillRect(x, y, 1, 1);
            }

            // Create cobble tile
            tile_cobble = document.createElement('canvas');
            tile_cobble.width = tile;
            tile_cobble.height = tile;
            const cobbleCtx = tile_cobble.getContext('2d');
            cobbleCtx.fillStyle = '#6e6e6e'; // Grey base
            cobbleCtx.fillRect(0, 0, tile, tile);

            // Add cobble texture (stones)
            for (let i = 0; i < 8; i++) {
                const cx = Math.random() * tile;
                const cy = Math.random() * tile;
                const r = 3 + Math.random() * 4;
                cobbleCtx.fillStyle = '#969696'; // Light grey
                cobbleCtx.beginPath();
                cobbleCtx.ellipse(cx, cy, r, r * 0.8, 0, 0, Math.PI * 2);
                cobbleCtx.fill();
                cobbleCtx.strokeStyle = '#505050'; // Dark grey outline
                cobbleCtx.stroke();
            }

            // Create fallback wall tile if sprite fails to load
            tile_wall = document.createElement('canvas');
            tile_wall.width = tile;
            tile_wall.height = tile;
            const wallCtx = tile_wall.getContext('2d');

            // Stone wall base
            wallCtx.fillStyle = '#666666';
            wallCtx.fillRect(0, 0, tile, tile);

            // Add stone blocks
            for (let x = 0; x < tile; x += 8) {
                for (let y = 0; y < tile; y += 8) {
                    wallCtx.fillStyle = '#777777';
                    wallCtx.fillRect(x, y, 8, 8);
                    wallCtx.strokeStyle = '#555555';
                    wallCtx.strokeRect(x, y, 8, 8);
                }
            }

            // Add mortar lines
            wallCtx.strokeStyle = '#444444';
            for (let i = 8; i < tile; i += 8) {
                wallCtx.beginPath();
                wallCtx.moveTo(0, i);
                wallCtx.lineTo(tile, i);
                wallCtx.stroke();
                wallCtx.beginPath();
                wallCtx.moveTo(i, 0);
                wallCtx.lineTo(i, tile);
                wallCtx.stroke();
            }
        }

        // Sprite drawing helper
        function drawSprite(spriteKey, x, y, size = 32) {
            // Check loaded sprites first
            if (sprites[spriteKey]) {
                const sprite = sprites[spriteKey];
                // Scale sprite to specified size and center it
                ctx.drawImage(sprite, x - size/2, y - size/2, size, size);
                return true;
            }
            // Check procedural tiles
            let tileCanvas = null;
            if (spriteKey === 'tile_wall' && tile_wall) {
                tileCanvas = tile_wall;
            }
            if (tileCanvas) {
                // Draw procedural tiles at top-left like grass/cobble, not centered
                ctx.drawImage(tileCanvas, x, y, size, size);
                return true;
            }
            return false;
        }

        // Draw procedural tiles directly
        function drawGrassTile(x, y, size = 32) {
            if (tile_grass) {
                ctx.drawImage(tile_grass, x, y, size, size);
                return true;
            }
            return false;
        }

        function drawCobbleTile(x, y, size = 32) {
            if (tile_cobble) {
                ctx.drawImage(tile_cobble, x, y, size, size);
                return true;
            }
            return false;
        }

        // Try to draw sprite, fallback to function if not available
        function tryDrawSprite(spriteKey, x, y, size = 32, fallbackFunc = null) {
            if (drawSprite(spriteKey, x, y, size)) {
                return true;
            } else if (fallbackFunc) {
                fallbackFunc(x, y);
                return false;
            }
            return false;
        }

        function handleKeyDown(event) {
            // Handle inventory navigation directly when inventory is open
            if (window.game && window.game.inventory_open) {
                if (event.code === 'ArrowLeft' || event.code === 'ArrowUp') {
                    if (window.game.player && window.game.player.inventory.length > 0) {
                        window.game.inventory_cursor = Math.max(0, window.game.inventory_cursor - 1);
                    }
                    event.preventDefault();
                    return;
                } else if (event.code === 'ArrowRight' || event.code === 'ArrowDown') {
                    if (window.game.player && window.game.player.inventory.length > 0) {
                        window.game.inventory_cursor = Math.min(window.game.player.inventory.length - 1, window.game.inventory_cursor + 1);
                    }
                    event.preventDefault();
                    return;
                } else if (event.code === 'Enter') {
                    if (window.game.player && window.game.player.inventory.length > 0) {
                        window.game.use_inventory_item(window.game.inventory_cursor);
                    }
                    event.preventDefault();
                    return;
                } else if (event.code === 'KeyD') {
                    if (window.game.player && window.game.player.inventory.length > 0) {
                        window.game.drop_inventory_item(window.game.inventory_cursor);
                    }
                    event.preventDefault();
                    return;
                } else if (event.code === 'Escape' || event.code === 'Tab') {
                    window.game.inventory_open = false;
                    event.preventDefault();
                    return;
                }
            }

            keysPressed[event.code] = true;
            if (event.code === 'Space') {
                keysPressed[' '] = true;
            }
            event.preventDefault();
        }

        function handleKeyUp(event) {
            delete keysPressed[event.code];
            if (event.code === 'Space') {
                delete keysPressed[' '];
            }
            event.preventDefault();
        }

        // Touch control setup: buttons + swipe gesture for movement
        function setupTouchControls() {
            // --- Button handlers ---
            document.querySelectorAll('[data-key]').forEach(function(btn) {
                var keyCode = btn.dataset.key;

                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    btn.classList.add('pressed');

                    // Handle inventory actions directly (inventory is managed in handleKeyDown, not keysPressed)
                    if (window.game && window.game.inventory_open) {
                        if ((keyCode === 'ArrowLeft' || keyCode === 'ArrowUp') && window.game.player && window.game.player.inventory.length > 0) {
                            window.game.inventory_cursor = Math.max(0, window.game.inventory_cursor - 1);
                            return;
                        } else if ((keyCode === 'ArrowRight' || keyCode === 'ArrowDown') && window.game.player && window.game.player.inventory.length > 0) {
                            window.game.inventory_cursor = Math.min(window.game.player.inventory.length - 1, window.game.inventory_cursor + 1);
                            return;
                        } else if (keyCode === 'Enter' && window.game.player && window.game.player.inventory.length > 0) {
                            window.game.use_inventory_item(window.game.inventory_cursor);
                            return;
                        } else if (keyCode === 'KeyD' && window.game.player && window.game.player.inventory.length > 0) {
                            window.game.drop_inventory_item(window.game.inventory_cursor);
                            return;
                        } else if (keyCode === 'Escape') {
                            window.game.inventory_open = false;
                            return;
                        }
                    }

                    keysPressed[keyCode] = true;
                    if (keyCode === 'Space') {
                        keysPressed[' '] = true;
                    }
                }, {passive: false});

                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    btn.classList.remove('pressed');
                }, {passive: false});

                btn.addEventListener('touchcancel', function(e) {
                    btn.classList.remove('pressed');
                });
            });

            // --- Swipe/drag gesture on canvas for movement ---
            var canvasEl = document.getElementById('gameCanvas');
            var touchStartX = 0;
            var touchStartY = 0;
            var dragActive = false;
            var DRAG_THRESHOLD = 10; // px before drag activates

            function clearMovementKeys() {
                delete keysPressed['ArrowUp'];
                delete keysPressed['ArrowDown'];
                delete keysPressed['ArrowLeft'];
                delete keysPressed['ArrowRight'];
            }

            canvasEl.addEventListener('touchstart', function(e) {
                e.preventDefault();
                var t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                dragActive = false;
                clearMovementKeys();
            }, {passive: false});

            canvasEl.addEventListener('touchmove', function(e) {
                e.preventDefault();
                var t = e.touches[0];
                var dx = t.clientX - touchStartX;
                var dy = t.clientY - touchStartY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < DRAG_THRESHOLD) return;
                dragActive = true;

                // Determine primary direction from drag vector
                clearMovementKeys();
                if (Math.abs(dx) > Math.abs(dy)) {
                    keysPressed[dx > 0 ? 'ArrowRight' : 'ArrowLeft'] = true;
                } else {
                    keysPressed[dy > 0 ? 'ArrowDown' : 'ArrowUp'] = true;
                }
            }, {passive: false});

            canvasEl.addEventListener('touchend', function(e) {
                e.preventDefault();
                clearMovementKeys();
                dragActive = false;
            }, {passive: false});

            canvasEl.addEventListener('touchcancel', function(e) {
                clearMovementKeys();
                dragActive = false;
            });
        }

        // State-aware touch UI: show/hide button groups based on game state
        function updateTouchUI() {
            if (!isMobile || !window.game) return;

            var state = window.game.state;
            var invOpen = window.game.inventory_open;

            var groups = {
                'touchMenu': state === GameState.MENU,
                'touchDifficulty': state === GameState.DIFFICULTY_SELECT,
                'touchCharacter': state === GameState.CHARACTER_SELECT,
                'touchAction': state === GameState.PLAYING && !invOpen,
                'touchShop': state === GameState.SHOP,
                'touchInventory': (state === GameState.PLAYING && invOpen),
                'touchPaused': state === GameState.PAUSED,
                'touchHelp': state === GameState.HELP || state === GameState.MONSTER_INFO,
                'touchGameOver': state === GameState.GAME_OVER,
                'touchLevelSelect': state === GameState.LEVEL_SELECT
            };

            for (var id in groups) {
                var el = document.getElementById(id);
                if (el) {
                    if (groups[id]) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            }
        }

        // Seeded random number generator for deterministic level generation
        class SeededRandom {
            constructor(seed) {
                this.seed = seed;
            }

            random() {
                // Simple seeded random using sine function
                let x = Math.sin(this.seed++) * 10000;
                return x - Math.floor(x);
            }

            randint(min, max) {
                return Math.floor(this.random() * (max - min + 1)) + min;
            }
        }

            update_game_over() {
                if (keysPressed['KeyR']) {
                    this.reset_game();
                    delete keysPressed['KeyR'];
                }
            }

            run() {
                const gameLoop = (timestamp) => {
                    const dt = (timestamp - lastTime) / 1000;
                    lastTime = timestamp;

                    this.update(dt);
                    this.render();

                    requestAnimationFrame(gameLoop);
                };
                requestAnimationFrame(gameLoop);
            }

            update(dt) {
                if (this.state == GameState.MENU) {
                    this.update_menu();
                } else if (this.state == GameState.DIFFICULTY_SELECT) {
                    this.update_difficulty_select();
                } else if (this.state == GameState.CHARACTER_SELECT) {
                    this.update_character_select();
                } else if (this.state == GameState.PLAYING) {
                    this.update_playing(dt);
                } else if (this.state == GameState.SHOP) {
                    this.update_shop(dt);
                } else if (this.state == GameState.PAUSED) {
                    this.update_paused(dt);
                } else if (this.state == GameState.HELP) {
                    this.update_help();
                } else if (this.state == GameState.MONSTER_INFO) {
                    // Simple ESC handling for monster info
                    if (keysPressed['Escape']) {
                        this.state = this.help_previous_state || GameState.PLAYING;
                        this.help_previous_state = null;
                        delete keysPressed['Escape'];
                    }
                } else if (this.state == GameState.LEVEL_SELECT) {
                    this.update_level_select();
                } else if (this.state == GameState.GAME_OVER) {
                    this.update_game_over();
                }
            }

            render_game_over() {
                ctx.fillStyle = RED;
                ctx.font = '32px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", SCREEN_WIDTH/2, 150);

                ctx.fillStyle = WHITE;
                ctx.font = '24px Courier New';
                ctx.fillText("Press R to Restart", SCREEN_WIDTH/2, 250);
            }

            render() {
                updateTouchUI();
                try {
                    if (!ctx) {
                        console.error('Canvas context is null!');
                        return;
                    }

                    ctx.fillStyle = 'black';
                    ctx.fillRect(0, 0, 480, 800);

                    if (this.state == GameState.MENU) {
                        this.render_menu();
                    } else if (this.state == GameState.DIFFICULTY_SELECT) {
                        this.render_difficulty_select();
                    } else if (this.state == GameState.CHARACTER_SELECT) {
                        this.render_character_select();
                    } else if (this.state == GameState.PLAYING) {
                        this.render_playing();
                    } else if (this.state == GameState.SHOP) {
                        this.render_shop();
                    } else if (this.state == GameState.PAUSED) {
                        this.render_paused();
                    } else if (this.state == GameState.HELP) {
                        this.render_help();
                    } else if (this.state == GameState.MONSTER_INFO) {
                        this.render_monster_info();
                } else if (this.state == GameState.LEVEL_SELECT) {
                        this.render_level_select();
                    } else if (this.state == GameState.GAME_OVER) {
                        this.render_game_over();
                    }
                } catch (e) {
                    console.error('Render error:', e);
                    // Fallback: try basic canvas operations
                    try {
                        if (ctx) {
                            ctx.fillStyle = 'red';
                            ctx.fillRect(0, 0, 480, 800);
                        }
                    } catch (e2) {
                        console.error('Even fallback failed:', e2);
                    }
                }
            }

            add_ui_message(text) {
                this.ui_messages.push([text, Date.now() / 1000]);
                if (this.ui_messages.length > 6) {
                    this.ui_messages = this.ui_messages.slice(-6);
                }
            }

            update_menu() {
                if (keysPressed['Enter']) {
                    this.state = GameState.DIFFICULTY_SELECT;
                    delete keysPressed['Enter'];
                }
                if (keysPressed['KeyL']) {
                    this.load_game();
                    delete keysPressed['KeyL'];
                }
                if (keysPressed['KeyS']) {
                    this.state = GameState.LEVEL_SELECT;
                    this.selected_level = 1;
                    delete keysPressed['KeyS'];
                }
            }

            render_menu() {
                ctx.fillStyle = YELLOW;
                ctx.font = '32px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("JMR's GAUNTLET", SCREEN_WIDTH/2, 80);

                ctx.fillStyle = GREEN;
                ctx.font = '24px Courier New';
                ctx.fillText("The Third Encounter", SCREEN_WIDTH/2, 140);

                ctx.fillStyle = WHITE;
                ctx.font = '18px Courier New';
                ctx.fillText("ENTER: Start New Game", SCREEN_WIDTH/2, 240);
                ctx.fillText("L: Load Saved Game", SCREEN_WIDTH/2, 280);
                ctx.fillText("S: Level Select", SCREEN_WIDTH/2, 320);
            }

            update_character_select() {
                if (keysPressed['ArrowUp']) {
                    this.selected_character_index = (this.selected_character_index - 1 + this.character_keys.length) % this.character_keys.length;
                    delete keysPressed['ArrowUp'];
                } else if (keysPressed['ArrowDown']) {
                    this.selected_character_index = (this.selected_character_index + 1) % this.character_keys.length;
                    delete keysPressed['ArrowDown'];
                } else if (keysPressed['Enter']) {
                    let selected_class = this.character_keys[this.selected_character_index];
                    this.start_game(selected_class);
                    delete keysPressed['Enter'];
                }
            }

            render_character_select() {
                ctx.fillStyle = YELLOW;
                ctx.font = '32px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("Select Character", SCREEN_WIDTH/2, 50);

                let y_pos = 96;
                for (let i = 0; i < this.character_keys.length; i++) {
                    let key = this.character_keys[i];
                    let char_class = CHARACTER_CLASSES[key];
                    let color = i == this.selected_character_index ? GREEN : WHITE;
                    let arrow = i == this.selected_character_index ? ">" : " ";

                    let char_text = `${arrow} ${char_class.name}`;
                    let stats_text = `   Spd:${char_class.speed} Str:${char_class.strength} Msl:${char_class.missiles}`;

                    ctx.fillStyle = color;
                    ctx.font = '24px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText(char_text, 90, y_pos);

                    ctx.fillStyle = GRAY;
                    ctx.font = '18px Courier New';
                    ctx.fillText(stats_text, 90, y_pos + 20);

                    // Draw character sprite next to the name
                    // Map character class keys to sprite keys (some have different capitalization)
                    let spriteKey = key;
                    if (key === 'wizard') spriteKey = 'Wizard';
                    // Add other mappings here if needed

                    tryDrawSprite(spriteKey, 60, y_pos - 0, 32);

                    y_pos += 42;
                }

                // Instructions
                ctx.fillStyle = WHITE;
                ctx.font = '18px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("UP/DOWN: Navigate", SCREEN_WIDTH/2, GAME_HEIGHT - 44);
                ctx.fillText("ENTER: Select", SCREEN_WIDTH/2, GAME_HEIGHT - 24);
            }

            start_game(character_class) {
                this.player = new Player(character_class, 1);
                this.player.game = this;
                this.state = GameState.PLAYING;
                this.load_level(1);
            }

            update_playing(dt) {
                // Don't update player movement when inventory is open (like Python version)
                if (this.inventory_open) {
                    return;
                }

                if (this.player) {
                    // Store old position for collision resolution
                    let old_x = this.player.x;
                    let old_y = this.player.y;

                    // Update player (movement)
                    this.player.update(dt, keysPressed);

                    // Get new position after movement
                    let new_x = this.player.x;
                    let new_y = this.player.y;

                    // Resolve collisions per-axis to prevent corner sticking and wall clipping
                    if (this.check_wall_collision(new_x, new_y)) {
                        // Try allowing X movement only (only if X actually changed)
                        if (new_x !== old_x && !this.check_wall_collision(new_x, old_y)) {
                            this.player.y = old_y;
                        }
                        // Else try allowing Y movement only (only if Y actually changed)
                        else if (new_y !== old_y && !this.check_wall_collision(old_x, new_y)) {
                            this.player.x = old_x;
                        }
                        else {
                            // Neither axis is free; try smaller movements to avoid getting stuck
                            let resolved = false;

                            // Try reducing movement by half in each direction
                            let mid_x = (old_x + new_x) / 2;
                            let mid_y = (old_y + new_y) / 2;

                            if (!this.check_wall_collision(mid_x, mid_y)) {
                                this.player.x = mid_x;
                                this.player.y = mid_y;
                                resolved = true;
                            }
                            // Try X only with smaller step
                            else if (new_x !== old_x && !this.check_wall_collision(mid_x, old_y)) {
                                this.player.x = mid_x;
                                this.player.y = old_y;
                                resolved = true;
                            }
                            // Try Y only with smaller step
                            else if (new_y !== old_y && !this.check_wall_collision(old_x, mid_y)) {
                                this.player.x = old_x;
                                this.player.y = mid_y;
                                resolved = true;
                            }

                            // If still stuck, revert to old position
                            if (!resolved) {
                                this.player.x = old_x;
                                this.player.y = old_y;
                            }
                        }
                    }

                    // Camera follows player
                    this.camera_x = Math.max(0, Math.min(WORLD_WIDTH - GAME_WIDTH, this.player.x - GAME_WIDTH / 2));
                    this.camera_y = Math.max(0, Math.min(WORLD_HEIGHT - GAME_HEIGHT, this.player.y - GAME_HEIGHT / 2));
                }

                // Update enemies
                for (let enemy of this.enemies) {
                    enemy.update(dt);
                }

                // Update items
                for (let item of this.items) {
                    item.update(dt);
                }

                // Update projectiles
                this.update_projectiles(dt);

                // Handle player input and collisions
                if (this.player) {
                    // Check item collisions
                    this.check_item_collisions();

                    // Check enemy collisions
                    this.check_enemy_collisions();

                    // Check terminal collisions (shop)
                    this.check_terminal_collisions(dt);

                    // Door collisions handled in check_wall_collision for blocking movement

                    // Check hazard collisions (spikes, poison, etc.)
                    this.check_hazard_collisions(dt);
                }

                // Check for level completion - all keys collected and doors opened
                if (this.doors.length == 0 && this.keys_needed.length == 0) {
                    this.complete_level();
                }

                // Check for stuck player and rescue them
                if (this.player) {
                    this.check_stuck_player();
                }

                // Life drain over time
                if (this.player) {
                    this.player.life -= dt * LIFE_DRAIN_RATE;
                }

                // Handle inventory
                if (keysPressed['Tab'] || keysPressed['KeyI']) {
                    this.inventory_open = !this.inventory_open;
                    // Clear all keys when opening/closing inventory to prevent stuck keys
                    Object.keys(keysPressed).forEach(key => delete keysPressed[key]);
                    return; // Don't process other inputs when toggling inventory
                }

                // Inventory input is handled directly in handleKeyDown when inventory is open


                // Handle pause
                if (keysPressed['KeyP']) {
                    this.state = GameState.PAUSED;
                    delete keysPressed['KeyP'];
                }

                // Update melee cooldown
                if (this.melee_cooldown > 0) {
                    this.melee_cooldown = Math.max(0, this.melee_cooldown - dt);
                }

                // Check collisions FIRST (including terminal for shop interaction)
                this.check_item_collisions();
                this.check_enemy_collisions();
                this.check_terminal_collisions(dt);
                this.check_hazard_collisions(dt);

                // SPACE key handling is done in check_terminal_collisions()
                // If space key still exists after terminal check, it means no terminal interaction occurred

                // Handle help screen
                if (keysPressed['KeyH']) {
                    this.help_previous_state = this.state;  // Remember where we came from
                    this.state = GameState.HELP;
                    this.help_entered_this_frame = true;
                    this.help_ignore_h_until_release = true;  // Ignore H until released
                    delete keysPressed['KeyH'];
                }

                // Handle monster info screen
                if (keysPressed['KeyM']) {
                    this.help_previous_state = this.state;  // Remember where we came from
                    this.state = GameState.MONSTER_INFO;
                    delete keysPressed['KeyM'];
                }

                // Handle quit game with confirmation
                if (keysPressed['KeyQ']) {
                    if (!this.quit_confirmation_shown) {
                        this.quit_confirmation_shown = true;
                        this.add_ui_message("Press Q again to QUIT, or any other key to cancel");
                    } else {
                        // Second Q press - actually quit
                        this.state = GameState.MENU;
                        this.quit_confirmation_shown = false;
                        this.add_ui_message("Returned to main menu");
                    }
                    delete keysPressed['KeyQ'];
                } else if (this.quit_confirmation_shown) {
                    // Any other key cancels quit confirmation
                    this.quit_confirmation_shown = false;
                    this.add_ui_message("Quit cancelled");
                }

                // Handle save/load game
                if (keysPressed['KeyS']) {
                    this.save_game();
                    delete keysPressed['KeyS'];
                }
                if (keysPressed['KeyL']) {
                    this.load_game();
                    delete keysPressed['KeyL'];
                }

                // Handle character switching (DISABLED - causes freezing)
                // C key functionality temporarily disabled due to freezing bug
                /*
                if (keysPressed['KeyC']) {
                    try {
                        this.switch_character();
                    } catch (error) {
                        console.error('Character switching failed:', error);
                        this.add_ui_message('Character switching failed!');
                    }
                    delete keysPressed['KeyC'];
                }
                */

                // Update cooldowns
                if (this.melee_cooldown > 0) {
                    this.melee_cooldown -= dt;
                    if (this.melee_cooldown < 0) this.melee_cooldown = 0;
                }
                if (this.shot_cooldown > 0) {
                    this.shot_cooldown -= dt;
                    if (this.shot_cooldown < 0) this.shot_cooldown = 0;
                }

                // Update status effects
                for (let effect in this.status_effects) {
                    // Revive is a counter, not a timer - don't decrement it
                    if (effect !== 'revive' && this.status_effects[effect] > 0) {
                        this.status_effects[effect] -= dt;
                        if (this.status_effects[effect] < 0) {
                            this.status_effects[effect] = 0;
                        }
                    }
                }
                if (this.farsee_timer > 0) {
                    this.farsee_timer -= dt;
                    if (this.farsee_timer < 0) {
                        this.farsee_timer = 0;
                    }
                }

                // Update slime slow effect
                if (this.player_slow_timer > 0) {
                    this.player_slow_timer -= dt;
                    if (this.player_slow_timer < 0) this.player_slow_timer = 0;
                }

                // Apply status effects to player
                if (this.player) {
                    // Reset to base stats
                    this.player.speed = this.player.character_class.speed / 10;
                    this.player.strength = this.player.character_class.strength;
                    this.player.missiles = this.player.character_class.missiles;

                    // Apply active effects
                    if (this.status_effects['speed'] > 0) {
                        this.player.speed *= 1.5; // 50% speed boost
                    }
                    if (this.status_effects['strength'] > 0) {
                        this.player.strength = Math.floor(this.player.strength * 1.5); // 50% strength boost
                    }
                    if (this.status_effects['missiles'] > 0) {
                        this.player.missiles += 2; // +2 missiles
                    }
                }

                // Note: Life drain is handled earlier in the update loop

                // Unified death check - revive works for any cause of death
                if (this.player && this.player.life <= 0) {
                    // Check for revive potion (gives one extra life)
                    if (this.status_effects['revive'] > 0) {
                        this.status_effects['revive'] -= 1; // Use one revive charge
                        this.player.life = this.player.max_life * REVIVE_VALUE;

                        // Respawn at starting position
                        this.player.x = 400; // Center of starting room
                        this.player.y = 300;

                        // Clear any ongoing hazards/damage
                        this.camera_x = 0;
                        this.camera_y = 0;

                        this.add_ui_message("Revived!");
                    } else {
                        this.sound_manager.play_death();
                        this.state = GameState.GAME_OVER;
                    }
                }
            }

            render_playing() {
                // Clear screen
                ctx.fillStyle = BLACK;
                ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

                // Draw grass everywhere first - tile-based like Python
                for (let x = this.camera_x - (this.camera_x % 32); x < this.camera_x + GAME_WIDTH + 32; x += 32) {
                    for (let y = this.camera_y - (this.camera_y % 32); y < this.camera_y + GAME_HEIGHT + 32; y += 32) {
                        let sx = x - this.camera_x;
                        let sy = y - this.camera_y;
                        if (-32 <= sx && sx < GAME_WIDTH && -32 <= sy && sy < GAME_HEIGHT) {
                            drawGrassTile(sx, sy, 32);
                        }
                    }
                }

                // Draw grey cobble floor inside rooms only
                if (this.rooms) {
                    for (let [rx, ry, rw, rh] of this.rooms) {
                        for (let x = rx; x < rx + rw; x += 32) {
                            for (let y = ry; y < ry + rh; y += 32) {
                                let sx = x - this.camera_x;
                                let sy = y - this.camera_y;
                                if (-32 <= sx && sx < GAME_WIDTH && -32 <= sy && sy < GAME_HEIGHT) {
                                    drawCobbleTile(sx, sy, 32);
                                }
                            }
                        }
                    }
                }

                // Draw walls
                for (let [wall_x, wall_y] of this.walls) {
                    let sx = wall_x - this.camera_x;
                    let sy = wall_y - this.camera_y;
                    if (-32 <= sx && sx < GAME_WIDTH && -32 <= sy && sy < GAME_HEIGHT) {
                        drawSprite('tile_wall', sx + 16, sy + 16, 32);
                    }
                }

                // Draw doors
                for (let [door_x, door_y] of this.doors) {
                    let sx = door_x - this.camera_x;
                    let sy = door_y - this.camera_y;
                    if (-32 <= sx && sx < GAME_WIDTH && -32 <= sy && sy < GAME_HEIGHT) {
                        ctx.fillStyle = '#4a2c0a';
                        ctx.fillRect(sx, sy, 32, 16);
                        // Bars
                        ctx.fillStyle = '#888888';
                        for (let bx = 6; bx <= 26; bx += 10) {
                            ctx.fillRect(sx + bx - 1, sy + 1, 2, 14);
                        }
                    }
                }

                // Draw terminals
                for (let [tx, ty] of this.terminals) {
                    let sx = tx - this.camera_x;
                    let sy = ty - this.camera_y;
                    if (-16 <= sx && sx < GAME_WIDTH + 16 && -16 <= sy && sy < GAME_HEIGHT + 16) {
                        // Try to draw terminal sprite first
                        if (!tryDrawSprite('terminal', sx, sy, 32)) {
                            // Fallback: draw colored rectangles if sprite not available
                            ctx.fillStyle = CYAN;
                            ctx.fillRect(sx - 16, sy - 16, 32, 32);
                            // Computer screen effect
                            ctx.fillStyle = GREEN;
                            ctx.fillRect(sx - 12, sy - 12, 24, 24);
                            ctx.fillStyle = CYAN;
                        }
                    }
                }

                // Draw hazards
                for (let [hx, hy, htype, phase] of this.hazards) {
                    let sx = hx - this.camera_x;
                    let sy = hy - this.camera_y;
                    if (sx >= 0 && sx < GAME_WIDTH && sy >= 0 && sy < GAME_HEIGHT) {
                        this._draw_hazard(sx, sy, htype, phase);
                    }
                }

                // Draw player
                if (this.player) {
                    let px = this.player.x - this.camera_x;
                    let py = this.player.y - this.camera_y;
                    if (-16 <= px && px < GAME_WIDTH && -16 <= py && py < GAME_HEIGHT) {
                        this._draw_player(px, py);
                    }
                }

                // Draw enemies
                for (let enemy of this.enemies) {
                    let ex = enemy.x - this.camera_x;
                    let ey = enemy.y - this.camera_y;
                    if (-20 <= ex && ex < GAME_WIDTH && -20 <= ey && ey < GAME_HEIGHT) {
                        this._draw_enemy(enemy, ex, ey);
                    }
                }

                // Draw projectiles
                for (let projectile of this.projectiles) {
                    let px = projectile.x - this.camera_x;
                    let py = projectile.y - this.camera_y;
                    if (px >= 0 && px < GAME_WIDTH && py >= 0 && py < GAME_HEIGHT) {
                        ctx.fillStyle = '#FFFF80';
                        ctx.beginPath();
                        ctx.arc(px, py, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }

                // Draw items
                for (let item of this.items) {
                    if (!item.collected) {
                        let ix = item.x - this.camera_x;
                        let iy = item.y - this.camera_y;
                        if (ix >= 0 && ix < GAME_WIDTH && iy >= 0 && iy < GAME_HEIGHT) {
                            this._draw_item(item, ix, iy);
                        }
                    }
                }

                // Draw HUD
                this.render_ui();

                // Draw inventory if open
                if (this.inventory_open) {
                    this.render_inventory();
                }

                // Draw farsee minimap if active
                if (this.farsee_timer > 0) {
                    this.render_farsee_minimap();
                }
            }

            _draw_player(x, y) {
                const cls_name = this.player.character_class.name.toLowerCase();
                let bob = 0;
                if (this.player.anim_frame == 1) {
                    bob = -3;
                }

                // Try to use loaded sprites first
                let sprite_key = null;
                if (cls_name.includes('wizard')) {
                    sprite_key = 'Wizard'; // Capital W matches embedded_sprites.js
                } else if (cls_name.includes('gunfighter')) {
                    sprite_key = 'gunfighter';
                } else if (cls_name.includes('valkyrie')) {
                    sprite_key = 'valkyrie';
                } else if (cls_name.includes('android')) {
                    sprite_key = 'android';
                } else if (cls_name.includes('pirate')) {
                    sprite_key = 'pirate';
                } else if (cls_name.includes('punk')) {
                    sprite_key = 'punkrocker';
                } else if (cls_name.includes('nerd')) {
                    sprite_key = 'nerd';
                } else {
                    sprite_key = 'samurai';
                }

                // Show attack frame briefly after firing/melee
                if ((this.player.attack_anim_timer || 0) > 0 && sprites[sprite_key + '_attack']) {
                    sprite_key = sprite_key + '_attack';
                }

                // Sprite-first; fall back to procedural shapes only if image missing
                if (!tryDrawSprite(sprite_key, x, y + bob, 32)) {
                    this._draw_character_fallback(x, y + bob, cls_name);
                }

                // Direction indicator
                ctx.fillStyle = RED;
                let indicatorX = x, indicatorY = y;
                switch (this.player.direction) {
                    case Direction.UP: indicatorY -= 12; break;
                    case Direction.DOWN: indicatorY += 12; break;
                    case Direction.LEFT: indicatorX -= 12; break;
                    case Direction.RIGHT: indicatorX += 12; break;
                }
                ctx.fillRect(indicatorX - 2, indicatorY - 2, 4, 4);
            }

            _draw_character_fallback(x, y, cls_name) {
                let bob = 0; // No animation bob for fallbacks
                if (cls_name.includes('wizard')) {
                    // Blue robe with pointy hat
                    ctx.fillStyle = '#325082';
                    ctx.fillRect(x - 5, y - 5, 10, 10);
                    // Pointy hat
                    ctx.fillStyle = '#325082';
                    ctx.beginPath();
                    ctx.moveTo(x - 3, y - 8);
                    ctx.lineTo(x + 3, y - 8);
                    ctx.lineTo(x, y - 14);
                    ctx.closePath();
                    ctx.fill();
                    // Staff
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x + 3, y - 6, 2, 12);
                } else if (cls_name.includes('valkyrie')) {
                    ctx.fillStyle = '#C0C8D0';
                    ctx.fillRect(x - 5, y - 5, 10, 10);
                    // Winged helmet
                    ctx.fillStyle = '#E0E0E0';
                    ctx.beginPath();
                    ctx.arc(x, y - 5, 6, 0, Math.PI, false);
                    ctx.fill();
                    // Shield
                    ctx.fillStyle = '#C0C0C0';
                    ctx.beginPath();
                    ctx.arc(x - 4, y, 3, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (cls_name.includes('samurai')) {
                    ctx.fillStyle = '#800000';
                    ctx.fillRect(x - 5, y - 5, 10, 10);
                    // Topknot
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(x, y - 7, 2, 0, 2 * Math.PI);
                    ctx.fill();
                    // Katana
                    ctx.fillStyle = '#F0F0F0';
                    ctx.fillRect(x + 3, y - 6, 1, 12);
                } else if (cls_name.includes('pirate')) {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x - 5, y - 5, 10, 10);
                    // Pirate hat
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(x - 4, y - 8, 8, 2);
                    ctx.fillRect(x - 3, y - 6, 6, 4);
                    // Eye patch
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(x - 2, y - 1, 1, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (cls_name.includes('punk')) {
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(x - 5, y - 5, 10, 10);
                    // Mohawk
                    ctx.fillStyle = '#FF1493';
                    ctx.fillRect(x - 1, y - 9, 2, 4);
                } else if (cls_name.includes('android')) {
                    ctx.fillStyle = '#C0C0C0';
                    ctx.fillRect(x - 5, y - 5, 10, 10);
                    // Robot eyes
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(x - 2, y - 1, 1, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 2, y - 1, 1, 0, 2 * Math.PI);
                    ctx.fill();
                } else {
                    // Default character
                    ctx.fillStyle = '#FFFF00';
                    ctx.fillRect(x - 6, y - 6, 12, 12);
                }

                // Bright outline for all
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - 6, y - 6, 12, 12);
            }

            _draw_enemy(enemy, x, y) {
                let sprite_key = null;
                let wobble = 0;

                // Map enemy types to loaded sprites
                if (enemy.type == EnemyType.SLIME) {
                    sprite_key = 'slime';
                    wobble = 2 * Math.sin(enemy.anim_t * 6.0);
                } else if (enemy.type == EnemyType.SPIDER) {
                    sprite_key = 'enemy_spider';
                } else if (enemy.type == EnemyType.GHOST) {
                    sprite_key = 'enemy_ghost';
                } else if (enemy.type == EnemyType.FROG) {
                    sprite_key = 'slime'; // Use slime sprite for frog
                } else if (enemy.type == EnemyType.SCORPION) {
                    sprite_key = 'enemy_scorpion';
                } else if (enemy.type == EnemyType.SKELETON) {
                    sprite_key = 'enemy_skeleton';
                } else if (enemy.type == EnemyType.DEMON2) {
                    sprite_key = 'enemy_demon2';
                } else if (enemy.type == EnemyType.ORGE) {
                    sprite_key = 'enemy_orge';
                } else if (enemy.type == EnemyType.CYCLOPS) {
                    sprite_key = 'enemy_cyclops';
                } else if (enemy.type == EnemyType.CHIMERA1) {
                    sprite_key = 'enemy_chimera1';
                } else if (enemy.type == EnemyType.CHIMERA2) {
                    sprite_key = 'enemy_chimera2';
                } else if (enemy.type == EnemyType.CHIMERA3) {
                    sprite_key = 'enemy_chimera3';
                }

                if (tryDrawSprite(sprite_key, x, y + wobble, 32, (ex, ey) => this._draw_enemy_fallback(enemy, ex, ey))) {
                    // Apply hit flash if enemy is hit
                    if (enemy.hit_timer > 0) {
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.fillRect(x - 16, y - 16 + wobble, 32, 32);
                        ctx.globalCompositeOperation = 'source-over';
                    }
                }
            }

            _draw_enemy_fallback(enemy, x, y) {
                if (enemy.type == EnemyType.SLIME || enemy.type == EnemyType.FROG) {
                    // Green blob that wobbles
                    let wobble = 2 * Math.sin(enemy.anim_t * 6.0);
                    ctx.fillStyle = '#209040';
                    ctx.beginPath();
                    ctx.ellipse(x, y + wobble, 12, 8, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#40C080';
                    ctx.beginPath();
                    ctx.ellipse(x, y + wobble, 8, 5, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x - 3, y - 2 + wobble, 2, 0, 2 * Math.PI);
                    ctx.arc(x + 3, y - 2 + wobble, 2, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(x - 3, y - 2 + wobble, 1, 0, 2 * Math.PI);
                    ctx.arc(x + 3, y - 2 + wobble, 1, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (enemy.type == EnemyType.GHOST) {
                    // Semi-transparent ghost with flickering
                    let alpha = 0.7 + 0.3 * Math.sin(enemy.anim_t * 8.0);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    // Ghost body
                    ctx.fillStyle = '#A0A0FF';
                    ctx.beginPath();
                    ctx.arc(x, y - 3, 10, 0, 2 * Math.PI);
                    ctx.fill();
                    // Wavy bottom
                    for (let i = 0; i < 3; i++) {
                        let wx = x - 8 + i * 8;
                        let wy = y + 7 + 2 * Math.sin(enemy.anim_t * 4 + i);
                        ctx.beginPath();
                        ctx.arc(wx, wy, 4, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    // Eyes
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(x - 3, y - 5, 2, 0, 2 * Math.PI);
                    ctx.arc(x + 3, y - 5, 2, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.restore();
                } else if (enemy.type == EnemyType.SCORPION || enemy.type == EnemyType.SPIDER) {
                    // Yellow/gold scorpion
                    ctx.fillStyle = '#DAA520';
                    // Body
                    ctx.beginPath();
                    ctx.ellipse(x, y, 8, 6, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    // Claws
                    ctx.beginPath();
                    ctx.arc(x - 5, y - 2, 3, 0, 2 * Math.PI);
                    ctx.arc(x + 5, y - 2, 3, 0, 2 * Math.PI);
                    ctx.fill();
                    // Tail with stinger
                    ctx.strokeStyle = '#DAA520';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.quadraticCurveTo(x - 4, y - 4, x - 6, y - 8);
                    ctx.quadraticCurveTo(x - 8, y - 12, x - 6, y - 16);
                    ctx.stroke();
                    // Stinger
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(x - 6, y - 16, 2, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (enemy.type == EnemyType.SKELETON) {
                    // White bony skeleton
                    ctx.fillStyle = '#F0F0F0';
                    // Skull
                    ctx.beginPath();
                    ctx.arc(x, y - 4, 6, 0, 2 * Math.PI);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(x - 2, y - 5, 1, 0, 2 * Math.PI);
                    ctx.arc(x + 2, y - 5, 1, 0, 2 * Math.PI);
                    ctx.fill();
                    // Ribcage
                    ctx.strokeStyle = '#F0F0F0';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(x - 4, y + i * 2);
                        ctx.lineTo(x + 4, y + i * 2);
                        ctx.stroke();
                    }
                } else {
                    // Default enemy - make it more visible
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(x - 8, y - 8, 16, 16);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x - 8, y - 8, 16, 16);
                }
            }

            _draw_item(item, x, y) {
                // Map item types to sprites
                let sprite_key = null;
                if (item.type == ItemType.FOOD) {
                    sprite_key = 'item_apple';
                } else if (item.type == ItemType.GOLD) {
                    sprite_key = 'item_gold';
                } else if (item.type == ItemType.KEY) {
                    sprite_key = 'item_key';
                } else if (item.type == ItemType.POTION_SPEED) {
                    sprite_key = 'item_potion_speed';
                } else if (item.type == ItemType.POTION_STRENGTH) {
                    sprite_key = 'item_potion_strength';
                } else if (item.type == ItemType.POTION_MISSILES) {
                    sprite_key = 'item_potion_missiles';
                } else if (item.type == ItemType.SCROLL_INVISIBILITY) {
                    sprite_key = 'item_scroll_invisibility';
                } else if (item.type == ItemType.SCROLL_FARSEE) {
                    sprite_key = 'item_scroll_farsee';
                } else if (item.type == ItemType.POTION_REVIVE) {
                    sprite_key = 'item_potion_revive';
                } else if (item.type == ItemType.SCROLL_BLAST) {
                    sprite_key = 'item_scroll_blast';
                }

                if (!tryDrawSprite(sprite_key, x, y, 24, (ix, iy) => this._draw_item_fallback(item, ix, iy))) {
                    // Simple fallback if no sprite and no fallback function
                    ctx.fillStyle = GOLD;
                    ctx.fillRect(ix - 4, iy - 4, 8, 8);
                }
            }

            _draw_item_fallback(item, x, y) {
                if (item.type == ItemType.KEY) {
                    ctx.fillStyle = GOLD;
                    ctx.fillRect(x - 8, y - 4, 16, 8);
                    ctx.fillRect(x + 6, y - 6, 4, 12);
                    ctx.fillRect(x + 8, y - 4, 8, 4);
                } else if (item.type == ItemType.FOOD) {
                    ctx.fillStyle = RED;
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = GREEN;
                    ctx.beginPath();
                    ctx.arc(x - 2, y - 4, 3, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (item.type == ItemType.GOLD) {
                    ctx.fillStyle = GOLD;
                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = YELLOW;
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (item.type == ItemType.POTION_SPEED || item.type == ItemType.POTION_STRENGTH || item.type == ItemType.POTION_MISSILES) {
                    ctx.fillStyle = GRAY;
                    ctx.fillRect(x - 4, y - 8, 8, 12);
                    ctx.fillStyle = WHITE;
                    ctx.beginPath();
                    ctx.arc(x, y - 6, 3, 0, 2 * Math.PI);
                    ctx.fill();
                } else {
                    // Default item
                    ctx.fillStyle = GOLD;
                    ctx.fillRect(x - 4, y - 4, 8, 8);
                }
            }

            _draw_hazard(x, y, htype, phase) {
                if (htype == HazardType.SPIKES) {
                    ctx.fillStyle = GRAY;
                    ctx.beginPath();
                    ctx.moveTo(x - 12, y + 8);
                    ctx.lineTo(x, y - 10);
                    ctx.lineTo(x + 12, y + 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = DARK_GRAY;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x - 12, y + 8);
                    ctx.lineTo(x + 12, y + 8);
                    ctx.stroke();
                } else if (htype == HazardType.RUNE) {
                    let color = '#5080FF';
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 12, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x - 7, y);
                    ctx.lineTo(x + 7, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y - 7);
                    ctx.lineTo(x, y + 7);
                    ctx.stroke();
                } else if (htype == HazardType.POISON) {
                    ctx.fillStyle = '#206040';
                    ctx.beginPath();
                    ctx.ellipse(x, y, 14, 9, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#40A080';
                    ctx.beginPath();
                    ctx.ellipse(x, y, 10, 6, 0, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            use_inventory_item(index) {
                if (index < 0 || index >= this.player.inventory.length) return;

                let item = this.player.inventory[index];
                let used = false;

                if (item.type === ItemType.POTION_SPEED) {
                    let multiplier = DIFFICULTY_MULTIPLIERS[this.difficulty]['potion'];
                    this.status_effects['speed'] = POTION_DURATION * multiplier;
                    this.add_ui_message("Used speed potion!");
                    used = true;
                } else if (item.type === ItemType.POTION_STRENGTH) {
                    let multiplier = DIFFICULTY_MULTIPLIERS[this.difficulty]['potion'];
                    this.status_effects['strength'] = POTION_DURATION * multiplier;
                    this.add_ui_message("Used strength potion!");
                    used = true;
                } else if (item.type === ItemType.POTION_MISSILES) {
                    let multiplier = DIFFICULTY_MULTIPLIERS[this.difficulty]['potion'];
                    this.status_effects['missiles'] = POTION_DURATION * multiplier;
                    this.add_ui_message("Used missiles potion!");
                    used = true;
                } else if (item.type === ItemType.SCROLL_INVISIBILITY) {
                    let multiplier = DIFFICULTY_MULTIPLIERS[this.difficulty]['potion'];
                    this.status_effects['invis'] = 15.0 * multiplier;
                    this.add_ui_message("Used invisibility scroll!");
                    used = true;
                } else if (item.type === ItemType.SCROLL_FARSEE) {
                    let multiplier = DIFFICULTY_MULTIPLIERS[this.difficulty]['potion'];
                    this.farsee_timer = 30.0 * multiplier;
                    this.add_ui_message("Used farsee scroll!");
                    used = true;
                } else if (item.type === ItemType.POTION_REVIVE) {
                    this.status_effects['revive'] = (this.status_effects['revive'] || 0) + 1;
                    this.add_ui_message("Used revive potion!");
                    used = true;
                } else if (item.type === ItemType.SCROLL_BLAST) {
                    // Find which room the player is currently in
                    let player_room = -1;
                    if (this.player) {
                        for (let i = 0; i < this.rooms.length; i++) {
                            let [rx, ry, rw, rh] = this.rooms[i];
                            if (this.player.x >= rx && this.player.x <= rx + rw &&
                                this.player.y >= ry && this.player.y <= ry + rh) {
                                player_room = i;
                                break;
                            }
                        }
                    }

                    let killed = 0;
                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        let enemy = this.enemies[i];
                        let enemy_room = -1;

                        // Find which room this enemy is in
                        for (let j = 0; j < this.rooms.length; j++) {
                            let [rx, ry, rw, rh] = this.rooms[j];
                            if (enemy.x >= rx && enemy.x <= rx + rw &&
                                enemy.y >= ry && enemy.y <= ry + rh) {
                                enemy_room = j;
                                break;
                            }
                        }

                        // Only damage enemies in the same room as the player
                        if (enemy_room === player_room) {
                            // Use massive damage to ensure death (like the original blast)
                            let split = enemy.take_damage(999);

                            if (enemy.life <= 0) {
                                // Remove the dead enemy (no splitting for blast damage)
                                this.enemies.splice(i, 1);
                                killed++;
                            }
                        }
                    }
                    if (killed > 0) {
                        this.score += ENEMY_KILL_SCORE * killed;
                        this.add_ui_message(`BLAST! Killed ${killed} enemies in this room!`);
                    } else {
                        this.add_ui_message("BLAST! No enemies to kill in this room.");
                    }
                    used = true;
                } else {
                    this.add_ui_message("Can't use this item!");
                }

                if (used) {
                    this.player.inventory.splice(index, 1);
                    if (this.inventory_cursor >= this.player.inventory.length) {
                        this.inventory_cursor = Math.max(0, this.player.inventory.length - 1);
                    }
                }
            }

            drop_inventory_item(index) {
                if (index < 0 || index >= this.player.inventory.length) return;

                let item = this.player.inventory[index];
                // Drop item at player's feet
                item.x = this.player.x;
                item.y = this.player.y;
                item.collected = false;
                this.items.push(item);

                this.player.inventory.splice(index, 1);
                if (this.inventory_cursor >= this.player.inventory.length) {
                    this.inventory_cursor = Math.max(0, this.player.inventory.length - 1);
                }

                this.add_ui_message("Dropped item");
            }

            render_inventory() {
                // Semi-transparent overlay in bottom area only (like Python version)
                let inv_w = SCREEN_WIDTH;
                let inv_h = 220;  // Increased height for more rows
                let x0 = 20;
                let y0 = GAME_HEIGHT + 10;  // Position higher in bottom area

                // Semi-transparent background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';  // Match Python's alpha 210/255 ≈ 0.82
                ctx.fillRect(x0, y0, inv_w, inv_h);

                // Title (smaller, high-contrast)
                ctx.fillStyle = YELLOW;
                ctx.font = '18px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText("INVENTORY(Enter=Use, D=Drop, ESC=Close)", x0 + 10, y0 + 22);

                // Slots grid - fixed 4 columns for better layout
                let slot_w = 80;
                let slot_h = 32;
                let pad = 8;
                let cols = 4;  // Fixed 4 columns

                // Abbreviations for compact labels
                function abbr(item_type) {
                    let abbr_map = {
                        [ItemType.POTION_SPEED]: 'SPEED',
                        [ItemType.POTION_STRENGTH]: 'STRENGTH',
                        [ItemType.POTION_MISSILES]: 'MISSILE',
                        [ItemType.SCROLL_BLAST]: 'BLAST',
                        [ItemType.SCROLL_FARSEE]: 'FARSEE',
                        [ItemType.SCROLL_INVISIBILITY]: 'INVIS',
                        [ItemType.POTION_REVIVE]: 'REVIVE'
                    };
                    return abbr_map[item_type] || item_type.toString();
                }

                for (let i = 0; i < this.player.inventory.length; i++) {
                    let item = this.player.inventory[i];
                    let row = Math.floor(i / cols);
                    let col = i % cols;
                    let sx = x0 + 10 + col * (slot_w + pad);
                    let sy = y0 + 30 + row * (slot_h + pad);

                    // Slot background
                    ctx.fillStyle = 'rgb(30, 30, 30)';
                    ctx.fillRect(sx, sy, slot_w, slot_h);

                    // Border color based on selection
                    let border_color = (i === this.inventory_cursor) ? CYAN : 'rgb(200, 200, 200)';
                    ctx.strokeStyle = border_color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, slot_w, slot_h);

                    // Label centered
                    ctx.fillStyle = WHITE;
                    ctx.font = '14px Courier New';
                    ctx.textAlign = 'center';
                    let label = abbr(item.type);
                    ctx.fillText(label, sx + slot_w/2, sy + slot_h/2 + 5);
                }

                // Show empty message if no items
                if (this.player.inventory.length === 0) {
                    ctx.fillStyle = GRAY;
                    ctx.font = '16px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText("Inventory is empty", x0 + inv_w/2, y0 + inv_h/2);
                }
            }

            render_farsee_minimap() {
                // Mini-map in bottom-right corner like Python version
                let map_size = SCREEN_WIDTH/2 - 20;
                let map_x = SCREEN_WIDTH - map_size - 10;
                let map_y = SCREEN_HEIGHT - map_size - 10;

                // Background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(map_x - 5, map_y - 5, map_size + 10, map_size + 10);

                ctx.strokeStyle = GREEN;
                ctx.lineWidth = 2;
                ctx.strokeRect(map_x, map_y, map_size, map_size);

                // Scale world to mini-map
                let scale_x = map_size / WORLD_WIDTH;
                let scale_y = map_size / WORLD_HEIGHT;

                // Draw walls
                ctx.fillStyle = GRAY;
                for (let [wx, wy] of this.walls) {
                    let mx = map_x + wx * scale_x;
                    let my = map_y + wy * scale_y;
                    if (mx >= map_x && mx < map_x + map_size && my >= map_y && my < map_y + map_size) {
                        ctx.fillRect(mx, my, Math.max(1, scale_x * 32), Math.max(1, scale_y * 32));
                    }
                }

                // Draw player
                if (this.player) {
                    ctx.fillStyle = YELLOW;
                    let px = map_x + this.player.x * scale_x;
                    let py = map_y + this.player.y * scale_y;
                    ctx.fillRect(px - 2, py - 2, 4, 4);
                }

                // Draw enemies
                ctx.fillStyle = RED;
                for (let enemy of this.enemies) {
                    let ex = map_x + enemy.x * scale_x;
                    let ey = map_y + enemy.y * scale_y;
                    if (ex >= map_x && ex < map_x + map_size && ey >= map_y && ey < map_y + map_size) {
                        ctx.fillRect(ex - 1, ey - 1, 2, 2);
                    }
                }

                // Draw items (KEYS with BIG gold highlighting)
                for (let item of this.items) {
                    if (!item.collected) {
                        let ix = map_x + item.x * scale_x;
                        let iy = map_y + item.y * scale_y;
                        if (ix >= map_x && ix < map_x + map_size && iy >= map_y && iy < map_y + map_size) {
                            if (item.type === ItemType.KEY) {
                                // BIG gold highlighting for keys - draw a cross pattern
                                ctx.fillStyle = GOLD;
                                for (let dx = -2; dx <= 2; dx++) {
                                    for (let dy = -2; dy <= 2; dy++) {
                                        if (Math.abs(dx) === Math.abs(dy) || dx === 0 || dy === 0) { // Cross pattern
                                            let mx = ix + dx;
                                            let my = iy + dy;
                                            if (mx >= map_x && mx < map_x + map_size && my >= map_y && my < map_y + map_size) {
                                                ctx.fillRect(mx, my, 1, 1);
                                            }
                                        }
                                    }
                                }
                            } else {
                                // Other items in white
                                ctx.fillStyle = WHITE;
                                ctx.fillRect(ix - 1, iy - 1, 2, 2);
                            }
                        }
                    }

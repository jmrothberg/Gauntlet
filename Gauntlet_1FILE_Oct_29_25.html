                }

                // Draw current viewport rectangle
                ctx.strokeStyle = GREEN;
                ctx.lineWidth = 1;
                let view_left = map_x + this.camera_x * scale_x;
                let view_top = map_y + this.camera_y * scale_y;
                let view_width = GAME_WIDTH * scale_x;
                let view_height = GAME_HEIGHT * scale_y;
                ctx.strokeRect(view_left, view_top, view_width, view_height);

                // Add "FARSEE" label
                ctx.fillStyle = WHITE;
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("FARSEE", map_x + map_size/2, map_y + map_size - 5);
            }

            get_item_name(item_type) {
                switch (item_type) {
                    case ItemType.FOOD: return "Food";
                    case ItemType.KEY: return "Key";
                    case ItemType.GOLD: return "Gold";
                    case ItemType.POTION_SPEED: return "Speed Potion";
                    case ItemType.POTION_STRENGTH: return "Strength Potion";
                    case ItemType.POTION_MISSILES: return "Missiles Potion";
                    case ItemType.SCROLL_INVISIBILITY: return "Invisibility Scroll";
                    case ItemType.SCROLL_FARSEE: return "Farsee Scroll";
                    case ItemType.POTION_REVIVE: return "Revive Scroll";
                    case ItemType.SCROLL_BLAST: return "Blast Scroll";
                    default: return "Unknown Item";
                }
            }

            render_ui() {
                // Hide UI when inventory is open
                if (this.inventory_open) return;

                // HUD split: big icon + LIFE left; stats/score right (monospace)
                let left_w = Math.floor(SCREEN_WIDTH / 2);
                let right_w = SCREEN_WIDTH - left_w;
                let bottom_y = GAME_HEIGHT;

                // Left panel - LIFE bar and status effects
                ctx.fillStyle = '#101010';
                ctx.fillRect(0, bottom_y, left_w, UI_HEIGHT);

                if (this.player) {
                    // LIFE bar + numeric
                    let life_val = Math.ceil(this.player.life);
                    ctx.strokeStyle = WHITE;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(8, bottom_y + 8, left_w - 16, 28);
                    ctx.fillStyle = DARK_GRAY;
                    ctx.fillRect(10, bottom_y + 10, left_w - 20, 24);

                    let max_bar = left_w - 20;
                    let filled = Math.floor(max_bar * Math.max(0, life_val) / Math.max(1, this.player.max_life));
                    ctx.fillStyle = '#00AA00';
                    ctx.fillRect(10, bottom_y + 10, filled, 24);

                    ctx.fillStyle = BLACK;
                    ctx.font = '16px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText("LIFE", 12, bottom_y + 26);

                    // Status effects timer bar
                    ctx.strokeStyle = WHITE;
                    ctx.strokeRect(8, bottom_y + 70, left_w - 16, 28);
                    ctx.fillStyle = DARK_GRAY;
                    ctx.fillRect(10, bottom_y + 72, left_w - 20, 24);

                    // Show active effects with timer bar
                    let active_effects = [];

                    // Check status_effects dictionary
                    for (let effect in this.status_effects) {
                        if (this.status_effects[effect] > 0 && ['speed', 'strength', 'missiles', 'shield', 'invis'].includes(effect)) {
                            active_effects.push([effect, this.status_effects[effect]]);
                        }
                    }

                    // Check farsee_timer separately (it's not in status_effects)
                    if (this.farsee_timer > 0) {
                        active_effects.push(['farsee', this.farsee_timer]);
                    }

                    if (active_effects.length > 0) {
                        // If multiple effects, cycle through them every 2 seconds
                        let cycle_index = 0;
                        if (active_effects.length > 1) {
                            cycle_index = Math.floor(Date.now() / 2000) % active_effects.length;
                        }
                        let [effect_name, time_left] = active_effects[cycle_index];

                        // Show count of total active effects
                        let effect_text = `${effect_name.toUpperCase()}: ${time_left.toFixed(1)}s`;
                        if (active_effects.length > 1) {
                            effect_text += ` (${active_effects.length} active)`;
                        }

                        // Calculate scaling based on maximum possible duration for this effect type
                        let max_effect_duration;
                        if (effect_name === 'farsee') {
                            // Farsee is always 30 seconds maximum
                            max_effect_duration = 30.0;
                        } else {
                            // Potions scale up to WOKE difficulty (6x multiplier)
                            max_effect_duration = POTION_DURATION * 6.0;  // Always use maximum possible
                        }

                        // Scale the bar based on remaining time vs maximum duration
                        let effect_percent = time_left / max_effect_duration;
                        effect_percent = Math.max(0.0, Math.min(1.0, effect_percent));  // Clamp to 0-1

                        // Yellow fill - same position as background
                        ctx.fillStyle = YELLOW;
                        ctx.fillRect(10, bottom_y + 72, Math.floor((left_w - 20) * effect_percent), 24);

                        // Draw the text
                        ctx.fillStyle = BLACK;
                        ctx.fillText(effect_text, 15, bottom_y + 88);
                    } else {
                        // Show "No Active Effects" when empty
                        ctx.fillStyle = BLACK;
                        ctx.fillText("NO ACTIVE EFFECTS", 15, bottom_y + 88);
                    }

                    // Big Icon Slot - show last picked up item
                    ctx.strokeStyle = WHITE;
                    ctx.strokeRect(12, bottom_y + 140, 88, 88);
                    let cx = 12 + 44, cy = bottom_y + 140 + 44;

                    // Show last picked up item, or slime as fallback
                    let display_sprite = this.last_pickup_type ? sprites[this.last_pickup_type] : sprites['slime'];
                    if (display_sprite) {
                        ctx.drawImage(display_sprite, cx - 32, cy - 32, 64, 64);
                    } else {
                        // Fallback
                        ctx.fillStyle = GREEN;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }

                // Right panel - stats and info
                ctx.fillStyle = '#101010';
                ctx.fillRect(left_w, bottom_y, right_w, UI_HEIGHT);

                ctx.fillStyle = WHITE;
                ctx.font = '14px Courier New';
                ctx.textAlign = 'left';

                if (this.player) {
                    ctx.fillText(`Class: ${this.player.character_class.name}`, left_w + 10, bottom_y + 30);
                    ctx.fillText(`Speed: ${this.player.character_class.speed}`, left_w + 10, bottom_y + 50);
                    ctx.fillText(`Strength: ${this.player.character_class.strength}`, left_w + 10, bottom_y + 70);
                    ctx.fillText(`Missiles: ${this.player.character_class.missiles}`, left_w + 10, bottom_y + 90);

                    ctx.fillText(`Gold: ${this.player.gold}`, left_w +140, bottom_y + 30);
                    ctx.fillText(`Keys: ${this.player.keys_collected}`, left_w + 140, bottom_y + 50);
                    ctx.fillText(`Score: ${this.score}`, left_w + 140, bottom_y + 70);
                    ctx.fillText(`Level: ${this.current_level}`, left_w + 140, bottom_y + 90);
                }

                // Messages at bottom
                if (this.ui_messages.length > 0) {
                    ctx.fillStyle = YELLOW;
                    ctx.fillText(this.ui_messages[this.ui_messages.length - 1][0], left_w + 10, bottom_y + 140);
                }

                // Instructions at bottom right
                ctx.fillStyle = GRAY;
                ctx.font = '12px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText("Arrow Keys: Move | Space: Shoot", SCREEN_WIDTH - 10, bottom_y + 200);
                ctx.fillText("I: Inventory | P: Pause", SCREEN_WIDTH - 10, bottom_y + 215);
            }

            load_level(level_num) {
                this.current_level = level_num;
                this.enemies = [];
                this.items = [];
                this.hazards = [];

                // Generate maze layout FIRST
                this.generate_level_layout(level_num);

                // Add keys to the generated open spaces - use seeded RNG like Python
                let rng = new SeededRandom(level_num * 911);
                for (let i = 0; i < 30; i++) {
                    let kx = rng.randint(WORLD_MARGIN + 64, WORLD_WIDTH - WORLD_MARGIN - 64);
                    let ky = rng.randint(WORLD_MARGIN + 64, WORLD_HEIGHT - WORLD_MARGIN - 64);
                    if (!this.check_wall_collision(kx, ky)) {
                        this.keys_needed.push([kx, ky]);
                    }
                }

                // Make sure each room has at least one door
                this.ensure_room_doors();

                // Spawn enemies in valid locations
                this.spawn_enemies(level_num);

                // Place items (including the keys we planned)
                this.place_items();

                // Add hazards for gameplay variety
                this.place_hazards();

                // Ensure the player has room to move and doors work
                this.ensure_spawn_space();
                this.ensure_door_blockers();

                // Place player at center of first room
                if (this.player && this.rooms.length > 0) {
                    let [rx, ry, rw, rh] = this.rooms[0];
                    this.player.x = rx + Math.floor(rw / 2);
                    this.player.y = ry + Math.floor(rh / 2);

                    // Place a key in the starting room
                    let start_key_x = rx + Math.floor(rw / 4);
                    let start_key_y = ry + Math.floor(rh / 4);
                    this.items.push(new Item(start_key_x, start_key_y, ItemType.KEY));

                    // Add some food in starting room for safety
                    let food_x = rx + Math.floor(rw * 3 / 4);
                    let food_y = ry + Math.floor(rh / 4);
                    this.items.push(new Item(food_x, food_y, ItemType.FOOD));

                    // CRITICAL: Make sure starting room has at least one door that's already open
                    // Find doors ON the walls of the starting room
                    let starting_room_doors = [];
                    for (let [door_x, door_y] of this.doors) {
                        // Check if door is on the perimeter of starting room
                        let on_room_wall = false;
                        // Top or bottom wall
                        if ((door_x >= rx && door_x <= rx + rw) && (door_y === ry || door_y === ry + rh - 32)) {
                            on_room_wall = true;
                        }
                        // Left or right wall
                        else if ((door_y >= ry && door_y <= ry + rh) && (door_x === rx || door_x === rx + rw - 32)) {
                            on_room_wall = true;
                        }

                        if (on_room_wall) {
                            starting_room_doors.push([door_x, door_y]);
                        }
                    }

                    if (starting_room_doors.length > 0) {
                        // Remove one door to make it permanently open (no key needed)
                        let door_to_open = starting_room_doors[0];
                        let door_index = this.doors.findIndex(([x, y]) => x === door_to_open[0] && y === door_to_open[1]);
                        if (door_index !== -1) {
                            this.doors.splice(door_index, 1);
                        }
                        console.log(`Made starting room door permanently open at [${door_to_open[0]}, ${door_to_open[1]}]`);
                    } else {
                        // Fallback: carve a new door on the top wall center
                        let door_x = rx + Math.floor((rw / 2) / 32) * 32;
                        let door_y = ry;
                        // Remove wall if it exists
                        let wall_index = this.walls.findIndex(([wx, wy]) => wx === door_x && wy === door_y);
                        if (wall_index !== -1) {
                            this.walls.splice(wall_index, 1);
                        }
                        this.doors.push([door_x, door_y]);
                        console.log("Created fallback door for starting room at", [door_x, door_y]);
                    }
                }
            }

            generate_level_layout(level_num) {
                this.walls = [];
                this.doors = [];
                this.keys_needed = [];
                this.terminals = [];
                this.rooms = [];

                let wall_size = 32;
                let maze_width = WORLD_WIDTH / wall_size;
                let maze_height = WORLD_HEIGHT / wall_size;

                // Create room-based layout
                let rnd = (seed) => {
                    let x = Math.sin(seed) * 10000;
                    return x - Math.floor(x);
                };

                let room_grid_size = 6;
                let rooms_per_row = Math.floor(maze_width / (room_grid_size + 2));
                let rooms_per_col = Math.floor(maze_height / (room_grid_size + 2));

                // Place rooms in grid positions
                for (let grid_row = 0; grid_row < rooms_per_col; grid_row++) {
                    for (let grid_col = 0; grid_col < rooms_per_row; grid_col++) {
                        // Calculate room position
                        let room_grid_x = grid_col * (room_grid_size + 2) + 1;
                        let room_grid_y = grid_row * (room_grid_size + 2) + 1;

                        // Convert to pixel coordinates
                        let room_x = room_grid_x * wall_size;
                        let room_y = room_grid_y * wall_size;
                        let room_w = room_grid_size * wall_size;
                        let room_h = room_grid_size * wall_size;

                        // Add some randomness to room size
                        let seed = level_num * 137 + grid_row * 100 + grid_col;
                        if (rnd(seed) < 0.3) {
                            let extra_w = Math.floor(rnd(seed + 1) * 3 + 1);
                            let extra_h = Math.floor(rnd(seed + 2) * 3 + 1);
                            room_w += wall_size * extra_w;
                            room_h += wall_size * extra_h;
                        }

                        this.rooms.push([room_x, room_y, room_w, room_h]);

                        // Create walls around the room
                        let room_tiles_w = Math.floor(room_w / wall_size);
                        let room_tiles_h = Math.floor(room_h / wall_size);

                        for (let rx = room_grid_x; rx < room_grid_x + room_tiles_w; rx++) {
                            for (let ry = room_grid_y; ry < room_grid_y + room_tiles_h; ry++) {
                                // Only add walls on the perimeter
                                if (rx === room_grid_x || rx === room_grid_x + room_tiles_w - 1 ||
                                    ry === room_grid_y || ry === room_grid_y + room_tiles_h - 1) {
                                    if (rx >= 0 && rx < maze_width && ry >= 0 && ry < maze_height) {
                                        let wall_x = rx * wall_size;
                                        let wall_y = ry * wall_size;
                                        this.walls.push([wall_x, wall_y]);
                                    }
                                }
                            }
                        }
                    }
                }

                // Create doors for each room
                for (let room_idx = 0; room_idx < this.rooms.length; room_idx++) {
                    let [rx, ry, rw, rh] = this.rooms[room_idx];
                    let doors_for_room = Math.floor(rnd(level_num * 200 + room_idx) * 2) + 1; // 1-2 doors

                    for (let door_num = 0; door_num < doors_for_room; door_num++) {
                        let seed = level_num * 300 + room_idx * 10 + door_num;
                        let side_rand = rnd(seed);
                        let side = side_rand < 0.25 ? 'top' : side_rand < 0.5 ? 'bottom' : side_rand < 0.75 ? 'left' : 'right';

                        let room_grid_x = Math.floor(rx / wall_size);
                        let room_grid_y = Math.floor(ry / wall_size);
                        let room_tiles_w = Math.floor(rw / wall_size);
                        let room_tiles_h = Math.floor(rh / wall_size);

                        let door_tile_x, door_tile_y;

                        if (side === 'top') {
                            door_tile_x = room_grid_x + Math.floor(rnd(seed + 1) * (room_tiles_w - 2)) + 1;
                            door_tile_y = room_grid_y;
                        } else if (side === 'bottom') {
                            door_tile_x = room_grid_x + Math.floor(rnd(seed + 1) * (room_tiles_w - 2)) + 1;
                            door_tile_y = room_grid_y + room_tiles_h - 1;
                        } else if (side === 'left') {
                            door_tile_x = room_grid_x;
                            door_tile_y = room_grid_y + Math.floor(rnd(seed + 1) * (room_tiles_h - 2)) + 1;
                        } else { // right
                            door_tile_x = room_grid_x + room_tiles_w - 1;
                            door_tile_y = room_grid_y + Math.floor(rnd(seed + 1) * (room_tiles_h - 2)) + 1;
                        }

                        let door_x = door_tile_x * wall_size;
                        let door_y = door_tile_y * wall_size;

                        // Remove wall and add door
                        let wall_index = this.walls.findIndex(([wx, wy]) => wx === door_x && wy === door_y);
                        if (wall_index !== -1) {
                            this.walls.splice(wall_index, 1);
                        }
                        this.doors.push([door_x, door_y]);
                    }
                }

                // Place terminals in rooms (like Python - ensure_room_doors will add more)
                // Python places one terminal in first room here, others in ensure_room_doors
                if (this.rooms.length > 0) {
                    let [cx, cy, cw, ch] = this.rooms[0];
                    // Try to place terminal in first room
                    let placed = false;
                    let attempts = 0;
                    while (!placed && attempts < 10) {
                        let term_x = cx + Math.floor(Math.random() * (cw - 64)) + 32;
                        let term_y = cy + Math.floor(Math.random() * (ch - 64)) + 32;
                        if (!this.check_wall_collision(term_x, term_y)) {
                            this.terminals.push([term_x, term_y]);
                            placed = true;
                        }
                        attempts++;
                    }
                }
            }

            ensure_room_doors() {
                // Ensure each room has at least one door
                for (let room of this.rooms) {
                    let [rx, ry, rw, rh] = room;
                    let has_door = false;

                    for (let [dx, dy] of this.doors) {
                        if (dx >= rx && dx < rx + rw && dy >= ry && dy < ry + rh) {
                            has_door = true;
                            break;
                        }
                    }

                    if (!has_door) {
                        // Add a door to this room
                        let door_x = rx + 32;
                        let door_y = ry;
                        this.doors.push([door_x, door_y]);
                        // Remove wall if it exists
                        let wall_index = this.walls.findIndex(([wx, wy]) => wx === door_x && wy === door_y);
                        if (wall_index !== -1) {
                            this.walls.splice(wall_index, 1);
                        }
                    }
                }

                // Place terminals in rooms (probability-based)
                for (let [rx, ry, rw, rh] of this.rooms) {
                    if (Math.random() < TERMINAL_CHANCE_PER_ROOM) {
                        // Try to place terminal in room, similar to enemy placement
                        let placed = false;
                        let attempts = 0;
                        while (!placed && attempts < 10) {
                            let term_x = rx + Math.floor(Math.random() * (rw - 64)) + 32;
                            let term_y = ry + Math.floor(Math.random() * (rh - 64)) + 32;
                            if (!this.check_wall_collision(term_x, term_y) &&
                                !this.terminals.some(([tx, ty]) => tx === term_x && ty === term_y)) {
                                this.terminals.push([term_x, term_y]);
                                placed = true;
                            }
                            attempts++;
                        }
                    }
                }
            }

            spawn_enemies(level_num) {
                // Spawn enemies INSIDE rooms so they are unleashed when doors open
                if (this.rooms.length === 0) {
                    return;
                }

                let rnd = new SeededRandom(level_num * 777);
                let total_cap = ENEMY_CAP;  // higher overall density
                let spawned = 0;

                // Shuffle rooms so population is evenly distributed across the map
                let room_order = [...this.rooms];
                // Simple shuffle using seeded random
                for (let i = room_order.length - 1; i > 0; i--) {
                    let j = rnd.randint(0, i);
                    [room_order[i], room_order[j]] = [room_order[j], room_order[i]];
                }

                // Enemies per room scales with level, clamped, and difficulty
                let base_per_room = MIN_ENEMIES_PER_ROOM + Math.floor(level_num / 2);
                let per_room = Math.max(MIN_ENEMIES_PER_ROOM, Math.min(MAX_ENEMIES_PER_ROOM, base_per_room));
                // Apply difficulty multiplier to monster count
                let monster_multiplier = DIFFICULTY_MULTIPLIERS[this.difficulty]['monsters'];
                per_room = Math.max(1, Math.floor(per_room * monster_multiplier));  // Ensure at least 1 enemy per room

                for (let [rx, ry, rw, rh] of room_order) {
                    // Skip starting room (rooms[0]) for level 1 to give player breathing room
                    if (level_num === 1 && rx === this.rooms[0][0] && ry === this.rooms[0][1]) {
                        continue;
                    }

                    // Interior bounds (avoid walls/doors)
                    let min_x = rx + 56;
                    let max_x = rx + rw - 56;
                    let min_y = ry + 56;
                    let max_y = ry + rh - 56;
                    if (min_x >= max_x || min_y >= max_y) {
                        continue;
                    }

                    // Reduce enemies in early levels
                    let enemies_in_this_room = per_room;
                    if (level_num === 1) {
                        enemies_in_this_room = Math.max(1, Math.floor(per_room / 2)); // Half as many on level 1
                    }

                    for (let i = 0; i < enemies_in_this_room; i++) {
                        if (spawned >= total_cap) {
                            break;
                        }

                        // Use all available enemy types like Python version
                        let enemy_types = Object.values(EnemyType);
                        let enemy_type = enemy_types[rnd.randint(0, enemy_types.length - 1)];

                        let attempts = 0;
                        let placed = false;
                        while (attempts < 30 && !placed) {
                            let x = rnd.randint(min_x, max_x);
                            let y = rnd.randint(min_y, max_y);
                            if (this.is_free_of_walls(x, y)) {
                                this.enemies.push(new Enemy(x, y, enemy_type, this));
                                spawned++;
                                placed = true;
                            }
                            attempts++;
                        }
                    }
                    if (spawned >= total_cap) {
                        break;
                    }
                }
            }

            place_items() {
                // Use seeded RNG like Python version for deterministic placement
                let rng = new SeededRandom((this.current_level || 1) * 919);

                let is_inside_any_room = (px, py) => {
                    for (let [rx, ry, rw, rh] of this.rooms) {
                        if (px >= rx && px <= rx + rw && py >= ry && py <= ry + rh) {
                            return true;
                        }
                    }
                    return false;
                };

                let get_room_containing = (px, py) => {
                    for (let i = 0; i < this.rooms.length; i++) {
                        let [rx, ry, rw, rh] = this.rooms[i];
                        if (px >= rx && px <= rx + rw && py >= ry && py <= ry + rh) {
                            return i; // Return room index
                        }
                    }
                    return -1; // Not in any room
                };

                // Corridor health (outside rooms)
                let corridor_health = Math.max(BASE_CORRIDOR_FOOD, this.rooms.length * FOOD_PER_ROOM_MULTIPLIER);
                let placed = 0;
                let attempts = 0;
                while (placed < corridor_health && attempts < corridor_health * 20) {
                    let x = rng.randint(WORLD_MARGIN, WORLD_WIDTH - WORLD_MARGIN);
                    let y = rng.randint(WORLD_MARGIN, WORLD_HEIGHT - WORLD_MARGIN);
                    if (!this.check_wall_collision(x, y) && !is_inside_any_room(x, y)) {
                        this.items.push(new Item(x, y, ItemType.FOOD));
                        placed++;
                    }
                    attempts++;
                }

                // Room health (MIN_FOOD_PER_ROOM–MAX_FOOD_PER_ROOM per room)
                for (let [rx, ry, rw, rh] of this.rooms) {
                    for (let i = 0; i < rng.randint(MIN_FOOD_PER_ROOM, MAX_FOOD_PER_ROOM); i++) {
                        let hx = rng.randint(rx + 40, rx + rw - 40);
                        let hy = rng.randint(ry + 40, ry + rh - 40);
                        if (!this.check_wall_collision(hx, hy)) {
                            this.items.push(new Item(hx, hy, ItemType.FOOD));
                        }
                    }
                }

                // Place keys in valid locations - force placement with fallback!
                let keys_placed = 0;
                for (let [kx, ky] of this.keys_needed) {
                    let key_x = kx;
                    let key_y = ky;
                    // Make sure key position is valid
                    if (!this.check_wall_collision(key_x, key_y)) {
                        this.items.push(new Item(key_x, key_y, ItemType.KEY));
                        keys_placed++;
                    } else {
                        // Find a nearby valid position - expanded search like Python
                        let valid_position = false;
                        let attempts = 0;
                        while (!valid_position && attempts < 100) {  // More attempts
                            let offset_x = rng.randint(-96, 96);  // Larger search radius
                            let offset_y = rng.randint(-96, 96);
                            let test_x = Math.max(WORLD_MARGIN, Math.min(WORLD_WIDTH - WORLD_MARGIN, key_x + offset_x));
                            let test_y = Math.max(WORLD_MARGIN, Math.min(WORLD_HEIGHT - WORLD_MARGIN, key_y + offset_y));
                            if (!this.check_wall_collision(test_x, test_y)) {
                                this.items.push(new Item(test_x, test_y, ItemType.KEY));
                                keys_placed++;
                                valid_position = true;
                            }
                            attempts++;
                        }
                    }
                }


                // If we couldn't place enough keys, add them in room centers (guaranteed open space)
                if (keys_placed < this.keys_needed.length / 2) {  // If less than half placed
                    for (let i = 0; i < this.rooms.length; i++) {
                        if (keys_placed >= this.keys_needed.length) {
                            break;
                        }
                        // Place key in center of room
                        let [rx, ry, rw, rh] = this.rooms[i];
                        let key_x = rx + Math.floor(rw / 2);
                        let key_y = ry + Math.floor(rh / 2);
                        this.items.push(new Item(key_x, key_y, ItemType.KEY));
                        keys_placed++;
                    }
                }

                // Corridor items (keys and gold outside rooms)
                let corridor_keys = Math.max(BASE_CORRIDOR_KEYS, Math.floor(this.rooms.length * KEYS_PER_ROOM_MULTIPLIER));
                let corridor_gold = Math.max(BASE_CORRIDOR_GOLD, this.rooms.length * GOLD_PER_ROOM_MULTIPLIER);
                let total_corridor_items = corridor_keys + corridor_gold;
                placed = 0;
                attempts = 0;
                while (placed < total_corridor_items && attempts < total_corridor_items * 20) {
                    let x = rng.randint(WORLD_MARGIN, WORLD_WIDTH - WORLD_MARGIN);
                    let y = rng.randint(WORLD_MARGIN, WORLD_HEIGHT - WORLD_MARGIN);
                    if (!this.check_wall_collision(x, y) && !is_inside_any_room(x, y)) {
                        // Place keys first, then gold
                        if (placed < corridor_keys) {
                            this.items.push(new Item(x, y, ItemType.KEY));
                        } else {
                            this.items.push(new Item(x, y, ItemType.GOLD));
                        }
                        placed++;
                    }
                    attempts++;
                }

                // Room gold (chance per room) - match Python exactly
                for (let [rx, ry, rw, rh] of this.rooms) {
                    if (rng.random() < GOLD_CHANCE_PER_ROOM) {
                        let gx = rng.randint(rx + 40, rx + rw - 40);
                        let gy = rng.randint(ry + 40, ry + rh - 40);
                        if (!this.check_wall_collision(gx, gy)) {
                            this.items.push(new Item(gx, gy, ItemType.GOLD));
                        }
                    }
                }
            }

            place_hazards() {
                if (this.rooms.length === 0) return;

                for (let room of this.rooms) {
                    let [rx, ry, rw, rh] = room;
                    let hazard_count = Math.floor(Math.random() * 3); // 0-2 hazards per room

                    for (let i = 0; i < hazard_count; i++) {
                        let x = rx + Math.floor(Math.random() * (rw - 64)) + 32;
                        let y = ry + Math.floor(Math.random() * (rh - 64)) + 32;

                        let hazard_types = [HazardType.SPIKES, HazardType.RUNE, HazardType.POISON];
                        let hazard_type = hazard_types[Math.floor(Math.random() * hazard_types.length)];
                        this.hazards.push([x, y, hazard_type, 0.0]);
                    }
                }
            }

            ensure_spawn_space() {
                // Ensure player spawn area is clear
                if (this.player && this.rooms.length > 0) {
                    let [rx, ry, rw, rh] = this.rooms[0];
                    let center_x = rx + Math.floor(rw / 2);
                    let center_y = ry + Math.floor(rh / 2);

                    // Clear walls in a small area around spawn
                    this.walls = this.walls.filter(([wx, wy]) => {
                        return Math.abs(wx - center_x) > 48 || Math.abs(wy - center_y) > 48;
                    });
                }
            }

            ensure_door_blockers() {
                // Ensure one tile of approach space on the outside of each door
                // Doors are already openings in walls - remove wall tiles that block approach
                let approach_clear = [];
                for (let [door_x, door_y] of this.doors) {
                    let block_y = Math.floor(door_y / 32) * 32;  // align to grid row nearest door
                    // Decide orientation by proximity to room walls: carve approach tile outside
                    let left_tile = [door_x - 32, block_y];
                    let right_tile = [door_x + 32, block_y];
                    let top_tile = [door_x, block_y - 32];
                    let bottom_tile = [door_x, block_y + 32];
                    // Choose an approach tile that is inside bounds and not border
                    for (let [tx, ty] of [right_tile, left_tile, bottom_tile, top_tile]) {
                        if (0 < tx && tx < GAME_WIDTH - 32 && 0 < ty && ty < GAME_HEIGHT - 32) {
                            approach_clear.push([tx, ty]);
                            break;
                        }
                    }
                }
                // Carve approach space (remove walls at approach tiles) - doors remain as wall openings
                this.walls = this.walls.filter(([wx, wy]) => {
                    return !approach_clear.some(([ax, ay]) => ax === wx && ay === wy);
                });
            }

            check_wall_collision(x, y) {
                // Check if position collides with walls or unopened doors
                let player_rect = {
                    x: x - 12,
                    y: y - 12,
                    w: 24,
                    h: 24
                };

                // Check walls with overlap tolerance (like Python)
                for (let [wx, wy] of this.walls) {
                    let wall_rect = {
                        x: wx,
                        y: wy,
                        w: 32,
                        h: 32
                    };
                    if (this.rects_collide(player_rect, wall_rect)) {
                        // Allow slight overlap tolerance on right side to reach doors on right walls
                        if (player_rect.x + player_rect.w > wall_rect.x && player_rect.x + player_rect.w - wall_rect.x <= 4) {
                            // Allow tiny right overlap to reach doors
                            continue;
                        }
                        // Allow tiny bottom overlap so player can get flush with bottom walls
                        if (player_rect.y + player_rect.h > wall_rect.y && player_rect.y + player_rect.h - wall_rect.y <= 4) {
                            // Allow tiny bottom overlap
                            continue;
                        }
                        // Allow tiny left overlap so player can get flush with left walls
                        if (player_rect.x < wall_rect.x + wall_rect.w && wall_rect.x + wall_rect.w - player_rect.x <= 4) {
                            // Allow tiny left overlap
                            continue;
                        }
                        // Allow tiny top overlap so player can get flush with top walls
                        if (player_rect.y < wall_rect.y + wall_rect.h && wall_rect.y + wall_rect.h - player_rect.y <= 4) {
                            // Allow tiny top overlap
                            continue;
                        }
                        return true;
                    }
                }

                // Check unopened doors (they act as walls)
                for (let [door_x, door_y] of this.doors) {
                    let door_rect = {
                        x: door_x,
                        y: door_y,
                        w: 32,
                        h: 16
                    };
                    if (this.rects_collide(player_rect, door_rect)) {
                        return true;  // Block movement at doors without keys
                    }
                }

                return false;
            }

            is_free_of_walls(x, y) {
                return !this.check_wall_collision(x, y);
            }

            check_stuck_player() {
                // Detect if player is stuck inside a wall and rescue them
                if (!this.player) return;

                // Check if player is currently colliding with walls
                if (this.check_wall_collision(this.player.x, this.player.y)) {
                    console.log("Player stuck! Attempting rescue...");

                    // Try to find a safe nearby position
                    let rescue_attempts = [
                        [0, -32], [0, 32], [-32, 0], [32, 0],  // Adjacent tiles
                        [-32, -32], [32, -32], [-32, 32], [32, 32],  // Diagonals
                        [0, -64], [0, 64], [-64, 0], [64, 0]  // Further away
                    ];

                    for (let [dx, dy] of rescue_attempts) {
                        let test_x = this.player.x + dx;
                        let test_y = this.player.y + dy;

                        // Keep within world bounds
                        test_x = Math.max(32, Math.min(WORLD_WIDTH - 32, test_x));
                        test_y = Math.max(32, Math.min(WORLD_HEIGHT - 32, test_y));

                        if (!this.check_wall_collision(test_x, test_y)) {
                            this.player.x = test_x;
                            this.player.y = test_y;
                            this.add_ui_message("Rescued from wall!");
                            console.log(`Player rescued to (${test_x}, ${test_y})`);
                            return;
                        }
                    }

                    // Ultimate fallback: teleport to room center
                    if (this.rooms.length > 0) {
                        let [rx, ry, rw, rh] = this.rooms[0];
                        this.player.x = rx + Math.floor(rw / 2);
                        this.player.y = ry + Math.floor(rh / 2);
                        this.add_ui_message("Emergency teleport!");
                        console.log("Emergency teleport to room center");
                    }
                }
            }

            check_item_collisions() {
                if (!this.player) return;

                let player_rect = {
                    x: this.player.x - 16,
                    y: this.player.y - 16,
                    w: 32,
                    h: 32
                };

                for (let i = this.items.length - 1; i >= 0; i--) {
                    let item = this.items[i];
                    if (!item.collected) {
                        let item_rect = {
                            x: item.x - 16,
                            y: item.y - 16,
                            w: 32,
                            h: 32
                        };

                        if (this.rects_collide(player_rect, item_rect)) {
                            this.collect_item(item);
                            this.items.splice(i, 1);
                        }
                    }
                }
            }

            collect_item(item) {
                // Handle item collection
                // Health (apples) apply immediately and never use inventory
                if (item.type === ItemType.FOOD) {
                    item.collected = true;
                    this.last_pickup_type = 'item_apple';
                    this.player.life = Math.min(this.player.max_life, this.player.life + FOOD_VALUE);
                    this.add_ui_message(`Ate, gained ${FOOD_VALUE} life`);
                    this.sound_manager.play_food_eat();
                    return;
                }

                // Keys and Gold apply immediately and do NOT occupy inventory
                if (item.type === ItemType.KEY) {
                    item.collected = true;
                    this.last_pickup_type = 'item_key';
                    this.player.keys_collected++;
                    this.add_ui_message("Collected key!");
                    this.sound_manager.play_item_collect();
                    return;
                }

                if (item.type === ItemType.GOLD) {
                    item.collected = true;
                    this.last_pickup_type = 'item_gold';
                    this.player.gold += GOLD_VALUE;
                    this.add_ui_message(`+${GOLD_VALUE} gold!`);
                    this.sound_manager.play_gold_collect();
                    return;
                }

                // Potions and scrolls go to inventory (consumables)
                if (item.type === ItemType.POTION_SPEED) {
                    this.last_pickup_type = 'item_potion';
                    this.status_effects['speed'] = POTION_DURATION;
                    this.add_ui_message("Speed potion!");
                    this.sound_manager.play_item_collect();
                } else if (item.type === ItemType.POTION_STRENGTH) {
                    this.last_pickup_type = 'item_potion';
                    this.status_effects['strength'] = POTION_DURATION;
                    this.add_ui_message("Strength potion!");
                    this.sound_manager.play_item_collect();
                } else if (item.type === ItemType.POTION_MISSILES) {
                    this.last_pickup_type = 'item_potion';
                    this.status_effects['missiles'] = POTION_DURATION;
                    this.add_ui_message("Missiles potion!");
                    this.sound_manager.play_item_collect();
                }

                // Add to inventory if it's a collectible item
                if (this.player.inventory.length < this.player.max_inventory) {
                    this.player.inventory.push(item);
                    this.sound_manager.play_item_collect();
                }
            }

            check_enemy_collisions() {
                if (!this.player) return;

                let player_rect = {
                    x: this.player.x - 16,
                    y: this.player.y - 16,
                    w: 32,
                    h: 32
                };

                // Check projectile hits
                for (let p of this.projectiles) {
                    if (!p.alive) continue;

                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        let enemy = this.enemies[i];
                        let enemy_rect = {
                            x: enemy.x - 16,
                            y: enemy.y - 16,
                            w: 32,
                            h: 32
                        };

                        let projectile_rect = {
                            x: p.x - 3,
                            y: p.y - 3,
                            w: 6,
                            h: 6
                        };

                        if (this.rects_collide(projectile_rect, enemy_rect)) {
                            let split = enemy.take_damage(p.damage);
                            p.alive = false;

                            if (enemy.life <= 0) {
                                if (enemy.type === EnemyType.SLIME && split) {
                                    // Create two smaller slimes
                                    for (let dx of [-8, 8]) {
                                        let ns = new Enemy(enemy.x + dx, enemy.y, EnemyType.SLIME);
                                        ns.max_life = 6;
                                        ns.life = 6;
                                        ns.speed = 0.7;
                                        this.enemies.push(ns);
                                    }
                                }
                                this.enemies.splice(i, 1);
                                this.score += ENEMY_KILL_SCORE;
                                this.add_ui_message(`Enemy defeated! +${ENEMY_KILL_SCORE} points`);
                                this.last_enemy_hit = enemy.type;
                                this.enemy_portrait_timer = ENEMY_PORTRAIT_DURATION;
                            }
                            break;
                        }
                    }
                }

                

                // Check enemy-player collisions
                for (let enemy of this.enemies) {
                    let enemy_rect = {
                        x: enemy.x - 16,
                        y: enemy.y - 16,
                        w: 32,
                        h: 32
                    };

                    if (this.rects_collide(player_rect, enemy_rect)) {
                        // Player takes damage from contact (like Python - no knockback)
                        let base = Math.max(1, STRENGTH_DAMAGE - this.player.strength);
                        // Shield halves damage
                        if (this.status_effects['shield'] > 0) {
                            base *= 0.5;
                        }
                        let damage = base;
                        this.player.life -= damage;
                        this.sound_manager.play_damage();

                        // Add HUD feedback for enemy collision
                        let enemy_name = Object.keys(EnemyType).find(key => EnemyType[key] === enemy.type) || 'Enemy';
                        enemy_name = enemy_name.charAt(0).toUpperCase() + enemy_name.slice(1).toLowerCase();
                        this.add_ui_message(`Hit by ${enemy_name}! -${Math.floor(damage)} HP`);

                        // Slime contact slow effect (like Python)
                        if (enemy.type === EnemyType.SLIME) {
                            this.player_slow_timer = SLIME_SLOW_DURATION;
                        }

                        // Show enemy portrait
                        this.last_enemy_hit = enemy.type;
                        this.enemy_portrait_timer = ENEMY_PORTRAIT_DURATION;

                        // Check if player died from combat - let main update loop handle revive
                        if (this.player.life <= 0) {
                            // Don't immediately set GAME_OVER here - let the unified death check
                            // in the main update loop handle revive potions for ALL damage sources
                            // This prevents duplicate revive logic and ensures consistent behavior
                        }
                    }
                }
            }

            check_terminal_collisions(dt) {
                if (!this.player) return;

                // Update shop cooldown
                if (this.shop_cooldown > 0) {
                    this.shop_cooldown -= dt * 60;  // Decrement by dt like Python (not 1)
                }

                // Handle T key for terminal interaction (like Python)
                if (keysPressed['KeyT']) {
                    let px = this.player.x;
                    let py = this.player.y;

                    // Check if near a terminal
                    for (let [term_x, term_y] of this.terminals) {
                        let dist = Math.sqrt((px - term_x) ** 2 + (py - term_y) ** 2);
                        if (dist < 40) {  // Reasonable proximity like Python
                            if (!this.shop_block_until_exit && this.state !== GameState.SHOP && this.shop_cooldown <= 0) {
                                this.enter_shop();
                            }
                            break;
                        }
                    }
                    delete keysPressed['KeyT'];
                }

                // Handle D key for door interaction (like Python)
                if (keysPressed['KeyD']) {
                    let px = this.player.x;
                    let py = this.player.y;

                    // Check if near a door
                    let door_found = false;
                    for (let [door_x, door_y] of this.doors) {
                        // Use center of door tile for proximity check (more intuitive for side doors)
                        let door_center_x = door_x + 16;
                        let door_center_y = door_y + 16;
                        let dist = Math.sqrt((px - door_center_x) ** 2 + (py - door_center_y) ** 2);
                        if (dist < 48) {  // Increased proximity for easier door opening like Python
                            door_found = true;
                            if (this.player.keys_collected > 0) {
                                this.player.keys_collected -= 1;
                                let door_index = this.doors.findIndex(([x, y]) => x === door_x && y === door_y);
                                if (door_index !== -1) {
                                    this.doors.splice(door_index, 1);
                                    this.add_ui_message("Door unlocked!");
                                }
                            } else {
                                this.add_ui_message("Need a key to open this door!");
                            }
                            break;
                        }
                    }

                    if (!door_found) {
                        this.add_ui_message(`No door nearby (keys: ${this.player.keys_collected})`);
                    }
                    delete keysPressed['KeyD'];
                }

                // Handle space bar for combat only (like Python)
                if (keysPressed[' ']) {
                    // Check if enemy is in melee range
                    let px = this.player.x;
                    let py = this.player.y;
                    let enemy_in_range = false;

                    for (let enemy of this.enemies) {
                        let dist = Math.sqrt((px - enemy.x) ** 2 + (py - enemy.y) ** 2);
                        if (dist < 12) {  // Melee range like Python
                            enemy_in_range = true;
                            break;
                        }
                    }

                // Play attack sound regardless of hit/miss
                this.sound_manager.play_attack();
                if (this.player) this.player.attack_anim_timer = 0.18;

                if (enemy_in_range && this.melee_cooldown <= 0) {
                    this.try_melee_attack();
                } else {
                    this.fire_projectile();
                }
                    delete keysPressed[' '];
                }

                // Handle shop blocking logic (like Python)
                let player_rect = {
                    x: this.player.x - 12,
                    y: this.player.y - 12,
                    w: 24,
                    h: 24
                };
                let colliding_any_terminal = false;
                for (let [term_x, term_y] of this.terminals) {
                    let term_rect = {
                        x: term_x - 4,
                        y: term_y - 4,
                        w: 32,
                        h: 32
                    };
                    if (this.rects_collide(player_rect, term_rect)) {
                        colliding_any_terminal = true;
                        break;
                    }
                }

                // Unblock re-entry only after leaving the terminal area fully
                if (this.shop_block_until_exit && !colliding_any_terminal) {
                    this.shop_block_until_exit = false;
                }
            }

            check_door_collisions() {
                // Door collisions are now handled in check_wall_collision for blocking movement
                // Door unlocking is handled by key press in update_playing
                return;
            }

            check_hazard_collisions(dt) {
                if (!this.player) return;

                let player_rect = {
                    x: this.player.x - 10,
                    y: this.player.y - 10,
                    w: 20,
                    h: 20
                };

                for (let [hx, hy, htype, phase] of this.hazards) {
                    let hazard_rect = {
                        x: hx - 12,
                        y: hy - 12,
                        w: 24,
                        h: 24
                    };

                    if (this.rects_collide(player_rect, hazard_rect)) {
                        if (htype === HazardType.SPIKES) {
                            let damage = SPIKES_DAMAGE_RATE * dt;
                            this.player.life -= damage;
                            this.add_ui_message(`Hit by spikes! -${Math.ceil(damage)} HP`);
                        } else if (htype === HazardType.RUNE) {
                            // Visual pulse only
                            this.add_ui_message("Activated rune!");
                        } else if (htype === HazardType.POISON) {
                            let damage = POISON_DAMAGE_RATE * dt;
                            this.player.life -= damage;
                            this.add_ui_message(`Poison damage! -${Math.ceil(damage)} HP`);
                            // Apply slow effect
                            this.player_slow_timer = SLIME_SLOW_DURATION;
                        }
                    }
                }


                // Apply slow effect if active
                if (this.player_slow_timer > 0) {
                    this.player_slow_timer -= dt;
                    this.player.speed = Math.max(0.5, this.player.speed * 0.9);
                } else {
                    // Reset speed
                    this.player.speed = this.player.character_class.speed / 10;
                }
            }

            rects_collide(rect1, rect2) {
                return rect1.x < rect2.x + rect2.w &&
                       rect1.x + rect1.w > rect2.x &&
                       rect1.y < rect2.y + rect2.h &&
                       rect1.y + rect1.h > rect2.y;
            }

            fire_projectile() {
                if (!this.player) return;

                // Check for shot cooldown
                if (this.shot_cooldown > 0) return;

                this.shot_cooldown = SHOT_COOLDOWN; // ~5-6 shots/second

                let damage = Math.max(1, this.player.missiles);
                // Apply missile potion boost
                if (this.status_effects['missiles'] > 0) {
                    damage += 2;
                }

                let projectile = new Projectile(
                    this.player.x, this.player.y,
                    this.player.direction, 6.0, damage
                );
                this.projectiles.push(projectile);
                this.add_ui_message("Missile!");

                // Play shooting sound
                this.sound_manager.play_shoot();
                if (this.player) this.player.attack_anim_timer = 0.18;
            }

            update_projectiles(dt) {
                // Update firing cooldown
                if (this.shot_cooldown > 0) {
                    this.shot_cooldown = Math.max(0, this.shot_cooldown - dt);
                }
                // Attack-animation frame timer
                if (this.player && this.player.attack_anim_timer > 0) {
                    this.player.attack_anim_timer = Math.max(0, this.player.attack_anim_timer - dt);
                }

                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    let p = this.projectiles[i];
                    if (!p.alive) continue;

                    p.update(dt);

                    // Collide with walls
                    let proj_rect = { x: p.x - 2, y: p.y - 2, w: 4, h: 4 };
                    let hit_wall = false;
                    for (let [wx, wy] of this.walls) {
                        let wall_rect = { x: wx, y: wy, w: 32, h: 32 };
                        if (this.rects_collide(proj_rect, wall_rect)) {
                            hit_wall = true;
                            break;
                        }
                    }
                    if (hit_wall) {
                        p.alive = false;
                        continue;
                    }

                    // Collide with enemies
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        let e = this.enemies[j];
                        if (Math.abs(e.x - p.x) < 12 && Math.abs(e.y - p.y) < 12) {
                            e.hit_timer = 0.15;
                            let split = e.take_damage(p.damage);
                            p.alive = false;

                            // Track enemy hit for portrait
                            this.last_enemy_hit = e.type;
                            this.enemy_portrait_timer = 8.0;

                            if (e.life <= 0) {
                                if (e.type === EnemyType.SLIME && split) {
                                    // Create two smaller slimes
                                    for (let dx of [-8, 8]) {
                                        let ns = new Enemy(e.x + dx, e.y, EnemyType.SLIME);
                                        ns.max_life = 6;
                                        ns.life = 6;
                                        ns.speed = 0.7;
                                        this.enemies.push(ns);
                                    }
                                }
                                this.enemies.splice(j, 1);
                                this.sound_manager.play_item_collect();
                                this.score += ENEMY_KILL_SCORE;
                            }
                            break;
                        }
                    }

                    if (!p.alive) {
                        this.projectiles.splice(i, 1);
                    }
                }
            }

            try_melee_attack() {
                if (!this.player) return false;

                // Check for melee cooldown
                if (this.melee_cooldown > 0) {
                    return false;
                }

                // Melee reach and arc: small rectangle in facing direction (tighter reach)
                let px = this.player.x;
                let py = this.player.y;
                let reach = 12;
                let w = 18;
                let h = 18;

                let swing_rect;
                if (this.player.direction === Direction.RIGHT) {
                    swing_rect = { x: px, y: py - h/2, w: reach, h: h };
                } else if (this.player.direction === Direction.LEFT) {
                    swing_rect = { x: px - reach, y: py - h/2, w: reach, h: h };
                } else if (this.player.direction === Direction.UP) {
                    swing_rect = { x: px - h/2, y: py - reach, w: h, h: reach };
                } else { // DOWN
                    swing_rect = { x: px - h/2, y: py, w: h, h: reach };
                }

                // Check if any enemy is in swing range; if none, do not consume SPACE
                let any_target = false;
                for (let enemy of this.enemies) {
                    let enemy_rect = {
                        x: enemy.x - 12,
                        y: enemy.y - 12,
                        w: 24,
                        h: 24
                    };
                    if (this.rects_collide(swing_rect, enemy_rect)) {
                        any_target = true;
                        break;
                    }
                }

                if (!any_target) {
                    return false; // No enemy in swing arc
                }

                // Play melee sound immediately when attacking
                this.sound_manager.play_melee();

                // Proceed with melee: set cooldown, apply damage to targets
                this.melee_cooldown = 1.0; // 1 second cooldown

                let damage = Math.max(1, this.player.strength + (this.status_effects['strength'] > 0 ? 2 : 0));
                let did_hit = false;

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    let enemy = this.enemies[i];
                    let enemy_rect = {
                        x: enemy.x - 12,
                        y: enemy.y - 12,
                        w: 24,
                        h: 24
                    };

                    if (this.rects_collide(swing_rect, enemy_rect)) {
                        enemy.hit_timer = 0.12;
                        let split = enemy.take_damage(damage);
                        did_hit = true;

                        if (enemy.life <= 0) {
                            // Remove the dead enemy (no splitting for melee damage)
                            this.enemies.splice(i, 1);
                            this.score += ENEMY_KILL_SCORE;
                            this.add_ui_message(`Enemy defeated! +${ENEMY_KILL_SCORE} points`);
                        } else {
                            this.add_ui_message(`Sword hit! -${damage} HP`);
                        }

                        this.last_enemy_hit = enemy.type;
                        this.enemy_portrait_timer = ENEMY_PORTRAIT_DURATION;
                    }
                }

                // Sword swing animation
                if ('sword_swing' in sprites) {
                    let swing_sprite = sprites['sword_swing'];
                    this.effects.push({
                        type: "sword_sprite",
                        sprite: swing_sprite,
                        timer: 0.2,
                        x: px,
                        y: py,
                        direction: this.player.direction
                    });
                } else {
                    this.effects.push({
                        type: "sword_arc",
                        timer: 0.2,
                        x: px,
                        y: py,
                        direction: this.player.direction
                    });
                }

                return true;
            }

            update_paused(dt) {
                // Handle pause input
                if (keysPressed['KeyP'] || keysPressed['Escape']) {
                    this.state = GameState.PLAYING;
                    delete keysPressed['KeyP'];
                    delete keysPressed['Escape'];
                    this.add_ui_message("Game resumed");
                }
            }

            render_paused() {
                // First render the playing screen
                this.render_playing();

                // Then overlay pause text
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

                ctx.fillStyle = YELLOW;
                ctx.font = '48px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("PAUSED", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2);

                ctx.fillStyle = WHITE;
                ctx.font = '24px Courier New';
                ctx.fillText("Press P or ESC to resume", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 60);
            }

            enter_shop() {
                // Do not modify current level or regenerate map here
                this.state = GameState.SHOP;
                this.shop_selection = 0;  // Start with first item selected
                this.add_ui_message("Entered shop! Press ESC to exit");
            }

            update_shop(dt) {
                // Handle shop input with debounce
                let current_time = performance.now() / 1000.0;
                if (current_time - this.last_key_time < 0.15) {
                    return;
                }

                if (keysPressed['ArrowUp']) {
                    this.shop_selection = (this.shop_selection - 1 + this.shop_items.length) % this.shop_items.length;
                    delete keysPressed['ArrowUp'];
                    this.last_key_time = current_time;
                } else if (keysPressed['ArrowDown']) {
                    this.shop_selection = (this.shop_selection + 1) % this.shop_items.length;
                    delete keysPressed['ArrowDown'];
                    this.last_key_time = current_time;
                } else if (keysPressed['Enter']) {
                    this.purchase_item(this.shop_selection);
                    delete keysPressed['Enter'];
                    this.last_key_time = current_time;
                } else if (keysPressed['Escape'] || keysPressed['KeyT']) {
                    this.state = GameState.PLAYING;
                    this.shop_cooldown = 30;  // Prevent immediate re-entry
                    delete keysPressed['Escape'];
                    delete keysPressed['KeyT'];
                    this.last_key_time = current_time;
                    this.add_ui_message("Exited shop");
                }
            }

            purchase_item(item_index) {
                if (!this.player) return;

                let item = this.shop_items[item_index];

                if (this.player.gold >= item.cost) {
                    if (this.player.inventory.length < this.player.max_inventory) {
                        this.player.gold -= item.cost;
                        // Keys and food apply immediately. Other items go to inventory.
                        if (item.type === ItemType.KEY) {
                            this.player.keys_collected += 1;
                            this.add_ui_message("Bought KEY.");
                        } else if (item.type === ItemType.FOOD) {
                            this.player.life = Math.min(this.player.max_life, this.player.life + 25);
                            this.add_ui_message("Bought FOOD.");
                        } else {
                            let new_item = { x: 0, y: 0, type: item.type };
                            this.player.inventory.push(new_item);
                            this.add_ui_message(`Bought ${item.name}.`);
                        }
                    } else {
                        // Allow stacking FOOD and GOLD even if inventory area is full
                        if (item.type === ItemType.FOOD) {
                            this.player.gold -= item.cost;
                            this.player.life = Math.min(this.player.max_life, this.player.life + 25);
                            this.add_ui_message("Inventory full; Ate FOOD");
                        } else if (item.type === ItemType.GOLD) {
                            this.player.gold -= item.cost;
                            this.player.gold += GOLD_VALUE;
                            this.add_ui_message("Inventory full; Collected GOLD");
                        } else {
                            this.add_ui_message("INVENTORY FULL!");
                        }
                    }
                } else {
                    this.add_ui_message("NOT ENOUGH GOLD!");
                    this.add_ui_message(`Need ${item.cost} gold`);
                }
            }

            render_shop() {
                // First render the current game state (map + HUD) like Python version
                this.render_playing();
                this.render_ui();

                // Semi-transparent overlay like Python version (180/255 = ~70% opacity)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

                // Shop title
                ctx.fillStyle = GREEN;
                ctx.font = '32px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("COMPUTER TERMINAL", SCREEN_WIDTH / 2, 50);

                // Player gold display
                if (this.player) {
                    ctx.fillStyle = YELLOW;
                    ctx.font = '24px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText(`GOLD: ${this.player.gold}`, 80, 100);
                }

                // Display shop items with clear selection indicator
                ctx.textAlign = 'left';
                let y_pos = 150;
                for (let i = 0; i < this.shop_items.length; i++) {
                    let item = this.shop_items[i];
                    let arrow, color;
                    if (i === this.shop_selection) {
                        // Highlighted selection
                        ctx.fillStyle = 'rgba(50, 50, 100, 0.8)';
                        ctx.fillRect(60, y_pos - 26, 420, 36);
                        arrow = ">>>";
                        color = YELLOW;
                    } else {
                        arrow = "   ";
                        color = WHITE;
                    }

                    ctx.fillStyle = color;
                    ctx.font = '20px Courier New';
                    ctx.fillText(`${arrow} ${item.name} - ${item.cost} GOLD`, 80, y_pos);
                    y_pos += 30;
                }

                // Instructions overlaid on game area
                ctx.fillStyle = CYAN;
                ctx.font = '16px Courier New';
                let instructions = [
                    "ARROW KEYS: Navigate items",
                    "ENTER: Purchase selected item",
                    "ESC: Exit shop"
                ];

                let y_pos_inst = GAME_HEIGHT - 60;  // Position instructions near bottom of game area
                for (let instruction of instructions) {
                    ctx.fillText(instruction, SCREEN_WIDTH / 2 - ctx.measureText(instruction).width / 2, y_pos_inst);
                    y_pos_inst += 18;
                }
            }

            // Difficulty selection methods
            update_difficulty_select() {
                if (keysPressed['ArrowLeft'] || keysPressed['ArrowUp']) {
                    this.difficulty = (this.difficulty - 1 + 3) % 3;
                    delete keysPressed['ArrowLeft'];
                    delete keysPressed['ArrowUp'];
                } else if (keysPressed['ArrowRight'] || keysPressed['ArrowDown']) {
                    this.difficulty = (this.difficulty + 1) % 3;
                    delete keysPressed['ArrowRight'];
                    delete keysPressed['ArrowDown'];
                } else if (keysPressed['Enter']) {
                    this.state = GameState.CHARACTER_SELECT;
                    delete keysPressed['Enter'];
                }
            }

            render_difficulty_select() {
                ctx.fillStyle = YELLOW;
                ctx.font = '32px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("Select Difficulty", SCREEN_WIDTH/2, 50);

                const difficulties = [
                    { name: "WOKE", desc: "Easy - 6x potions, 1/6 monsters" },
                    { name: "MEDIUM", desc: "Medium - 3x potions, 1/3 monsters" },
                    { name: "BASED", desc: "Hard - Normal difficulty" }
                ];

                ctx.textAlign = 'left';
                let y_pos = 120;
                for (let i = 0; i < difficulties.length; i++) {
                    const diff = difficulties[i];
                    const isSelected = i === this.difficulty;

                    if (isSelected) {
                        ctx.fillStyle = GREEN;
                    } else {
                        ctx.fillStyle = WHITE;
                    }

                    ctx.font = '24px Courier New';
                    ctx.fillText(`> ${diff.name}`, 100, y_pos);

                    ctx.font = '16px Courier New';
                    ctx.fillText(`- ${diff.desc}`, 120, y_pos + 32);

                    y_pos += 80;
                }
                ctx.textAlign = 'center';
                ctx.fillStyle = WHITE;
                ctx.font = '16px Courier New';
                ctx.fillText("UP/DOWN: Change   ENTER: Continue", SCREEN_WIDTH/2, GAME_HEIGHT - 24);
            }
        }

        // Player class - PROPER CONVERSION
        class Player {
            constructor(character_class, level_num = 1) {
                this.character_class = CHARACTER_CLASSES[character_class];
                this.x = WORLD_WIDTH / 2;
                this.y = WORLD_HEIGHT / 2;
                this.max_life = 100; // PLAYER_MAX_LIFE
                this.life = this.max_life;
                this.inventory = [];
                this.max_inventory = 12; // PLAYER_MAX_INVENTORY
                this.speed = this.character_class.speed / 10;
                this.strength = this.character_class.strength;
                this.missiles = this.character_class.missiles;
                this.direction = Direction.DOWN;
                this.keys_collected = 0;
                this.gold = 500; // PLAYER_STARTING_GOLD
                this.anim_frame = 0;
                this.anim_timer = 0.0;
                this.game = null;
            }

            update(dt, keys_pressed) {
                let dx = 0, dy = 0;
                let moving = false;

                // ARROW KEYS - EXACTLY from Python!
                if (keys_pressed['ArrowLeft'] || keys_pressed['KeyA']) {
                    dx = -this.speed * dt * 60;
                    this.direction = Direction.LEFT;
                    moving = true;
                }
                if (keys_pressed['ArrowRight'] || keys_pressed['KeyD']) {
                    dx = this.speed * dt * 60;
                    this.direction = Direction.RIGHT;
                    moving = true;
                }
                if (keys_pressed['ArrowUp'] || keys_pressed['KeyW']) {
                    dy = -this.speed * dt * 60;
                    this.direction = Direction.UP;
                    moving = true;
                }
                if (keys_pressed['ArrowDown'] || keys_pressed['KeyS']) {
                    dy = this.speed * dt * 60;
                    this.direction = Direction.DOWN;
                    moving = true;
                }

                // Apply slime slow effect
                let speed_multiplier = 1.0;
                if (this.game && this.game.player_slow_timer > 0) {
                    speed_multiplier *= 0.6; // 60% speed when slowed
                    // Update slow timer
                    this.game.player_slow_timer = Math.max(0, this.game.player_slow_timer - dt);
                }
                if (this.game && this.game.status_effects['speed'] > 0) {
                    speed_multiplier *= 1.4; // 40% speed boost from potion
                }

                // Calculate new position with speed modifiers
                let new_x = this.x + dx * speed_multiplier;
                let new_y = this.y + dy * speed_multiplier;

                // Check wall collisions per axis (like Python)
                if (this.game && this.game.check_wall_collision(new_x, this.y)) {
                    new_x = this.x; // Block X movement
                }
                if (this.game && this.game.check_wall_collision(this.x, new_y)) {
                    new_y = this.y; // Block Y movement
                }

                // Update position within world bounds
                this.x = Math.max(16, Math.min(WORLD_WIDTH - 16, new_x));
                this.y = Math.max(16, Math.min(WORLD_HEIGHT - 16, new_y));

                // Animation
                if (moving) {
                    this.anim_timer += dt;
                    if (this.anim_timer > ANIMATION_FRAME_TIME) {
                        this.anim_frame = (this.anim_frame + 1) % 2;
                        this.anim_timer = 0.0;
                    }
                } else {
                    this.anim_frame = 0;
                    this.anim_timer = 0.0;
                }
            }
        }

        // Enemy class
        class Enemy {
            constructor(x, y, enemy_type, game = null) {
                this.x = x;
                this.y = y;
                this.type = enemy_type;
                this.max_life = 10; // ENEMY_MAX_LIFE
                this.life = this.max_life;
                this.speed = 0.5 * (0.7 + Math.random() * 0.6); // ENEMY_BASE_SPEED
                this.direction = Direction.DOWN;
                this.last_direction_change = Math.random();
                this.direction_change_interval = 0.8 + Math.random() * 0.6;
                this.anim_t = 0.0;
                this.hit_timer = 0.0;
                this.game = game;
            }

            update(dt) {
                this.last_direction_change += dt;
                this.anim_t += dt;
                if (this.hit_timer > 0) {
                    this.hit_timer -= dt;
                }

                if (this.last_direction_change > this.direction_change_interval) {
                    // Check if player is invisible
                    let player_invisible = this.game && this.game.status_effects && this.game.status_effects['invis'] > 0;

                    if (player_invisible) {
                        // Random movement when player is invisible
                        this.direction = Object.values(Direction)[Math.floor(Math.random() * 4)];
                    } else {
                        // Move toward player when visible
                        if (this.game && this.game.player) {
                            let player = this.game.player;
                            let dx_to_player = player.x - this.x;
                            let dy_to_player = player.y - this.y;

                            // Add some randomness to prevent perfect synchronization
                            if (Math.random() < 0.3) {  // 30% chance for random movement even when chasing
                                this.direction = Object.values(Direction)[Math.floor(Math.random() * 4)];
                            } else {
                                // Determine primary direction toward player
                                if (Math.abs(dx_to_player) > Math.abs(dy_to_player)) {
                                    // Move horizontally toward player
                                    this.direction = dx_to_player > 0 ? Direction.RIGHT : Direction.LEFT;
                                } else {
                                    // Move vertically toward player
                                    this.direction = dy_to_player > 0 ? Direction.DOWN : Direction.UP;
                                }
                            }
                        } else {
                            // Fallback to random if no player

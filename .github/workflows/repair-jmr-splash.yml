name: Repair JMR Original launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-jmr-splash.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair truncated script tail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('JMR-original/index.html')
          s=p.read_text()
          bad='document.addEventListener'
          assert s.rstrip().endswith(bad), 'Unexpected file state; refusing blind repair'
          tail="""document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();else setTimeout(cleanOverlay,100)});addEventListener('blur',releaseAll);
          document.getElementById('play').onclick=()=>{const start=()=>{const native=[...game.querySelectorAll('*')].find(e=>(e.textContent||'').trim()==='PLAY GAUNTLET');if(native){native.click();return true}return false};document.getElementById('play').textContent='STARTING…';let tries=0;const timer=setInterval(()=>{tries++;if(start()){clearInterval(timer);document.getElementById('start').classList.add('hidden')}else if(tries>80){clearInterval(timer);document.getElementById('play').textContent='PLAY';status.textContent='Game is still loading. Tap PLAY again.'}},100)};
          (async()=>{try{const romUrl='./Gauntlet-The-Third-Encounter.lnx?sha='+SHA.slice(0,12),r=await fetch(romUrl,{cache:'no-cache'});if(!r.ok)throw Error('Cartridge download failed');const bytes=await r.arrayBuffer();if(bytes.byteLength!==131136)throw Error('Incomplete cartridge');const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(digest!==SHA)throw Error('Cartridge checksum mismatch');Object.assign(window,{JMR_romVerified:true,EJS_player:'#game',EJS_core:'handy',EJS_gameUrl:romUrl,EJS_gameName:'Gauntlet JMR Original',EJS_gameID:19900908,EJS_pathtodata:'./vendor/emulatorjs-4.2.3/',EJS_startOnLoaded:false,EJS_startButtonName:'PLAY GAUNTLET',EJS_alignStartButton:'center',EJS_color:'#d7263d',EJS_volume:.8,EJS_controlScheme:'lynx',EJS_threads:false,EJS_backgroundColor:'#000',EJS_disableLocalStorage:true,EJS_VirtualGamepadSettings:[],EJS_defaultOptions:{handy_rot:'270'}});window.EJS_defaultControls={0:{0:{value:'x',value2:'BUTTON_2'},8:{value:'z',value2:'BUTTON_1'},3:{value:'enter',value2:'START'},4:{value:'up arrow',value2:'DPAD_UP'},5:{value:'down arrow',value2:'DPAD_DOWN'},6:{value:'left arrow',value2:'DPAD_LEFT'},7:{value:'right arrow',value2:'DPAD_RIGHT'},10:{value:'q',value2:'LEFT_TOP_SHOULDER'},11:{value:'w',value2:'RIGHT_TOP_SHOULDER'}},1:{},2:{},3:{}};window.EJS_Buttons=Object.fromEntries(['playPause','restart','mute','settings','fullscreen','saveState','loadState','screenRecord','gamepad','cheat','volume','saveSavFiles','loadSavFiles','quickSave','quickLoad','screenshot','cacheManager','exitEmulation','contextMenu'].map(k=>[k,{visible:false}]));window.EJS_onGameStart=()=>{started=true;document.getElementById('start').classList.add('hidden');fit();choose(mode);status.textContent='Drag to move · Tap to fire'};window.EJS_ready=()=>{status.textContent='Ready. Tap PLAY.'};const loader=document.createElement('script');loader.src=window.EJS_pathtodata+'loader.js';loader.onerror=()=>status.textContent='Emulator failed to load. Reload to retry.';document.body.appendChild(loader)}catch(e){console.error(e);status.textContent=e.message;document.getElementById('play').textContent='RETRY'}})();
          </script></body></html>
          """
          p.write_text(s.rstrip()[:-len(bad)]+tail)
          PY
      - name: Syntax sanity check
        run: |
          grep -q "EJS_onGameStart" JMR-original/index.html
          grep -q "</html>" JMR-original/index.html
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JMR-original/index.html
          git commit -m 'Fix frozen splash caused by truncated launcher'
          git push origin HEAD:main

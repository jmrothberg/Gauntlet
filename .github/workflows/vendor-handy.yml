name: Vendor Handy runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-handy.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download verified upstream release
        run: |
          curl -fL --retry 3 'https://github.com/EmulatorJS/EmulatorJS/releases/download/v4.2.3/4.2.3.7z' -o /tmp/emulatorjs.7z
          echo '07d451bc06fa3ad04ab30d9b94eb63ac34ad0babee52d60357b002bde8f3850b  /tmp/emulatorjs.7z' | sha256sum -c -
          7z x -y /tmp/emulatorjs.7z -o/tmp/emulatorjs-release > /tmp/extract.log
      - name: Retain only the Lynx runtime and patch optional recording
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil
          root=pathlib.Path('JMR-original/vendor/emulatorjs-4.2.3')
          release=pathlib.Path('/tmp/emulatorjs-release')
          loaders=list(release.rglob('loader.js'))
          assert loaders, 'No loader in release'
          data=loaders[0].parent
          manifest={}
          for src in data.rglob('*'):
            if not src.is_file():continue
            rel=src.relative_to(data)
            if rel.parts[0]=='cores' and 'handy' not in src.name:continue
            if src.suffix in ['.zip','.7z']:continue
            dst=root/rel;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)
            manifest[str(rel)]={'upstream_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'bytes':src.stat().st_size}
          assert (root/'cores/handy-wasm.data').stat().st_size>100000
          for p in [root/'emulator.min.js',root/'src/emulator.js']:
            if not p.exists():continue
            txt=p.read_text()
            txt,n=re.subn(r'MediaRecorder\.isTypeSupported\(([^()]*)\)',r'(typeof MediaRecorder!=="undefined"&&MediaRecorder.isTypeSupported(\1))',txt)
            assert n>0, str(p)
            p.write_text('/* JMR compatibility patch: guard optional MediaRecorder. See PATCHES.md. */\n'+txt)
          for src in release.rglob('*'):
            if src.is_file() and src.name.lower().startswith(('license','copying')) and 'node_modules' not in str(src):
              dst=root/'licenses'/src.relative_to(release);dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)
          for rel,entry in manifest.items():entry['served_sha256']=hashlib.sha256((root/rel).read_bytes()).hexdigest()
          (root/'manifest.json').write_text(json.dumps({'release':'https://github.com/EmulatorJS/EmulatorJS/releases/tag/v4.2.3','archive_sha256':'07d451bc06fa3ad04ab30d9b94eb63ac34ad0babee52d60357b002bde8f3850b','files':manifest},indent=2)+'\n')
          (root/'PATCHES.md').write_text('# EmulatorJS 4.2.3 + Handy\n\nRuntime copied from the checksum-verified upstream 4.2.3 release. Only Handy core binaries are retained. Original source files and license notices from the release are included.\n\nJMR compatibility change: guard `MediaRecorder.isTypeSupported(x)` with `typeof MediaRecorder!=="undefined"`. An optional screen-recording API must not prevent starting a cartridge. Recording controls are disabled by the launcher. Both the minified runtime and unminified emulator source receive the same change. The workflow in `.github/workflows/vendor-handy.yml` reproduces the patch; `manifest.json` records upstream and served hashes.\n\nUpstream frontend source: https://github.com/EmulatorJS/EmulatorJS/tree/v4.2.3\nHandy source: https://github.com/libretro/libretro-handy\nCore build information: `cores/reports/handy.json`.\n')
          print('Retained',len(manifest),'runtime/source files; total bytes',sum(p.stat().st_size for p in root.rglob('*') if p.is_file()))
          print('Runtime files:',list(manifest))
          PY
      - name: Commit runtime without changing other games
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JMR-original/vendor/
          if ! git diff --cached --quiet; then
            git commit -m 'Self-host pinned Handy runtime; guard optional recording API'
            git push origin HEAD:main
          fi

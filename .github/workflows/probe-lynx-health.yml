name: Probe Lynx health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-lynx-health.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure health and save diagnostic states
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          cat > probe-health.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');fs.mkdirSync('health-results',{recursive:true});
          (async()=>{
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:820,height:1180},hasTouch:true});
          const logs=[];page.on('pageerror',e=>logs.push(String(e)));
          await page.goto('http://127.0.0.1:8080/JMR-original/');
          await page.getByText('PLAY GAUNTLET',{exact:true}).click();
          await page.waitForFunction(()=>window.EJS_emulator?.gameManager&&document.body.classList.contains('started'));
          await page.waitForTimeout(4500);
          const details=await page.evaluate(()=>{const g=EJS_emulator.gameManager,m=g.Module;return {exports:Object.keys(m).filter(k=>typeof m[k]==='function'),moduleKeys:Object.keys(m),settings:EJS_emulator.settings,options:g.functions.getCoreOptions(),cfg:g.FS.readFile('/home/web_user/.config/retroarch/retroarch.cfg',{encoding:'utf8'})};});
          fs.writeFileSync('health-results/runtime.json',JSON.stringify(details,null,2));
          let frames=[];
          async function snap(name){
            const data=await page.evaluate(()=>({state:Array.from(EJS_emulator.gameManager.getState()),frame:EJS_emulator.gameManager.functions.getFrameNum(),time:performance.now(),held:Array.from(held.entries()),paused:EJS_emulator.paused}));
            fs.writeFileSync('health-results/'+name+'.state',Buffer.from(data.state));delete data.state;frames.push({name,...data});
            await page.screenshot({path:'health-results/'+name+'.png'});
          }
          await snap('boot');
          for(let i=0;i<4;i++){await page.locator('#button-a').click({delay:180});await page.waitForTimeout(1200);await snap('step'+i);}
          for(let i=0;i<12;i++){await page.waitForTimeout(2500);await snap('idle'+i);}
          await page.locator('#help').click();await snap('help-before');await page.waitForTimeout(4000);await snap('help-after');await page.locator('#close-help').click();
          const r=await page.locator('#dpad').boundingBox();await page.mouse.move(r.x+r.width/2,r.y+8);await page.mouse.down();await page.waitForTimeout(2400);await page.mouse.up();await snap('moved-up');
          for(let i=0;i<8;i++){await page.waitForTimeout(2200);await snap('enemy'+i);}
          fs.writeFileSync('health-results/timing.json',JSON.stringify({frames,logs},null,2));
          console.log(JSON.stringify({frames,logs}));
          await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node probe-health.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lynx-health-probe
          path: health-results/
          retention-days: 7

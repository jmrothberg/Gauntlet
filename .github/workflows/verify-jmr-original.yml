name: Verify JMR Original
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JMR-original/**'
      - '.github/workflows/verify-jmr-original.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact cartridge
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          rom=pathlib.Path('JMR-original/Gauntlet-The-Third-Encounter.lnx').read_bytes()
          assert len(rom)==131136, len(rom)
          assert hashlib.sha256(rom).hexdigest()=='21a83624a636fde4d6f6a01363ebd7644dd5c3da19013525aae11ff0aeb2eb60'
          print('Original cartridge: length and SHA-256 verified')
          PY
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium webkit
      - name: Run the cartridge in Chromium and WebKit
        run: |
          python3 -m http.server 8080 > /tmp/gauntlet-server.log 2>&1 &
          mkdir -p browser-results
          cat > /tmp/unused-placeholder <<'EOF'
          EOF
          cat > verify-original.cjs <<'JS'
          const {chromium,webkit}=require('playwright');
          const fs=require('fs');
          const {PNG}=require('pngjs');
          (async()=>{
            let failed=false;
            for(const [name,type] of Object.entries({chromium,webkit})){
              const logs=[]; let browser;
              const result={browser:name};
              try{
                browser=await type.launch({headless:true});
                const context=await browser.newContext({viewport:{width:820,height:1180},hasTouch:true,isMobile:true,deviceScaleFactor:1});
                const page=await context.newPage();
                page.on('console',m=>logs.push(m.type()+': '+m.text()));
                page.on('pageerror',e=>logs.push('PAGE ERROR: '+String(e)));
                page.on('requestfailed',r=>logs.push('REQUEST FAILED: '+r.url()+' '+JSON.stringify(r.failure())));
                page.on('response',r=>{if(r.status()>=400)logs.push('HTTP '+r.status()+' '+r.url());});
                await page.goto('http://127.0.0.1:8080/JMR-original/',{waitUntil:'domcontentloaded',timeout:60000});
                await page.getByText('PLAY GAUNTLET',{exact:true}).click({timeout:60000});
                await page.waitForTimeout(18000);
                result.text=await page.locator('body').innerText();
                result.started=await page.locator('body').evaluate(b=>b.classList.contains('started'));
                result.canvases=await page.locator('canvas').evaluateAll(cs=>cs.map(c=>({width:c.width,height:c.height,rect:c.getBoundingClientRect().toJSON()})));
                await page.screenshot({path:`browser-results/${name}-boot.png`});
                if(await page.locator('canvas').count()){
                  const image=await page.locator('canvas').first().screenshot();
                  fs.writeFileSync(`browser-results/${name}-frame.png`,image);
                  const png=PNG.sync.read(image),colors=new Set();let lit=0,magenta=0;
                  for(let i=0;i<png.data.length;i+=4){const r=png.data[i],g=png.data[i+1],b=png.data[i+2];colors.add((r<<16)|(g<<8)|b);if(r+g+b>40)lit++;if(r>100&&b>100&&g<50)magenta++;}
                  result.colors=colors.size;result.lit=lit/(png.width*png.height);result.magenta=magenta/(png.width*png.height);
                  result.rendered=result.colors>=8&&result.lit>0.02&&result.magenta<0.35;
                }
                for(let i=0;i<3;i++){await page.keyboard.press('z');await page.waitForTimeout(1500);}
                await page.keyboard.down('ArrowUp');await page.waitForTimeout(1000);await page.keyboard.up('ArrowUp');
                await page.keyboard.press('z');await page.waitForTimeout(2500);
                await page.screenshot({path:`browser-results/${name}-after-input.png`});
                result.touchElements=await page.locator('[class*="virtual"], [class*="dpad"]').count();
                if(!result.started||!result.rendered)failed=true;
              }catch(e){result.error=String(e);failed=true;}
              finally{if(browser)await browser.close();fs.writeFileSync(`browser-results/${name}.json`,JSON.stringify({result,logs},null,2));console.log(JSON.stringify({result,logs}));}
            }
            if(failed)process.exitCode=1;
          })();
          JS
          node verify-original.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-browser-results
          path: browser-results/
          retention-days: 7

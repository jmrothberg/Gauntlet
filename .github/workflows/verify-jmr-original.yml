name: Verify JMR Original
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JMR-original/**'
      - 'tools/verify_original.cjs'
      - '.github/workflows/verify-jmr-original.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact cartridge
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          rom=pathlib.Path('JMR-original/Gauntlet-The-Third-Encounter.lnx').read_bytes()
          assert len(rom)==131136, len(rom)
          assert hashlib.sha256(rom).hexdigest()=='21a83624a636fde4d6f6a01363ebd7644dd5c3da19013525aae11ff0aeb2eb60'
          print('Original cartridge: length and SHA-256 verified')
          PY
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Run cartridge and test controls in both browser engines
        run: |
          python3 -m http.server 8080 > /tmp/gauntlet-server.log 2>&1 &
          node tools/verify_original.cjs
      - name: Verify published share link in both engines
        run: |
          mv browser-results local-results
          GAME_URL='https://jmrothberg.github.io/Gauntlet/JMR-original/?verified=20260908' node tools/verify_original.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-browser-results
          path: |
            browser-results/
            local-results/
          retention-days: 7

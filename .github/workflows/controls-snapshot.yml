name: Controls runtime snapshot
on:
  push:
    branches: ['fix/verified-touch-controls']
    paths: ['.github/workflows/controls-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: controls-runtime-snapshot
          path: JMR-original/
          retention-days: 7

name: Repair Lynx controller maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-lynx-controls.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete controller map structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('JMR-original/index.html')
          s=p.read_text()
          marker='window.EJS_Buttons=Object.fromEntries('
          patch='Object.assign(window.EJS_defaultControls,{1:{},2:{},3:{}});\n'
          assert marker in s
          if patch not in s:
            p.write_text(s.replace(marker,patch+marker,1))
          PY
      - name: Commit targeted correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JMR-original/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Complete four controller maps required by EmulatorJS 4.2.3'
            git push origin HEAD:main
          fi
